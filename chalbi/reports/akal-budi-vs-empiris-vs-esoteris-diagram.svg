<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img">
  <title>Akal-Budi vs Empiris vs Esoteris — Tiga Jalan Menuju Pengetahuan</title>
  <desc>Diagram filosofis menunjukkan tiga jalan pengetahuan: Rasionalitas (akal-budi), Empiris (pengalaman indrawi), dan Esoteris (pengetahuan mistis), serta sintesis ketiganya.</desc>

  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>

    <!-- Akal-Budi: Emerald/Teal -->
    <linearGradient id="akalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="akalGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Empiris: Amber/Orange -->
    <linearGradient id="empirisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>
    <filter id="empirisGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Esoteris: Purple/Violet -->
    <linearGradient id="esoterisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <filter id="esoterisGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Synthesis: Gold/White -->
    <linearGradient id="synthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd60a"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>

    <!-- Triangle fill gradient -->
    <linearGradient id="triGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="18"/>

  <!-- Decorative circles (mandala-like background) -->
  <circle cx="450" cy="300" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <circle cx="450" cy="300" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="450" cy="300" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Central triangle connecting the three paths -->
  <polygon points="450,120 200,460 700,460" fill="url(#triGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Center synthesis circle -->
  <circle cx="450" cy="300" r="68" fill="#1a1a2e" stroke="url(#synthGrad)" stroke-width="3"/>
  <circle cx="450" cy="300" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="450" y="290" text-anchor="middle" fill="#ffd60a" font-size="13" font-weight="bold" font-family="Georgia, serif">SINTESIS</text>
  <text x="450" y="308" text-anchor="middle" fill="#ffffff" font-size="11" font-family="Georgia, serif" opacity="0.8">*Insan Kamil*</text>
  <text x="450" y="324" text-anchor="middle" fill="#ffffff" font-size="10" font-family="Georgia, serif" opacity="0.6">Jalan Lengkap</text>

  <!-- Connecting lines from center to each circle -->
  <line x1="450" y1="232" x2="450" y2="150" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="385" y1="344" x2="250" y2="420" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="515" y1="344" x2="650" y2="420" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== AKAL-BUDI (TOP) ===== -->
  <g transform="translate(450,105)" filter="url(#akalGlow)">
    <!-- Outer ring -->
    <circle r="78" fill="#0d0d1a" stroke="url(#akalGrad)" stroke-width="2.5"/>
    <circle r="70" fill="none" stroke="#00b4d8" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Icon: balance scale / mind -->
    <path d="M0,-45 L0,-20 M-22,-5 L22,-5 M-30,15 L30,15" stroke="#00b4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0,-20 C-12,-20 -12,-5 0,-5 C12,-5 12,-20 0,-20" fill="#00b4d8" opacity="0.5"/>
    <circle cy="-55" r="4" fill="#00b4d8"/>
    <text y="38" text-anchor="middle" fill="#00b4d8" font-size="14" font-weight="bold" font-family="Georgia, serif">AKAL-BUDI</text>
    <text y="54" text-anchor="middle" fill="#90e0ef" font-size="10" font-family="Georgia, serif">Rasionalitas</text>
  </g>

  <!-- ===== EMPIRIS (BOTTOM LEFT) ===== -->
  <g transform="translate(200,470)" filter="url(#empirisGlow)">
    <!-- Outer ring -->
    <circle r="78" fill="#0d0d1a" stroke="url(#empirisGrad)" stroke-width="2.5"/>
    <circle r="70" fill="none" stroke="#ffb703" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Icon: eye -->
    <ellipse cy="-8" rx="28" ry="18" fill="none" stroke="#ffb703" stroke-width="2.5"/>
    <circle cy="-8" r="10" fill="none" stroke="#ffb703" stroke-width="2"/>
    <circle cy="-8" r="4" fill="#e85d04"/>
    <text y="40" text-anchor="middle" fill="#ffb703" font-size="14" font-weight="bold" font-family="Georgia, serif">EMPIRIS</text>
    <text y="56" text-anchor="middle" fill="#ffd60a" font-size="10" font-family="Georgia, serif">Pengalaman Indrawi</text>
  </g>

  <!-- ===== ESOTERIS (BOTTOM RIGHT) ===== -->
  <g transform="translate(700,470)" filter="url(#esoterisGlow)">
    <!-- Outer ring -->
    <circle r="78" fill="#0d0d1a" stroke="url(#esoterisGrad)" stroke-width="2.5"/>
    <circle r="70" fill="none" stroke="#9b5de5" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Icon: star / heart with rays -->
    <path d="M0,-45 L5,-20 L28,-20 L10,-3 L18,22 L0,10 L-18,22 L-10,-3 L-28,-20 L-5,-20 Z"
          fill="#9b5de5" opacity="0.7" stroke="#9b5de5" stroke-width="1.5"/>
    <circle r="14" fill="#0d0d1a" stroke="#9b5de5" stroke-width="2"/>
    <text y="2" text-anchor="middle" fill="#c77dff" font-size="13" font-weight="bold">✦</text>
    <text y="40" text-anchor="middle" fill="#9b5de5" font-size="14" font-weight="bold" font-family="Georgia, serif">ESOTERIS</text>
    <text y="56" text-anchor="middle" fill="#c77dff" font-size="10" font-family="Georgia, serif">Pengetahuan Mistis</text>
  </g>

  <!-- ===== SIDE ANNOTATIONS ===== -->

  <!-- Left annotation box: AKAL -->
  <g transform="translate(30,160)">
    <rect width="150" height="115" rx="8" fill="#0d0d1a" stroke="#00b4d8" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#akalGrad)"/>
    <text x="12" y="28" fill="#00b4d8" font-size="11" font-weight="bold" font-family="Georgia, serif">KEKUATAN</text>
    <text x="12" y="46" fill="#90e0ef" font-size="9.5" font-family="Georgia, serif">• Logika &amp; deduksi</text>
    <text x="12" y="60" fill="#90e0ef" font-size="9.5" font-family="Georgia, serif">• Kategorisasi</text>
    <text x="12" y="74" fill="#90e0ef" font-size="9.5" font-family="Georgia, serif">• Prediksi &amp; hukum</text>
    <text x="12" y="92" fill="#00b4d8" font-size="11" font-weight="bold" font-family="Georgia, serif">BATASAN</text>
    <text x="12" y="108" fill="#6ea8cc" font-size="9.5" font-family="Georgia, serif">• Tak sentuh makna</text>
  </g>

  <!-- Middle annotation box: EMPIRIS -->
  <g transform="translate(375,480)">
    <rect width="150" height="115" rx="8" fill="#0d0d1a" stroke="#ffb703" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#empirisGrad)"/>
    <text x="12" y="28" fill="#ffb703" font-size="11" font-weight="bold" font-family="Georgia, serif">KEKUATAN</text>
    <text x="12" y="46" fill="#ffd60a" font-size="9.5" font-family="Georgia, serif">• Verifikasi objektif</text>
    <text x="12" y="60" fill="#ffd60a" font-size="9.5" font-family="Georgia, serif">• Replikasi &amp; bukti</text>
    <text x="12" y="74" fill="#ffd60a" font-size="9.5" font-family="Georgia, serif">• Teknologi</text>
    <text x="12" y="92" fill="#ffb703" font-size="11" font-weight="bold" font-family="Georgia, serif">BATASAN</text>
    <text x="12" y="108" fill="#cc9a00" font-size="9.5" font-family="Georgia, serif">• Tak sentuh nilai</text>
  </g>

  <!-- Right annotation box: ESOTERIS -->
  <g transform="translate(720,160)">
    <rect width="150" height="115" rx="8" fill="#0d0d1a" stroke="#9b5de5" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#esoterisGrad)"/>
    <text x="12" y="28" fill="#9b5de5" font-size="11" font-weight="bold" font-family="Georgia, serif">KEKUATAN</text>
    <text x="12" y="46" fill="#c77dff" font-size="9.5" font-family="Georgia, serif">• Makna &amp; tujuan</text>
    <text x="12" y="60" fill="#c77dff" font-size="9.5" font-family="Georgia, serif">• Transenden</text>
    <text x="12" y="74" fill="#c77dff" font-size="9.5" font-family="Georgia, serif">• Kesatuan eksistensi</text>
    <text x="12" y="92" fill="#9b5de5" font-size="11" font-weight="bold" font-family="Georgia, serif">BATASAN</text>
    <text x="12" y="108" fill="#7b2cbf" font-size="9.5" font-family="Georgia, serif">• Sulit diverifikasi</text>
  </g>

  <!-- Rumi quote at bottom center -->
  <g transform="translate(450,570)">
    <text text-anchor="middle" fill="#ffffff" font-size="10" font-style="italic" font-family="Georgia, serif" opacity="0.5">«هر سه یک راه است و یک مقصد / عقل و عشق و چشم در این وصف»</text>
    <text y="16" text-anchor="middle" fill="#ffd60a" font-size="9" font-family="Georgia, serif" opacity="0.7">— Rumi, Masnavi Daftar VI</text>
  </g>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold" font-family="Georgia, serif" letter-spacing="1">TIGA JALAN MENUJU PENGETAHUAN</text>
  <text y="58" text-anchor="middle" fill="#ffffff" font-size="11" font-family="Georgia, serif" opacity="0.5">Akal-Budi  ·  Empiris  ·  Esoteris  ·  Sintesis</text>

  <!-- Small corner labels -->
  <text x="20" y="610" fill="#ffffff" font-size="8" opacity="0.25" font-family="Georgia, serif">Chalbi © 2026</text>
  <text x="880" y="610" text-anchor="end" fill="#ffffff" font-size="8" opacity="0.25" font-family="Georgia, serif">labsdigital.github.io/hermes</text>
</svg>
