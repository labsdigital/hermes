<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="neuronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#0d1b2a"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="22" font-weight="bold">Arsitektur Neural Network</text>
  
  <!-- Input layer -->
  <g transform="translate(100, 150)">
    <text x="0" y="-20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="14" font-weight="bold">Lapisan Masukan</text>
    <circle cx="0" cy="0" r="25" fill="url(#neuronGrad)" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Inter" font-size="10">x₁</text>
    
    <circle cx="0" cy="60" r="25" fill="url(#neuronGrad)" opacity="0.8"/>
    <text x="0" y="65" text-anchor="middle" fill="#fff" font-family="Inter" font-size="10">x₂</text>
    
    <circle cx="0" cy="120" r="25" fill="url(#neuronGrad)" opacity="0.8"/>
    <text x="0" y="125" text-anchor="middle" fill="#fff" font-family="Inter" font-size="10">x₃</text>
    
    <circle cx="0" cy="180" r="25" fill="url(#neuronGrad)" opacity="0.8"/>
    <text x="0" y="185" text-anchor="middle" fill="#fff" font-family="Inter" font-size="10">xₙ</text>
  </g>
  
  <!-- Hidden layer 1 -->
  <g transform="translate(300, 120)">
    <text x="0" y="-20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="14" font-weight="bold">Tersembunyi 1</text>
    <circle cx="0" cy="30" r="20" fill="#ffd700" opacity="0.7"/>
    <circle cx="0" cy="90" r="20" fill="#ffd700" opacity="0.7"/>
    <circle cx="0" cy="150" r="20" fill="#ffd700" opacity="0.7"/>
    <circle cx="0" cy="210" r="20" fill="#ffd700" opacity="0.7"/>
  </g>
  
  <!-- Hidden layer 2 -->
  <g transform="translate(500, 150)">
    <text x="0" y="-20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="14" font-weight="bold">Tersembunyi 2</text>
    <circle cx="0" cy="30" r="18" fill="#00b4d8" opacity="0.7"/>
    <circle cx="0" cy="90" r="18" fill="#00b4d8" opacity="0.7"/>
    <circle cx="0" cy="150" r="18" fill="#00b4d8" opacity="0.7"/>
  </g>
  
  <!-- Output layer -->
  <g transform="translate(680, 120)">
    <text x="0" y="-20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="14" font-weight="bold">Output</text>
    <circle cx="0" cy="60" r="25" fill="#e94560" opacity="0.9"/>
    <text x="0" y="65" text-anchor="middle" fill="#fff" font-family="Inter" font-size="10">y</text>
  </g>
  
  <!-- Connections -->
  <g stroke="#444" stroke-width="1" opacity="0.5">
    <!-- Input to Hidden 1 -->
    <line x1="125" y1="150" x2="280" y2="150"/>
    <line x1="125" y1="210" x2="280" y2="210"/>
    <line x1="125" y1="270" x2="280" y2="150"/>
    <line x1="125" y1="330" x2="280" y2="270"/>
    
    <!-- Hidden 1 to Hidden 2 -->
    <line x1="320" y1="150" x2="482" y2="180"/>
    <line x1="320" y1="210" x2="482" y2="240"/>
    <line x1="320" y1="270" x2="482" y2="180"/>
    
    <!-- Hidden 2 to Output -->
    <line x1="518" y1="180" x2="655" y2="180"/>
    <line x1="518" y1="240" x2="655" y2="180"/>
  </g>
  
  <!-- Backpropagation arrow -->
  <path d="M 680 450 Q 400 520 100 450" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="400" y="500" text-anchor="middle" fill="#ffd700" font-family="Inter" font-size="14">Backpropagation: Error mengalir mundur</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ffd700"/>
    </marker>
  </defs>
  
  <!-- Key terms -->
  <g transform="translate(50, 540)">
    <rect width="150" height="30" rx="5" fill="#16213e"/>
    <text x="75" y="20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="11">Parameter: Ratusan Miliar</text>
  </g>
  <g transform="translate(220, 540)">
    <rect width="150" height="30" rx="5" fill="#16213e"/>
    <text x="75" y="20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="11">Training: Jutaan Iterasi</text>
  </g>
  <g transform="translate(390, 540)">
    <rect width="150" height="30" rx="5" fill="#16213e"/>
    <text x="75" y="20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="11">Loss: Selisih Prediksi</text>
  </g>
  <g transform="translate(560, 540)">
    <rect width="150" height="30" rx="5" fill="#16213e"/>
    <text x="75" y="20" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="11">Gradient: Arah Perbaikan</text>
  </g>
</svg>
