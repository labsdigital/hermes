<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title">
  <title id="title">Diagram Privasi di Era Mesin Pengetahuan</title>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Ekosistem Privasi Digital</text>
  
  <!-- Human silhouette (left) -->
  <g transform="translate(100, 200)">
    <circle cx="50" cy="30" r="25" fill="url(#grad1)" filter="url(#shadow)"/>
    <path d="M25,70 Q50,120 75,70 L70,140 L30,140 Z" fill="url(#grad1)" filter="url(#shadow)"/>
    <text x="50" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#555">Individu</text>
  </g>
  
  <!-- Data streams -->
  <g stroke="#999" stroke-width="1.5" fill="none" stroke-dasharray="5,5">
    <path d="M180,200 Q250,180 300,220" />
    <path d="M180,230 Q250,250 300,260" />
    <path d="M180,260 Q250,320 300,300" />
  </g>
  
  <!-- Arrows -->
  <polygon points="300,215 310,220 300,225" fill="#667eea"/>
  <polygon points="300,255 310,260 300,265" fill="#667eea"/>
  <polygon points="300,295 310,300 300,305" fill="#667eea"/>
  
  <!-- AI Engine (center) -->
  <g transform="translate(320, 200)">
    <rect width="160" height="120" rx="16" fill="white" stroke="url(#grad2)" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="40" cy="40" r="15" fill="#f5576c" opacity="0.8"/>
    <circle cx="100" cy="40" r="15" fill="#f093fb" opacity="0.8"/>
    <circle cx="70" cy="80" r="15" fill="#667eea" opacity="0.8"/>
    <line x1="55" y1="40" x2="85" y2="80" stroke="#ccc" stroke-width="1.5"/>
    <line x1="85" y1="40" x2="55" y2="80" stroke="#ccc" stroke-width="1.5"/>
    <line x1="40" y1="55" x2="100" y2="55" stroke="#ccc" stroke-width="1.5"/>
    <text x="80" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">Mesin AI</text>
  </g>
  
  <!-- Corporate/Data brokers (right) -->
  <g transform="translate(520, 180)">
    <rect width="120" height="50" rx="10" fill="white" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">Korporasi</text>
    <text x="60" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">Data Brokers</text>
  </g>
  
  <!-- Government (right bottom) -->
  <g transform="translate(520, 270)">
    <rect width="120" height="50" rx="10" fill="white" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">Pemerintah</text>
    <text x="60" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">Pengawasan</text>
  </g>
  
  <!-- Feedback loops -->
  <g stroke="#f5576c" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M640,200 Q700,180 720,220 Q740,260 680,280" stroke-dasharray="3,3"/>
    <path d="M640,300 Q700,320 720,280 Q740,240 680,220" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Arrows back -->
  <polygon points="640,215 630,220 640,225" fill="#f5576c"/>
  <polygon points="640,285 630,280 640,275" fill="#f5576c"/>
  
  <!-- Labels -->
  <text x="240" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#888">Data</text>
  <text x="240" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#888">Profile</text>
  <text x="660" y="195" font-family="system-ui, sans-serif" font-size="10" fill="#f5576c">Prediksi</text>
  <text x="660" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#f5576c">Manipulasi</text>
  
  <!-- Bottom legend -->
  <g transform="translate(40, 440)">
    <rect width="12" height="12" rx="2" fill="#667eea"/>
    <text x="20" y="11" font-family="system-ui, sans-serif" font-size="11" fill="#555">Ekstraksi Data</text>
    
    <rect x="150" width="12" height="12" rx="2" fill="#f5576c"/>
    <text x="170" y="11" font-family="system-ui, sans-serif" font-size="11" fill="#555">Feedback Loop</text>
    
    <rect x="300" width="12" height="12" rx="2" fill="white" stroke="#ccc"/>
    <text x="315" y="11" font-family="system-ui, sans-serif" font-size="11" fill="#555">Entitas Pengamat</text>
  </g>
</svg>
