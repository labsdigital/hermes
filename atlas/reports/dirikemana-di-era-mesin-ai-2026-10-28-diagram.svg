<div style="text-align: center; margin: 40px 0;">
```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0a500"/>
      <stop offset="100%" style="stop-color:#cf7500"/>
    </linearGradient>
    <linearGradient id="machineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e0e0e0" font-family="Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="2">DIRI YANG TERSISA</text>
  
  <!-- Human side - left -->
  <g transform="translate(120, 250)">
    <!-- Human figure - abstract -->
    <circle cx="0" cy="-60" r="45" fill="none" stroke="url(#humanGrad)" stroke-width="2" opacity="0.9"/>
    <path d="M-30,0 Q0,-20 30,0 L20,80 Q0,90 -20,80 Z" fill="none" stroke="url(#humanGrad)" stroke-width="2" opacity="0.9"/>
    <!-- Brain waves -->
    <path d="M-60,-60 Q-50,-80 -40,-60 Q-30,-40 -20,-60" fill="none" stroke="#f0a500" stroke-width="1.5" opacity="0.6"/>
    <path d="M20,-60 Q30,-80 40,-60 Q50,-40 60,-60" fill="none" stroke="#f0a500" stroke-width="1.5" opacity="0.6"/>
    <!-- Labels -->
    <text x="0" y="110" text-anchor="middle" fill="#f0a500" font-family="Inter, sans-serif" font-size="14" font-weight="600">MANUSIA</text>
    <text x="0" y="130" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="11">Qualia · Ragu · Menderita · Mencari Makna</text>
  </g>
  
  <!-- Machine side - right -->
  <g transform="translate(680, 250)">
    <!-- Machine figure - geometric -->
    <rect x="-45" y="-70" width="90" height="70" rx="8" fill="none" stroke="url(#machineGrad)" stroke-width="2" opacity="0.9"/>
    <line x1="-30" y1="-35" x2="30" y2="-35" stroke="#4fc3f7" stroke-width="1.5" opacity="0.7"/>
    <line x1="-30" y1="-18" x2="30" y2="-18" stroke="#4fc3f7" stroke-width="1.5" opacity="0.7"/>
    <circle cx="-15" cy="-50" r="4" fill="#4fc3f7" opacity="0.8"/>
    <circle cx="15" cy="-50" r="4" fill="#4fc3f7" opacity="0.8"/>
    <!-- Circuit patterns -->
    <path d="M-45,10 L-20,10 L-10,25 L10,25 L20,10 L45,10" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>
    <path d="M-45,25 L-25,25 L-15,40 L15,40 L25,25 L45,25" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>
    <!-- Body -->
    <path d="M-25,0 L-20,80 L20,80 L25,0" fill="none" stroke="url(#machineGrad)" stroke-width="2" opacity="0.9"/>
    <!-- Labels -->
    <text x="0" y="110" text-anchor="middle" fill="#4fc3f7" font-family="Inter, sans-serif" font-size="14" font-weight="600">MESIN</text>
    <text x="0" y="130" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="11">Data · Pola · Simulasi · Output</text>
  </g>
  
  <!-- Mirror/connection in center -->
  <g transform="translate(400, 250)">
    <!-- Mirror line -->
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#fff" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
    <!-- Reflection arrows -->
    <path d="M-30,-40 Q0,-60 30,-40" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <path d="M-30,40 Q0,60 30,40" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <!-- Center text -->
    <text x="0" y="-120" text-anchor="middle" fill="#e0e0e0" font-family="Inter, sans-serif" font-size="12" opacity="0.7">CERMIN</text>
  </g>
  
  <!-- Bottom quote -->
  <text x="400" y="470" text-anchor="middle" fill="#666" font-family="Inter, sans-serif" font-size="11" font-style="italic">"Mesin bisa menjadi cermin yang sempurna, tetapi cermin tidak pernah bisa melihat dirinya sendiri."</text>
</svg>
```
<p style="font-size: 0.9em; color: #666; margin-top: 10px;">Diagram: Diri Manusia vs Diri Mesin sebagai Cermin</p>
