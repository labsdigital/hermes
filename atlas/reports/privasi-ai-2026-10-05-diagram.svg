<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Arsitektur Privasi Digital</title>
  <desc id="desc">Diagram menunjukkan tiga lapisan pengawasan digital: devices, cloud, dan AI algorithms, dengan data pribadi mengalir dari pengguna ke korporasi.</desc>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#0F172A"/>
  
  <!-- User -->
  <circle cx="100" cy="200" r="40" fill="#3B82F6" opacity="0.8"/>
  <text x="100" y="260" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Anda</text>
  <text x="100" y="195" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">👤</text>
  
  <!-- Devices Layer -->
  <rect x="180" y="120" width="120" height="160" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="240" y="145" font-family="Inter, sans-serif" font-size="12" fill="#F59E0B" text-anchor="middle">DEVICES</text>
  
  <!-- Device icons -->
  <rect x="195" y="160" width="30" height="50" rx="4" fill="#334155"/>
  <text x="210" y="190" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">📱</text>
  
  <rect x="240" y="160" width="30" height="50" rx="4" fill="#334155"/>
  <text x="255" y="190" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">💻</text>
  
  <rect x="285" y="160" width="30" height="50" rx="4" fill="#334155"/>
  <text x="300" y="190" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">⌚</text>
  
  <!-- Data points flowing -->
  <circle cx="210" cy="240" r="4" fill="#3B82F6"/>
  <circle cx="260" cy="250" r="4" fill="#3B82F6"/>
  <circle cx="295" cy="235" r="4" fill="#3B82F6"/>
  <circle cx="230" cy="260" r="3" fill="#3B82F6"/>
  <circle cx="275" cy="255" r="3" fill="#3B82F6"/>
  
  <!-- Cloud Layer -->
  <rect x="340" y="100" width="120" height="200" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="400" y="125" font-family="Inter, sans-serif" font-size="12" fill="#8B5CF6" text-anchor="middle">CLOUD</text>
  
  <!-- Cloud shape -->
  <ellipse cx="400" cy="170" rx="40" ry="25" fill="#334155"/>
  <ellipse cx="380" cy="165" rx="25" ry="20" fill="#334155"/>
  <ellipse cx="420" cy="165" rx="25" ry="20" fill="#334155"/>
  
  <!-- Data streams to cloud -->
  <line x1="300" y1="180" x2="340" y2="180" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="300" y1="220" x2="340" y2="220" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="300" y1="260" x2="340" y2="260" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Arrow heads -->
  <polygon points="340,175 350,180 340,185" fill="#3B82F6"/>
  <polygon points="340,215 350,220 340,225" fill="#3B82F6"/>
  <polygon points="340,255 350,260 340,265" fill="#3B82F6"/>
  
  <!-- AI Layer -->
  <rect x="480" y="80" width="100" height="240" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="530" y="105" font-family="Inter, sans-serif" font-size="12" fill="#10B981" text-anchor="middle">AI ALGOS</text>
  
  <!-- Neural network representation -->
  <circle cx="510" cy="140" r="6" fill="#10B981"/>
  <circle cx="550" cy="140" r="6" fill="#10B981"/>
  <circle cx="530" cy="170" r="6" fill="#10B981"/>
  <circle cx="510" cy="200" r="6" fill="#10B981"/>
  <circle cx="550" cy="200" r="6" fill="#10B981"/>
  <circle cx="530" cy="230" r="6" fill="#10B981"/>
  
  <line x1="510" y1="140" x2="530" y2="170" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <line x1="550" y1="140" x2="530" y2="170" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <line x1="530" y1="170" x2="510" y2="200" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <line x1="530" y1="170" x2="550" y2="200" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <line x1="510" y1="200" x2="530" y2="230" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <line x1="550" y1="200" x2="530" y2="230" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  
  <!-- Output arrows -->
  <text x="530" y="280" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Profil</text>
  <text x="530" y="295" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Prediksi</text>
  <text x="530" y="310" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Skor</text>
  
  <!-- Connection from cloud to AI -->
  <line x1="460" y1="200" x2="480" y2="200" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="480,195 490,200 480,205" fill="#8B5CF6"/>
  
  <!-- Warning label -->
  <rect x="200" y="340" width="200" height="40" rx="8" fill="#EF4444" opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="300" y="365" font-family="Inter, sans-serif" font-size="11" fill="#EF4444" text-anchor="middle">⚠️ Data tidak bisa dihapus</text>
</svg>
