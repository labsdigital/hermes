<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="22" font-weight="700" filter="url(#glow)">Mata Tanpa Kelopak</text>
  <text x="400" y="62" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="12">Privasi di Era Kecerdasan Buatan</text>
  
  <!-- Central Eye -->
  <ellipse cx="400" cy="220" rx="120" ry="70" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.6"/>
  <ellipse cx="400" cy="220" rx="60" ry="40" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
  <circle cx="400" cy="220" r="20" fill="#ff6b35" opacity="0.8"/>
  <circle cx="400" cy="220" r="8" fill="#0a0a0f"/>
  
  <!-- Surveillance beams -->
  <line x1="400" y1="220" x2="150" y2="100" stroke="#4a90d9" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="220" x2="650" y2="100" stroke="#4a90d9" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="220" x2="150" y2="340" stroke="#4a90d9" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="220" x2="650" y2="340" stroke="#4a90d9" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Data nodes -->
  <circle cx="150" cy="100" r="15" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="150" y="104" text-anchor="middle" fill="#4a90d9" font-family="Inter, sans-serif" font-size="10">📱</text>
  <text x="150" y="130" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9">Data Pribadi</text>
  
  <circle cx="650" cy="100" r="15" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="650" y="104" text-anchor="middle" fill="#4a90d9" font-family="Inter, sans-serif" font-size="10">🏢</text>
  <text x="650" y="130" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9">Korporasi</text>
  
  <circle cx="150" cy="340" r="15" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="150" y="344" text-anchor="middle" fill="#4a90d9" font-family="Inter, sans-serif" font-size="10">🏛️</text>
  <text x="150" y="370" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9">Pemerintah</text>
  
  <circle cx="650" cy="340" r="15" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="650" y="344" text-anchor="middle" fill="#4a90d9" font-family="Inter, sans-serif" font-size="10">🤖</text>
  <text x="650" y="370" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="9">AI Algorithm</text>
  
  <!-- Protection barrier (broken) -->
  <path d="M 250 220 L 280 220" stroke="#ff6b35" stroke-width="3" opacity="0.3" stroke-dasharray="8,4"/>
  <path d="M 520 220 L 550 220" stroke="#ff6b35" stroke-width="3" opacity="0.3" stroke-dasharray="8,4"/>
  
  <!-- Key concepts -->
  <rect x="50" y="420" width="140" height="30" rx="5" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1"/>
  <text x="120" y="440" text-anchor="middle" fill="#e6eefc" font-family="Inter, sans-serif" font-size="10">Otonomi</text>
  
  <rect x="210" y="420" width="140" height="30" rx="5" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1"/>
  <text x="280" y="440" text-anchor="middle" fill="#e6eefc" font-family="Inter, sans-serif" font-size="10">Demokrasi</text>
  
  <rect x="370" y="420" width="140" height="30" rx="5" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1"/>
  <text x="440" y="440" text-anchor="middle" fill="#e6eefc" font-family="Inter, sans-serif" font-size="10">Kebebasan</text>
  
  <rect x="530" y="420" width="140" height="30" rx="5" fill="#1e2a4a" stroke="#4a90d9" stroke-width="1"/>
  <text x="600" y="440" text-anchor="middle" fill="#e6eefc" font-family="Inter, sans-serif" font-size="10">Identitas</text>
  
  <!-- Bottom quote -->
  <text x="400" y="485" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="10" font-style="italic">"Privasi bukan tentang menyembunyikan kejahatan — ia tentang mempertahankan otonomi"</text>
</svg>
