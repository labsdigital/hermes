<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Ketika Mesin Menghafal Nama Orang Mati</text>
  <text x="400" y="75" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="14">Kematian di Era Digital</text>
  
  <!-- Central circle - Human Memory -->
  <circle cx="400" cy="300" r="100" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <text x="400" y="295" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="18" font-weight="bold">Memori</text>
  <text x="400" y="315" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="14">Manusia</text>
  
  <!-- AI Machine surrounding -->
  <g transform="translate(400, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">AI Model</text>
    <text x="0" y="10" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Pelatihan</text>
    <text x="0" y="25" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Data Jenazah</text>
    <line x1="0" y1="40" x2="0" y2="100" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <g transform="translate(200, 300)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Jejak Digital</text>
    <text x="0" y="10" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Foto</text>
    <text x="0" y="25" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Pesan</text>
    <line x1="60" y1="0" x2="100" y2="0" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <g transform="translate(600, 300)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Eternity</text>
    <text x="0" y="10" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Layanan</text>
    <text x="0" y="25" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Digital Afterlife</text>
    <line x1="-60" y1="0" x2="-100" y2="0" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <g transform="translate(400, 450)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Keluarga</text>
    <text x="0" y="10" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Berdialog</text>
    <text x="0" y="25" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Dengan AI</text>
    <line x1="0" y1="-40" x2="0" y2="-100" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Ethical question -->
  <g transform="translate(150, 500)">
    <circle cx="0" cy="0" r="30" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Etika?</text>
  </g>
  
  <g transform="translate(650, 500)">
    <circle cx="0" cy="0" r="30" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Identitas?</text>
  </g>
  
  <line x1="180" y1="480" x2="320" y2="400" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="480" x2="480" y2="400" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3"/>
</svg>