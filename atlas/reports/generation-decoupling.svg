<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Generation Decoupling: Pemutusan Rantai Cipta</title>
  <desc id="svg-desc">Diagram yang menunjukkan tiga dimensi generation decoupling: decoupling from intention, experience, dan lineage.</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#334155" font-weight="bold">GENERATION DECOUPLING</text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">Tiga Dimensi Pemutusan Rantai Cipta</text>
  
  <!-- DECENTER NODE: AI -->
  <g transform="translate(350, 180)">
    <rect x="-50" y="-40" width="100" height="80" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#92400e" font-weight="bold">AI</text>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#92400e">Generative</text>
  </g>
  
  <!-- OUTPUT NODE -->
  <g transform="translate(650, 180)">
    <rect x="-50" y="-40" width="100" height="80" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af" font-weight="bold">OUTPUT</text>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1e40af">Karya/Ciptaan</text>
  </g>
  
  <!-- Arrow AI to Output -->
  <line x1="300" y1="180" x2="590" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="590,175 600,180 590,185" fill="#94a3b8"/>
  
  <!-- DIMENSION 1: Intention -->
  <g transform="translate(150, 80)">
    <rect x="-70" y="-35" width="140" height="70" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#9d174d" font-weight="bold">INTENTION</text>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#9d174d">Niat & Keinginan</text>
    <!-- Broken chain symbol -->
    <path d="M-50 25 Q-25 35 0 25 Q25 15 50 25" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,2"/>
  </g>
  <line x1="150" y1="115" x2="310" y2="155" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- DIMENSION 2: Experience -->
  <g transform="translate(150, 280)">
    <rect x="-70" y="-35" width="140" height="70" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#065f46" font-weight="bold">EXPERIENCE</text>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#065f46">Pengalaman Tubuh</text>
    <!-- Broken chain symbol -->
    <path d="M-50 -25 Q-25 -35 0 -25 Q25 -15 50 -25" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  </g>
  <line x1="150" y1="245" x2="310" y2="205" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- DIMENSION 3: Lineage -->
  <g transform="translate(650, 80)">
    <rect x="-70" y="-35" width="140" height="70" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#4c1d95" font-weight="bold">LINEAGE</text>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4c1d95">Garis Keturunan</text>
    <!-- Broken chain symbol -->
    <path d="M-50 25 Q-25 35 0 25 Q25 15 50 25" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,2"/>
  </g>
  <line x1="590" y1="155" x2="650" y2="115" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Connecting lines to center -->
  <line x1="220" y1="80" x2="300" y2="160" stroke="#f9a8d4" stroke-width="1"/>
  <line x1="220" y1="280" x2="300" y2="200" stroke="#6ee7b7" stroke-width="1"/>
  
  <!-- Legend -->
  <g transform="translate(400, 370)">
    <text x="0" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">Solid line = koneksi langsung | Dashed line = koneksi terputus</text>
  </g>
</svg>
