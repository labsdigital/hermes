<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Kematian Digital: Manusia vs Mesin</title>
  <desc id="svg-desc">Perbandingan cara manusia dan mesin memahami kematian—dari penguburan fisik hingga warisan digital.</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- LEFT SIDE: Manusia -->
  <g transform="translate(0, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    
    <!-- Title -->
    <text x="205" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#7c2d12" font-weight="bold">MANUSIA</text>
    
    <!-- Death cycle illustration -->
    <circle cx="205" cy="160" r="50" fill="#fed7aa" opacity="0.5"/>
    <path d="M185,150 Q205,130 225,150 Q235,170 225,190 Q205,210 185,190 Q175,170 185,150" fill="#f97316" opacity="0.7"/>
    
    <!-- Timeline -->
    <line x1="60" y1="260" x2="350" y2="260" stroke="#f97316" stroke-width="2"/>
    <circle cx="80" cy="260" r="6" fill="#f97316"/>
    <text x="80" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7c2d12">Lahir</text>
    
    <circle cx="205" cy="260" r="6" fill="#f97316"/>
    <text x="205" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7c2d12" font-weight="bold">Mati</text>
    
    <circle cx="330" cy="260" r="6" fill="#f97316" opacity="0.4"/>
    <text x="330" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7c2d12">Lupa</text>
    
    <!-- Legacy methods -->
    <rect x="60" y="310" width="130" height="50" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="125" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#92400e">Tulisan</text>
    <text x="125" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#92400e">Batu Nisan</text>
    
    <rect x="210" y="310" width="130" height="50" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="275" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#92400e">Kenangan</text>
    <text x="275" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#92400e">Oral Tradition</text>
  </g>
  
  <!-- RIGHT SIDE: Mesin -->
  <g transform="translate(410, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    
    <!-- Title -->
    <text x="205" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#1e3a8a" font-weight="bold">MESIN</text>
    
    <!-- Data flow illustration -->
    <rect x="140" y="120" width="130" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="205" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">Data Pribadi</text>
    <text x="205" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e40af">Pesan + Suara</text>
    <text x="205" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e40af">+ Video</text>
    
    <!-- Arrow -->
    <path d="M205,200 L205,230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Training icon -->
    <rect x="155" y="240" width="100" height="50" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
    <text x="205" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e40af">Pelatihan</text>
    <text x="205" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e40af">Model AI</text>
    
    <!-- Arrow -->
    <path d="M260,265 L300,265" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Output -->
    <rect x="310" y="240" width="80" height="50" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <text x="350" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1e3a8a">Avatar</text>
    <text x="350" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1e3a8a">Digital</text>
    
    <!-- Infinity symbol -->
    <path d="M140,340 Q160,320 180,340 Q200,360 220,340 Q240,320 260,340 Q280,360 300,340" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <text x="205" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e40af">Warisan Tak Terhingga</text>
  </g>
  
  <!-- Center divider -->
  <line x1="395" y1="20" x2="395" y2="380" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
