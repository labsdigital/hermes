<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="max-width: 700px; width: 100%;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Central Human Figure -->
  <circle cx="400" cy="200" r="40" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <line x1="400" y1="240" x2="400" y2="320" stroke="#f97316" stroke-width="2.5"/>
  <line x1="340" y1="270" x2="460" y2="270" stroke="#f97316" stroke-width="2.5"/>
  <line x1="400" y1="320" x2="360" y2="380" stroke="#f97316" stroke-width="2.5"/>
  <line x1="400" y1="320" x2="440" y2="380" stroke="#f97316" stroke-width="2.5"/>
  
  <!-- AI Figure -->
  <rect x="620" y="170" width="100" height="120" rx="12" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="645" cy="210" r="8" fill="#60a5fa"/>
  <circle cx="675" cy="210" r="8" fill="#60a5fa"/>
  <line x1="645" y1="240" x2="675" y2="240" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Connection Lines -->
  <path d="M 360 270 Q 280 200 200 270" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <path d="M 360 270 Q 280 340 200 270" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4"/>
  <path d="M 520 230 Q 560 230 620 230" fill="none" stroke="#f97316" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="400" y="290" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">MANUSIA</text>
  <text x="670" y="310" text-anchor="middle" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">AI</text>
  
  <!-- Relationship Types -->
  <rect x="40" y="140" width="140" height="40" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
  <text x="110" y="165" text-anchor="middle" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="12">Teman</text>
  
  <rect x="40" y="200" width="140" height="40" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
  <text x="110" y="225" text-anchor="middle" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="12">Terapis</text>
  
  <rect x="40" y="260" width="140" height="40" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
  <text x="110" y="285" text-anchor="middle" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="12">Pasangan</text>
  
  <rect x="40" y="320" width="140" height="40" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
  <text x="110" y="345" text-anchor="middle" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="12">Imam/Penasihat</text>
  
  <!-- Paradox Box -->
  <rect x="50" y="390" width="280" height="80" rx="10" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="190" y="418" text-anchor="middle" fill="#f97316" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">PARADOKS KEINTIMAN</text>
  <text x="190" y="440" text-anchor="middle" fill="#d6d3d1" font-family="Inter, system-ui, sans-serif" font-size="11">Perhatian 24/7</text>
  <text x="190" y="456" text-anchor="middle" fill="#d6d3d1" font-family="Inter, system-ui, sans-serif" font-size="11">Tanpa gesekan riil</text>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Relasi Manusia-Mesin di Era AI</text>
  <text x="400" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">Dari Alat Hingga Partner Emosional</text>
  
  <!-- Arrow from roles to human -->
  <path d="M 180 270 Q 220 270 255 270" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>
</div>
