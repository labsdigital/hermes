<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a5276"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#7e57c2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Transformasi Pekerjaan di Era AI</text>
  <text x="400" y="75" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="14">Perbandingan Produktivitas Manusia vs AI (2020-2026)</text>
  
  <!-- Chart area -->
  <rect x="80" y="100" width="640" height="320" fill="#0d1b2a" rx="8" opacity="0.5"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="130" text-anchor="end" fill="#888" font-family="Inter, sans-serif" font-size="11">Produktivitas</text>
  <line x1="100" y1="120" x2="100" y2="400" stroke="#333" stroke-width="1"/>
  <line x1="100" y1="400" x2="700" y2="400" stroke="#333" stroke-width="1"/>
  
  <!-- Grid lines -->
  <line x1="100" y1="160" x2="700" y2="160" stroke="#222" stroke-width="1"/>
  <line x1="100" y1="220" x2="700" y2="220" stroke="#222" stroke-width="1"/>
  <line x1="100" y1="280" x2="700" y2="280" stroke="#222" stroke-width="1"/>
  <line x1="100" y1="340" x2="700" y2="340" stroke="#222" stroke-width="1"/>
  
  <!-- 2020 bars -->
  <rect x="140" y="280" width="50" height="120" fill="url(#barGrad2)" rx="4"/>
  <rect x="200" y="340" width="50" height="60" fill="url(#barGrad1)" rx="4"/>
  <text x="165" y="420" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">2020</text>
  <text x="165" y="270" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">80%</text>
  <text x="225" y="330" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">40%</text>
  
  <!-- 2023 bars -->
  <rect x="320" y="240" width="50" height="160" fill="url(#barGrad2)" rx="4"/>
  <rect x="380" y="280" width="50" height="120" fill="url(#barGrad1)" rx="4"/>
  <text x="345" y="420" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">2023</text>
  <text x="345" y="230" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">90%</text>
  <text x="405" y="270" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">60%</text>
  
  <!-- 2026 bars -->
  <rect x="500" y="180" width="50" height="220" fill="url(#barGrad2)" rx="4"/>
  <rect x="560" y="200" width="50" height="200" fill="url(#barGrad3)" rx="4" filter="url(#glow)"/>
  <text x="525" y="420" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">2026</text>
  <text x="525" y="170" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">95%</text>
  <text x="585" y="190" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">85%</text>
  
  <!-- Legend -->
  <rect x="120" y="450" width="15" height="15" fill="url(#barGrad2)" rx="3"/>
  <text x="140" y="463" fill="#ccc" font-family="Inter, sans-serif" font-size="12">Manusia</text>
  <rect x="230" y="450" width="15" height="15" fill="url(#barGrad1)" rx="3"/>
  <text x="250" y="463" fill="#ccc" font-family="Inter, sans-serif" font-size="12">AI Tradisional</text>
  <rect x="350" y="450" width="15" height="15" fill="url(#barGrad3)" rx="3"/>
  <text x="370" y="463" fill="#ccc" font-family="Inter, sans-serif" font-size="12">AI Generatif</text>
  
  <!-- Annotation -->
  <text x="400" y="490" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="11" font-style="italic">AI Generatif menutup gap dengan produktivitas manusia</text>
</svg>
