<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="math" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="520" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Peta Kontroversi: Klaim ML vs Skeptisisme Matematikawan</text>
  
  <!-- Left side: ML Position -->
  <rect x="40" y="70" width="320" height="200" rx="12" fill="#111" stroke="url(#ml)" stroke-width="2" filter="url(#glow)"/>
  <text x="200" y="100" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="600">KLAIM ML / KOMPUTASI</text>
  
  <text x="60" y="135" fill="#fff" font-size="11" font-weight="500">Pendapat pendukung:</text>
  <text x="60" y="155" fill="#ccc" font-size="10">• PINNs dapat mengaproksimasi solusi</text>
  <text x="60" y="175" fill="#ccc" font-size="10">• Akurasi numerik sangat tinggi</text>
  <text x="60" y="195" fill="#ccc" font-size="10">• Efisien untuk kasus praktis</text>
  <text x="60" y="215" fill="#ccc" font-size="10">• Membuka jalan simulasi baru</text>
  
  <text x="200" y="255" text-anchor="middle" fill="#888" font-size="9">Makna "solve": aproksimasi numerik</text>
  
  <!-- Right side: Math Position -->
  <rect x="440" y="70" width="320" height="200" rx="12" fill="#111" stroke="url(#math)" stroke-width="2"/>
  <text x="600" y="100" text-anchor="middle" fill="#7c3aed" font-size="14" font-weight="600">SKEPTISME MATEMATIKAWAN</text>
  
  <text x="460" y="135" fill="#fff" font-size="11" font-weight="500">Raguan utama:</text>
  <text x="460" y="155" fill="#ccc" font-size="10">• Aproksimasi ≠ bukti eksistensial</text>
  <text x="460" y="175" fill="#ccc" font-size="10">• Overfitting risiko tinggi</text>
  <text x="460" y="195" fill="#ccc" font-size="10">• Tidak ada rigor formal</text>
  <text x="460" y="215" fill="#ccc" font-size="10">• Singularitas mungkin terlewat</text>
  
  <text x="600" y="255" text-anchor="middle" fill="#888" font-size="9">Makna "solve": bukti rigor</text>
  
  <!-- Center: Tension -->
  <rect x="350" y="140" width="100" height="60" rx="8" fill="#1a1a2e" stroke="#fff" stroke-width="1"/>
  <text x="400" y="165" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">KETEGANGAN</text>
  <text x="400" y="185" text-anchor="middle" fill="#888" font-size="9">Dua makna</text>
  
  <!-- Bottom: Resolution -->
  <rect x="40" y="300" width="720" height="200" rx="12" fill="#111" stroke="url(#human)" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" fill="#10b981" font-size="14" font-weight="600">JALAN TENGahan: KOLABORASI MANUSIA-MESIN</text>
  
  <!-- Three pillars -->
  <rect x="80" y="360" width="180" height="120" rx="8" fill="#0a0a0f" stroke="#10b981" stroke-width="1"/>
  <text x="170" y="390" text-anchor="middle" fill="#10b981" font-size="11" font-weight="500">🤖 AI SEBAGAI ALAT</text>
  <text x="170" y="415" text-anchor="middle" fill="#ccc" font-size="9">• Generasi hipotesis</text>
  <text x="170" y="435" text-anchor="middle" fill="#ccc" font-size="9">• Eksplorasi pola</text>
  <text x="170" y="455" text-anchor="middle" fill="#ccc" font-size="9">• Simulasi cepat</text>
  
  <rect x="310" y="360" width="180" height="120" rx="8" fill="#0a0a0f" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="390" text-anchor="middle" fill="#10b981" font-size="11" font-weight="500">👤 MANUSIA SEBAGAI JURI</text>
  <text x="400" y="415" text-anchor="middle" fill="#ccc" font-size="9">• Verifikasi rigor</text>
  <text x="400" y="435" text-anchor="middle" fill="#ccc" font-size="9">• Pemahaman konseptual</text>
  <text x="400" y="455" text-anchor="middle" fill="#ccc" font-size="9">• Interpretasi makna</text>
  
  <rect x="540" y="360" width="180" height="120" rx="8" fill="#0a0a0f" stroke="#10b981" stroke-width="1"/>
  <text x="630" y="390" text-anchor="middle" fill="#10b981" font-size="11" font-weight="500">🔗 DIALOG KREATIF</text>
  <text x="630" y="415" text-anchor="middle" fill="#ccc" font-size="9">• Ramanujan modern</text>
  <text x="630" y="435" text-anchor="middle" fill="#ccc" font-size="9">• Penemuan bersama</text>
  <text x="630" y="455" text-anchor="middle" fill="#ccc" font-size="9">• Evolusi pemahaman</text>
  
  <!-- Footer -->
  <text x="400" y="495" text-anchor="middle" fill="#666" font-size="9">Kesimpulan: AI menghasilkan hipotesis, manusia memberikan legitimasi</text>
</svg>