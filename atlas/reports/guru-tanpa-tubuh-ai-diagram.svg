<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#ff6b35" font-size="28" font-weight="700" letter-spacing="2">GURU TANPA TUBUH</text>
  <text x="600" y="78" text-anchor="middle" fill="#888" font-size="14" letter-spacing="1">Ketika AI Mengambil Alih Ruang Kelas</text>
  
  <!-- Left side: Traditional Education -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="380" height="420" rx="16" fill="#151520" stroke="#333" stroke-width="1"/>
    <text x="190" y="40" text-anchor="middle" fill="#4facfe" font-size="18" font-weight="600">PENDIDIKAN TRADISIONAL</text>
    
    <!-- Human figures -->
    <circle cx="190" cy="120" r="35" fill="#4facfe" opacity="0.2" stroke="#4facfe" stroke-width="2"/>
    <text x="190" y="128" text-anchor="middle" fill="#4facfe" font-size="40">👤</text>
    
    <text x="190" y="180" text-anchor="middle" fill="#ccc" font-size="13">Guru sebagai mentor</text>
    <text x="190" y="200" text-anchor="middle" fill="#999" font-size="12">yang hadir secara fisik</text>
    
    <!-- Connection lines -->
    <line x1="80" y1="260" x2="300" y2="260" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="190" y1="220" x2="190" y2="300" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    
    <text x="190" y="290" text-anchor="middle" fill="#ccc" font-size="13">Interaksi tatap muka</text>
    <text x="190" y="310" text-anchor="middle" fill="#999" font-size="12">membangun kepercayaan</text>
    
    <rect x="60" y="340" width="260" height="60" rx="8" fill="#1a2a3a" stroke="#4facfe" stroke-width="1" opacity="0.5"/>
    <text x="190" y="365" text-anchor="middle" fill="#4facfe" font-size="12">Zone of Proximal</text>
    <text x="190" y="385" text-anchor="middle" fill="#4facfe" font-size="12">Development (Vygotsky)</text>
  </g>
  
  <!-- Center: AI Transformation -->
  <g transform="translate(500, 120)">
    <rect x="0" y="0" width="200" height="420" rx="16" fill="#151520" stroke="#ff6b35" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="40" text-anchor="middle" fill="#ff6b35" font-size="16" font-weight="600">AI</text>
    
    <!-- Robot icon -->
    <rect x="60" y="80" width="80" height="80" rx="12" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="2"/>
    <text x="100" y="130" text-anchor="middle" fill="#ff6b35" font-size="50">🤖</text>
    
    <text x="100" y="200" text-anchor="middle" fill="#ccc" font-size="12">Tanpa tubuh</text>
    <text x="100" y="220" text-anchor="middle" fill="#ccc" font-size="12">Tanpa emosi</text>
    <text x="100" y="240" text-anchor="middle" fill="#ccc" font-size="12">Tanpa kehadiran</text>
    
    <rect x="30" y="280" width="140" height="50" rx="8" fill="#2a1510" stroke="#ff6b35" stroke-width="1" opacity="0.6"/>
    <text x="100" y="300" text-anchor="middle" fill="#ff6b35" font-size="11">I-Touch Relationship</text>
    <text x="100" y="318" text-anchor="middle" fill="#ff6b35" font-size="11">(Buber)</text>
    
    <rect x="30" y="350" width="140" height="50" rx="8" fill="#2a1510" stroke="#ff6b35" stroke-width="1" opacity="0.6"/>
    <text x="100" y="370" text-anchor="middle" fill="#ff6b35" font-size="11">Personalisasi</text>
    <text x="100" y="388" text-anchor="middle" fill="#ff6b35" font-size="11">Massal</text>
  </g>
  
  <!-- Right side: Hybrid Future -->
  <g transform="translate(720, 120)">
    <rect x="0" y="0" width="380" height="420" rx="16" fill="#151520" stroke="#2d5a27" stroke-width="1"/>
    <text x="190" y="40" text-anchor="middle" fill="#4ade80" font-size="18" font-weight="600">MASA DEPAN HYBRID</text>
    
    <!-- Connected figures -->
    <circle cx="120" cy="120" r="30" fill="#4facfe" opacity="0.2" stroke="#4facfe" stroke-width="1.5"/>
    <text x="120" y="128" text-anchor="middle" fill="#4facfe" font-size="32">👤</text>
    
    <circle cx="260" cy="120" r="30" fill="#ff6b35" opacity="0.2" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="260" y="128" text-anchor="middle" fill="#ff6b35" font-size="32">🤖</text>
    
    <!-- Connection -->
    <line x1="150" y1="120" x2="230" y2="120" stroke="#4ade80" stroke-width="2"/>
    <polygon points="230,115 240,120 230,125" fill="#4ade80"/>
    
    <text x="190" y="180" text-anchor="middle" fill="#ccc" font-size="13">Kolaborasi Manusia-AI</text>
    <text x="190" y="200" text-anchor="middle" fill="#999" font-size="12">AI menangani fakta, guru</text>
    <text x="190" y="220" text-anchor="middle" fill="#999" font-size="12">menangani makna</text>
    
    <rect x="50" y="260" width="280" height="50" rx="8" fill="#1a2a1a" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
    <text x="190" y="280" text-anchor="middle" fill="#4ade80" font-size="11">I-Thou Relationship (Buber)</text>
    <text x="190" y="298" text-anchor="middle" fill="#4ade80" font-size="11">Pertemuan antarmanusia</text>
    
    <rect x="50" y="330" width="280" height="70" rx="8" fill="#1a2a1a" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
    <text x="190" y="355" text-anchor="middle" fill="#4ade80" font-size="11">Keberadaan Fisik = Keberanian</text>
    <text x="190" y="375" text-anchor="middle" fill="#4ade80" font-size="11">untuk memahami</text>
  </g>
  
  <!-- Bottom quote -->
  <rect x="100" y="560" width="1000" height="0" fill="none"/>
  <text x="600" y="590" text-anchor="middle" fill="#666" font-size="11" font-style="italic">"Pendidikan bukan tentang mentransfer informasi — pendidikan adalah tentang pertemuan"</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#ff6b35" opacity="0.3"/>
  <circle cx="1150" cy="50" r="3" fill="#4facfe" opacity="0.3"/>
  <circle cx="50" cy="550" r="3" fill="#4facfe" opacity="0.3"/>
  <circle cx="1150" cy="550" r="3" fill="#ff6b35" opacity="0.3"/>
</svg>
