<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a5276"/>
    </linearGradient>
    <linearGradient id="gapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#7e57c2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Paradoks Etika AI</text>
  <text x="400" y="75" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="14">Ketika Moralitas Menjadi Kode</text>
  
  <!-- Central diagram: Human vs AI responsibility gap -->
  <rect x="100" y="120" width="600" height="280" fill="#0d1b2a" rx="8" opacity="0.5"/>
  
  <!-- Human side -->
  <circle cx="200" cy="260" r="60" fill="url(#humanGrad)" opacity="0.8"/>
  <text x="200" y="255" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Manusia</text>
  <text x="200" y="275" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">Moralitas Intuitif</text>
  
  <!-- AI side -->
  <circle cx="600" cy="260" r="60" fill="url(#aiGrad)" opacity="0.8"/>
  <text x="600" y="255" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Mesin</text>
  <text x="600" y="275" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">Optimasi Kode</text>
  
  <!-- Responsibility Gap -->
  <line x1="260" y1="260" x2="540" y2="260" stroke="#7e57c2" stroke-width="3" stroke-dasharray="10,5"/>
  <rect x="350" y="240" width="100" height="40" rx="4" fill="url(#gapGrad)" filter="url(#glow)"/>
  <text x="400" y="258" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Tanggung Jawab</text>
  <text x="400" y="273" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">Kabur</text>
  
  <!-- Arrow labels -->
  <text x="300" y="230" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="11">Bias &amp; Prejudice</text>
  <text x="500" y="230" text-anchor="middle" fill="#1a5276" font-family="Inter, sans-serif" font-size="11">Data Training</text>
  
  <!-- Bottom: Key questions -->
  <text x="400" y="350" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="13">Pertanyaan Etis Utama:</text>
  
  <!-- Three key questions -->
  <rect x="120" y="370" width="180" height="60" rx="6" fill="#0d1b2a" stroke="#e94560" stroke-width="1"/>
  <text x="210" y="395" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Siapa yang bertanggung jawab?</text>
  <text x="210" y="415" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="10">Ketika mesin membuat keputusan</text>
  
  <rect x="310" y="370" width="180" height="60" rx="6" fill="#0d1b2a" stroke="#7e57c2" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Etika siapa yang diprogram?</text>
  <text x="400" y="415" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="10">Nilai siapa yang kita tanamkan?</text>
  
  <rect x="500" y="370" width="180" height="60" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="590" y="395" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Apakah simulasi cukup?</text>
  <text x="590" y="415" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="10">Tanpa empati, bisakah moral bermakna?</text>
  
  <!-- Annotation -->
  <text x="400" y="460" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="11" font-style="italic">Etika AI bukan tentang membuat mesin「baik」— tapi tentang memastikan manusia tetap「bertanggung jawab」</text>
</svg>