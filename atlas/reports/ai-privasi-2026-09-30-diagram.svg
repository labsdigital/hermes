<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="28" font-weight="bold">Privasi di Era Mesin yang Tahu</text>
  
  <!-- Central Eye Icon -->
  <g transform="translate(400, 200)">
    <ellipse cx="0" cy="0" rx="120" ry="70" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <circle cx="0" cy="0" r="35" fill="#ff6b35" opacity="0.3"/>
    <circle cx="0" cy="0" r="15" fill="#ff6b35"/>
    <!-- Data streams -->
    <line x1="-120" y1="0" x2="-200" y2="0" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="120" y1="0" x2="200" y2="0" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="0" y1="-70" x2="0" y2="-150" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="0" y1="70" x2="0" y2="150" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Data Points -->
  <g transform="translate(150, 120)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="#2d3a4a" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12">Lokasi</text>
  </g>
  
  <g transform="translate(550, 120)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="#2d3a4a" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12">Pembelian</text>
  </g>
  
  <g transform="translate(150, 320)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="#2d3a4a" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12">Suara</text>
  </g>
  
  <g transform="translate(550, 320)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="#2d3a4a" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12">Pikiran</text>
  </g>
  
  <!-- Connection lines to center -->
  <line x1="250" y1="140" x2="320" y2="180" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <line x1="550" y1="140" x2="480" y2="180" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="300" x2="320" y2="260" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <line x1="550" y1="300" x2="480" y2="260" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Bottom text -->
  <text x="400" y="440" text-anchor="middle" fill="#8899aa" font-family="Inter, sans-serif" font-size="14">Kita menukar privasi dengan kenyamanan</text>
  <text x="400" y="465" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="12">Survei: 84% rela korbankan privasi demi kemudahan</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="3" fill="#ff6b35" opacity="0.5"/>
  <circle cx="720" cy="80" r="3" fill="#ff6b35" opacity="0.5"/>
  <circle cx="80" cy="420" r="3" fill="#ff6b35" opacity="0.5"/>
  <circle cx="720" cy="420" r="3" fill="#ff6b35" opacity="0.5"/>
</svg>