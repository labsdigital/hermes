<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title">
  <title id="title">Privasi di Era AI - Ilustrasi Konseptual</title>
  
  <defs>
    <!-- Gradient for glass effect -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Gradient for data streams -->
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Data flow lines (background) -->
  <g opacity="0.3">
    <line x1="50" y1="100" x2="750" y2="100" stroke="#667eea" stroke-width="1" stroke-dasharray="5,10"/>
    <line x1="50" y1="150" x2="750" y2="150" stroke="#667eea" stroke-width="1" stroke-dasharray="3,15"/>
    <line x1="50" y1="200" x2="750" y2="200" stroke="#667eea" stroke-width="1" stroke-dasharray="8,12"/>
    <line x1="50" y1="250" x2="750" y2="250" stroke="#667eea" stroke-width="1" stroke-dasharray="5,10"/>
    <line x1="50" y1="300" x2="750" y2="300" stroke="#667eea" stroke-width="1" stroke-dasharray="3,15"/>
    <line x1="50" y1="350" x2="750" y2="350" stroke="#667eea" stroke-width="1" stroke-dasharray="8,12"/>
    <line x1="50" y1="400" x2="750" y2="400" stroke="#667eea" stroke-width="1" stroke-dasharray="5,10"/>
    <line x1="50" y1="450" x2="750" y2="450" stroke="#667eea" stroke-width="1" stroke-dasharray="3,15"/>
  </g>
  
  <!-- Central figure (human silhouette) -->
  <g transform="translate(400, 250)">
    <!-- Glass/cage structure -->
    <rect x="-120" y="-140" width="240" height="280" rx="20" fill="url(#glassGrad)" stroke="#667eea" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Human silhouette -->
    <circle cx="0" cy="-60" r="45" fill="#e2e8f0"/>
    <path d="M -50 0 Q -60 80 -40 120 L 40 120 Q 60 80 50 0 Z" fill="#e2e8f0"/>
    
    <!-- Eye symbol (surveillance) -->
    <ellipse cx="0" cy="-60" rx="30" ry="15" fill="none" stroke="#f97316" stroke-width="2"/>
    <circle cx="0" cy="-60" r="6" fill="#f97316"/>
    
    <!-- Data nodes on cage -->
    <circle cx="-120" cy="-100" r="4" fill="#ec4899"/>
    <circle cx="120" cy="-100" r="4" fill="#ec4899"/>
    <circle cx="-120" cy="0" r="4" fill="#ec4899"/>
    <circle cx="120" cy="0" r="4" fill="#ec4899"/>
    <circle cx="-120" cy="100" r="4" fill="#ec4899"/>
    <circle cx="120" cy="100" r="4" fill="#ec4899"/>
    
    <!-- Streaming data points -->
    <g fill="#f97316" opacity="0.6">
      <circle cx="-80" cy="-120" r="3"/>
      <circle cx="-60" cy="-130" r="2"/>
      <circle cx="80" cy="-120" r="3"/>
      <circle cx="60" cy="-130" r="2"/>
      <circle cx="-100" cy="50" r="3"/>
      <circle cx="100" cy="50" r="3"/>
      <circle cx="-90" cy="120" r="2"/>
      <circle cx="90" cy="120" r="2"/>
    </g>
  </g>
  
  <!-- Floating data particles -->
  <g fill="#667eea" opacity="0.5">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="150" cy="120" r="2"/>
    <circle cx="700" cy="90" r="3"/>
    <circle cx="650" cy="130" r="2"/>
    <circle cx="120" cy="400" r="3"/>
    <circle cx="680" cy="380" r="2"/>
    <circle cx="80" cy="300" r="2"/>
    <circle cx="720" cy="310" r="3"/>
  </g>
  
  <!-- Connection lines from data to center -->
  <g stroke="#ec4899" stroke-width="1" opacity="0.3">
    <line x1="100" y1="80" x2="280" y2="200"/>
    <line x1="700" y1="90" x2="520" y2="200"/>
    <line x1="120" y1="400" x2="280" y2="300"/>
    <line x1="680" y1="380" x2="520" y2="300"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="480" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14" letter-spacing="2">PRIVASI DI ERA AI</text>
</svg>
