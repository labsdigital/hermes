<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Atrofi Kognitif: Dampak AI pada Otak Manusia</title>
  <desc id="svg-desc">Diagram yang menunjukkan penurunan kemampuan kognitif manusia akibat ketergantungan pada AI.</desc>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#1e293b" font-weight="bold">Atrofi Kognitif</text>
  <text x="400" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#64748b">Dampak Ketergantungan AI pada Kemampuan Berpikir</text>
  
  <!-- Left Side: Manusia Tanpa AI -->
  <g transform="translate(0, 0)">
    <rect x="30" y="90" width="340" height="480" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    
    <!-- Brain icon -->
    <circle cx="200" cy="160" r="50" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <path d="M175 140 Q200 120 225 140 Q240 160 225 180 Q200 200 175 180 Q160 160 175 140" fill="none" stroke="#16a34a" stroke-width="2"/>
    <path d="M185 150 Q200 140 215 150" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M180 165 Q200 155 220 165" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    
    <!-- Labels -->
    <text x="200" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#166534" font-weight="bold">Manusia Otonom</text>
    
    <!-- Capability bars -->
    <g transform="translate(60, 270)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="12" fill="#475569">Memori</text>
      <rect x="80" y="-10" width="200" height="16" fill="#bbf7d0" rx="3"/>
      <rect x="80" y="-10" width="180" height="16" fill="#22c55e" rx="3"/>
      
      <text x="0" y="30" font-family="Georgia, serif" font-size="12" fill="#475569">Berfikir Kritis</text>
      <rect x="80" y="20" width="200" height="16" fill="#bbf7d0" rx="3"/>
      <rect x="80" y="20" width="170" height="16" fill="#22c55e" rx="3"/>
      
      <text x="0" y="70" font-family="Georgia, serif" font-size="12" fill="#475569">Kreativitas</text>
      <rect x="80" y="60" width="200" height="16" fill="#bbf7d0" rx="3"/>
      <rect x="80" y="60" width="160" height="16" fill="#22c55e" rx="3"/>
      
      <text x="0" y="110" font-family="Georgia, serif" font-size="12" fill="#475569">Perhatian</text>
      <rect x="80" y="100" width="200" height="16" fill="#bbf7d0" rx="3"/>
      <rect x="80" y="100" width="150" height="16" fill="#22c55e" rx="3"/>
      
      <text x="0" y="150" font-family="Georgia, serif" font-size="12" fill="#475569">Empati</text>
      <rect x="80" y="140" width="200" height="16" fill="#bbf7d0" rx="3"/>
      <rect x="80" y="140" width="140" height="16" fill="#22c55e" rx="3"/>
      
      <text x="0" y="190" font-family="Georgia, serif" font-size="12" fill="#475569">Kemandirian</text>
      <rect x="80" y="180" width="200" height="16" fill="#bbf7d0" rx="3"/>
      <rect x="80" y="180" width="165" height="16" fill="#22c55e" rx="3"/>
    </g>
    
    <!-- Bottom quote -->
    <text x="200" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">"Berfikir adalah latihan, bukan kemudahan"</text>
  </g>
  
  <!-- Right Side: Manusia Dengan AI -->
  <g transform="translate(430, 0)">
    <rect x="30" y="90" width="340" height="480" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    
    <!-- Brain icon with crack -->
    <circle cx="200" cy="160" r="50" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <path d="M175 140 Q200 120 225 140 Q240 160 225 180 Q200 200 175 180 Q160 160 175 140" fill="none" stroke="#dc2626" stroke-width="2"/>
    <path d="M185 150 Q200 140 215 150" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <!-- Crack lines -->
    <line x1="195" y1="130" x2="205" y2="145" stroke="#991b1b" stroke-width="2"/>
    <line x1="205" y1="145" x2="195" y2="160" stroke="#991b1b" stroke-width="2"/>
    <line x1="195" y1="160" x2="205" y2="175" stroke="#991b1b" stroke-width="2"/>
    
    <!-- AI chip icon -->
    <rect x="180" y="220" width="40" height="40" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <line x1="170" y1="230" x2="180" y2="230" stroke="#ef4444" stroke-width="2"/>
    <line x1="170" y1="240" x2="180" y2="240" stroke="#ef4444" stroke-width="2"/>
    <line x1="170" y1="250" x2="180" y2="250" stroke="#ef4444" stroke-width="2"/>
    <line x1="220" y1="230" x2="230" y2="230" stroke="#ef4444" stroke-width="2"/>
    <line x1="220" y1="240" x2="230" y2="240" stroke="#ef4444" stroke-width="2"/>
    <line x1="220" y1="250" x2="230" y2="250" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Labels -->
    <text x="200" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#991b1b" font-weight="bold">Manusia Tergantung AI</text>
    
    <!-- Capability bars - reduced -->
    <g transform="translate(60, 320)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="12" fill="#475569">Memori</text>
      <rect x="80" y="-10" width="200" height="16" fill="#fecaca" rx="3"/>
      <rect x="80" y="-10" width="60" height="16" fill="#ef4444" rx="3"/>
      
      <text x="0" y="30" font-family="Georgia, serif" font-size="12" fill="#475569">Berfikir Kritis</text>
      <rect x="80" y="20" width="200" height="16" fill="#fecaca" rx="3"/>
      <rect x="80" y="20" width="50" height="16" fill="#ef4444" rx="3"/>
      
      <text x="0" y="70" font-family="Georgia, serif" font-size="12" fill="#475569">Kreativitas</text>
      <rect x="80" y="60" width="200" height="16" fill="#fecaca" rx="3"/>
      <rect x="80" y="60" width="45" height="16" fill="#ef4444" rx="3"/>
      
      <text x="0" y="110" font-family="Georgia, serif" font-size="12" fill="#475569">Perhatian</text>
      <rect x="80" y="100" width="200" height="16" fill="#fecaca" rx="3"/>
      <rect x="80" y="100" width="40" height="16" fill="#ef4444" rx="3"/>
      
      <text x="0" y="150" font-family="Georgia, serif" font-size="12" fill="#475569">Empati</text>
      <rect x="80" y="140" width="200" height="16" fill="#fecaca" rx="3"/>
      <rect x="80" y="140" width="35" height="16" fill="#ef4444" rx="3"/>
      
      <text x="0" y="190" font-family="Georgia, serif" font-size="12" fill="#475569">Kemandirian</text>
      <rect x="80" y="180" width="200" height="16" fill="#fecaca" rx="3"/>
      <rect x="80" y="180" width="55" height="16" fill="#ef4444" rx="3"/>
    </g>
    
    <!-- Bottom quote -->
    <text x="200" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">"Kenapa berpikir kalau mesin bisa?"</text>
  </g>
  
  <!-- Center arrow -->
  <g transform="translate(380, 300)">
    <path d="M0 0 L40 -15 L40 15 Z" fill="#f59e0b"/>
    <text x="50" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#92400e">Ketergantungan</text>
  </g>
  
  <!-- Bottom warning -->
  <rect x="100" y="545" width="600" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#92400e">⚠️ Atrofi terjadi secara bertahap—tidak terasa sampai terlalu terlambat</text>
</svg>
