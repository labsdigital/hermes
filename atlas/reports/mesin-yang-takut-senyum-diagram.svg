<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="machine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="20" font-weight="600">Empati: Manusia vs Mesin</text>
  
  <!-- Human side -->
  <g transform="translate(150, 250)">
    <!-- Human figure abstract -->
    <circle cx="0" cy="-60" r="45" fill="url(#human)" opacity="0.9"/>
    <path d="M-35,20 Q0,-20 35,20 L30,80 L-30,80 Z" fill="url(#human)" opacity="0.8"/>
    <!-- Heart -->
    <path d="M0,-10 C-15,-25 -25,-10 -15,5 L0,20 L15,5 C25,-10 15,-25 0,-10 Z" fill="#ff6b6b" filter="url(#glow)"/>
    <!-- Connection lines -->
    <line x1="-50" y1="0" x2="-120" y2="0" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
    <line x1="50" y1="0" x2="120" y2="0" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
    <!-- Emotions -->
    <text x="-140" y="-20" fill="#e94560" font-family="Inter, sans-serif" font-size="12">Sakit</text>
    <text x="-140" y="0" fill="#e94560" font-family="Inter, sans-serif" font-size="12">Senang</text>
    <text x="-140" y="20" fill="#e94560" font-family="Inter, sans-serif" font-size="12">Takut</text>
    <text x="120" y="-20" fill="#e94560" font-family="Inter, sans-serif" font-size="12">Harapan</text>
    <text x="120" y="0" fill="#e94560" font-family="Inter, sans-serif" font-size="12">Cinta</text>
    <text x="120" y="20" fill="#e94560" font-family="Inter, sans-serif" font-size="12">Marah</text>
  </g>
  
  <!-- Machine side -->
  <g transform="translate(650, 250)">
    <!-- Machine figure abstract -->
    <rect x="-45" y="-60" width="90" height="80" rx="10" fill="url(#machine)" stroke="#4a6fa5" stroke-width="2"/>
    <rect x="-25" y="-40" width="50" height="30" rx="5" fill="#0f3460" stroke="#4a6fa5" stroke-width="1"/>
    <!-- Screen face -->
    <text x="0" y="-20" text-anchor="middle" fill="#4a6fa5" font-family="monospace" font-size="14">:)</text>
    <!-- Circuit lines -->
    <line x1="-45" y1="10" x2="-80" y2="10" stroke="#4a6fa5" stroke-width="2"/>
    <line x1="45" y1="10" x2="80" y2="10" stroke="#4a6fa5" stroke-width="2"/>
    <line x1="-80" y1="10" x2="-80" y2="40" stroke="#4a6fa5" stroke-width="2"/>
    <line x1="80" y1="10" x2="80" y2="40" stroke="#4a6fa5" stroke-width="2"/>
    <!-- Data points -->
    <circle cx="-80" cy="50" r="5" fill="#4a6fa5"/>
    <circle cx="80" cy="50" r="5" fill="#4a6fa5"/>
    <!-- Labels -->
    <text x="-100" y="70" fill="#4a6fa5" font-family="Inter, sans-serif" font-size="11">01001</text>
    <text x="60" y="70" fill="#4a6fa5" font-family="Inter, sans-serif" font-size="11">10110</text>
  </g>
  
  <!-- Central divider -->
  <line x1="400" y1="80" x2="400" y2="420" stroke="#e94560" stroke-width="1" stroke-dasharray="10,10" opacity="0.4"/>
  
  <!-- Bridge concept -->
  <g transform="translate(400, 350)">
    <text x="0" y="0" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" opacity="0.8">Jembatan? atau Tembok?</text>
    <path d="M-100,20 Q0,40 100,20" stroke="#e94560" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Key insight -->
  <g transform="translate(400, 460)">
    <text x="0" y="0" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="12">Empati sejati membutuhkan kerentanan, bukan kalkulasi</text>
  </g>
</svg>
