<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4e4c1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7bb3f0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#f4e4c1">Tuhan dan Tensor</text>
  <text x="400" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#888899">Agama di Era Artificial Intelligence</text>
  
  <!-- Central Neural Network -->
  <circle cx="400" cy="250" r="60" fill="none" stroke="url(#blue)" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#7bb3f0">AI</text>
  <text x="400" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#666677">Tensor</text>
  
  <!-- Religious Symbols around center -->
  <!-- Cross -->
  <rect x="150" y="180" width="40" height="60" rx="3" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="165" y="195" width="10" height="30" fill="url(#gold)"/>
  <text x="170" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#d4a574">Kristen</text>
  
  <!-- Crescent Moon & Star (Islam) -->
  <circle cx="650" cy="190" r="25" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="658" cy="182" r="20" fill="#0a0a0f"/>
  <polygon points="670,170 673,178 681,178 675,183 677,191 670,186 663,191 665,183 659,178 667,178" fill="url(#gold)"/>
  <text x="670" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#d4a574">Islam</text>
  
  <!-- Om symbol (Hinduism) -->
  <text x="200" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" fill="url(#gold)">ॐ</text>
  <text x="200" y="375" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#d4a574">Hindu</text>
  
  <!-- Dharma Wheel (Buddhism) -->
  <circle cx="600" cy="340" r="30" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="600" cy="340" r="8" fill="url(#gold)"/>
  <line x1="600" y1="310" x2="600" y2="370" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="570" y1="340" x2="630" y2="340" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="579" y1="319" x2="621" y2="361" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="621" y1="319" x2="579" y2="361" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="600" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#d4a574">Buddha</text>
  
  <!-- Connection lines -->
  <line x1="190" y1="210" x2="345" y2="235" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  <line x1="610" y1="210" x2="455" y2="235" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  <line x1="215" y1="320" x2="350" y2="275" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  <line x1="580" y1="320" x2="450" y2="275" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  
  <!-- Bottom text -->
  <text x="400" y="450" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#888899">Mesin yang Memahami → Manusia yang Bertanya</text>
  <text x="400" y="475" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666677">Dalam pencarian makna yang tak pernah berakhir</text>
</svg>
</div>