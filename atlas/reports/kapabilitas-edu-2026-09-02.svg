<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#eee" font-family="Inter, sans-serif" font-size="20" font-weight="600">Kapabilitas Manusia vs Mesin dalam Pendidikan</text>
  
  <!-- Human Circle - Left -->
  <circle cx="250" cy="250" r="120" fill="none" stroke="url(#humanGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="100" fill="rgba(233,69,96,0.1)"/>
  
  <!-- Human Capabilities -->
  <text x="250" y="180" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="14" font-weight="600">MANUSIA</text>
  
  <g fill="#ffd700" font-family="Inter, sans-serif" font-size="12">
    <circle cx="250" cy="220" r="4"/>
    <text x="250" y="235" text-anchor="middle">Empati</text>
    
    <circle cx="200" cy="260" r="4"/>
    <text x="185" y="275" text-anchor="end">Meaning</text>
    
    <circle cx="300" cy="260" r="4"/>
    <text x="315" y="275" text-anchor="start">Wisdom</text>
    
    <circle cx="210" cy="300" r="4"/>
    <text x="190" y="315" text-anchor="end">Creativity</text>
    
    <circle cx="290" cy="300" r="4"/>
    <text x="310" y="315" text-anchor="start">Connection</text>
    
    <circle cx="250" cy="340" r="4"/>
    <text x="250" y="355" text-anchor="middle">Questioning</text>
  </g>
  
  <!-- AI Circle - Right -->
  <circle cx="550" cy="250" r="120" fill="none" stroke="#4a9eff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="550" cy="250" r="100" fill="rgba(74,158,255,0.1)"/>
  
  <!-- AI Capabilities -->
  <text x="550" y="180" text-anchor="middle" fill="#4a9eff" font-family="Inter, sans-serif" font-size="14" font-weight="600">MESIN (AI)</text>
  
  <g fill="#4a9eff" font-family="Inter, sans-serif" font-size="12">
    <circle cx="550" cy="220" r="4"/>
    <text x="550" y="235" text-anchor="middle">Computation</text>
    
    <circle cx="500" cy="260" r="4"/>
    <text x="485" y="275" text-anchor="end">Pattern</text>
    
    <circle cx="600" cy="260" r="4"/>
    <text x="615" y="275" text-anchor="start">Speed</text>
    
    <circle cx="510" cy="300" r="4"/>
    <text x="490" y="315" text-anchor="end">Scale</text>
    
    <circle cx="590" cy="300" r="4"/>
    <text x="610" y="315" text-anchor="start">Access</text>
    
    <circle cx="550" cy="340" r="4"/>
    <text x="550" y="355" text-anchor="middle">Automation</text>
  </g>
  
  <!-- Connection Arrows -->
  <path d="M 370 250 Q 400 230 430 250" fill="none" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 430 250 Q 400 270 370 250" fill="none" stroke="#ffd700" stroke-width="2"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700"/>
    </marker>
  </defs>
  
  <!-- Bottom Text -->
  <text x="400" y="430" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="13">Simbiosis: Manusia memberi makna, Mesin memberi skala</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="3" fill="#e94560" opacity="0.5"/>
  <circle cx="700" cy="120" r="3" fill="#4a9eff" opacity="0.5"/>
  <circle cx="150" cy="420" r="2" fill="#ffd700" opacity="0.4"/>
  <circle cx="650" cy="400" r="2" fill="#ffd700" opacity="0.4"/>
</svg>
