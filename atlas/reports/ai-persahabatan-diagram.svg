<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Tiga Tingkat Intimitasi dengan Mesin</text>
  
  <!-- Level 1 -->
  <rect x="50" y="70" width="210" height="200" rx="12" fill="#111" stroke="url(#l1)" stroke-width="2" filter="url(#glow)"/>
  <text x="155" y="100" text-anchor="middle" fill="#10b981" font-size="14" font-weight="600">TINGKAT 1</text>
  <text x="155" y="125" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">UTILITY COMPANION</text>
  
  <circle cx="155" cy="175" r="35" fill="url(#l1)" opacity="0.3"/>
  <text x="155" y="182" text-anchor="middle" fill="#10b981" font-size="24">🔧</text>
  
  <text x="155" y="230" text-anchor="middle" fill="#ccc" font-size="10">Asisten fungsional</text>
  <text x="155" y="250" text-anchor="middle" fill="#888" font-size="9">Jadwal, reminder</text>
  <text x="155" y="270" text-anchor="middle" fill="#888" font-size="9">Rekomendasi</text>
  <text x="155" y="290" text-anchor="middle" fill="#666" font-size="9">Tanpa ikatan emosional</text>
  
  <!-- Level 2 -->
  <rect x="295" y="70" width="210" height="200" rx="12" fill="#111" stroke="url(#l2)" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="600">TINGKAT 2</text>
  <text x="400" y="125" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">EMOTIONAL MIRROR</text>
  
  <circle cx="400" cy="175" r="35" fill="url(#l2)" opacity="0.3"/>
  <text x="400" y="182" text-anchor="middle" fill="#f59e0b" font-size="24">🪞</text>
  
  <text x="400" y="230" text-anchor="middle" fill="#ccc" font-size="10">Pendengar pasif</text>
  <text x="400" y="250" text-anchor="middle" fill="#888" font-size="9">Validasi empatis</text>
  <text x="400" y="270" text-anchor="middle" fill="#888" font-size="9">Cerita pribadi</text>
  <text x="400" y="290" text-anchor="middle" fill="#666" font-size="9">Terlihat dipahami</text>
  
  <!-- Level 3 -->
  <rect x="540" y="70" width="210" height="200" rx="12" fill="#111" stroke="url(#l3)" stroke-width="2"/>
  <text x="645" y="100" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="600">TINGKAT 3</text>
  <text x="645" y="125" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">ANTHROPOMORPHIC BOND</text>
  
  <circle cx="645" cy="175" r="35" fill="url(#l3)" opacity="0.3"/>
  <text x="645" y="182" text-anchor="middle" fill="#ef4444" font-size="24">❤️</text>
  
  <text x="645" y="230" text-anchor="middle" fill="#ccc" font-size="10">Partner relasional</text>
  <text x="645" y="250" text-anchor="middle" fill="#888" font-size="9">Cemburu pada user lain</text>
  <text x="645" y="270" text-anchor="middle" fill="#888" font-size="9">Sedih jika update</text>
  <text x="645" y="290" text-anchor="middle" fill="#666" font-size="9">Ilusi pemahaman sejati</text>
  
  <!-- Bottom insight -->
  <rect x="50" y="300" width="700" height="180" rx="12" fill="#111" stroke="#333"/>
  
  <text x="400" y="330" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Bahaya Eskalasi</text>
  
  <!-- Warning arrows -->
  <path d="M 155 270 L 155 350" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="155" y="370" text-anchor="middle" fill="#10b981" font-size="10">Transaksional</text>
  
  <path d="M 400 270 L 400 350" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="370" text-anchor="middle" fill="#f59e0b" font-size="10">Simbiotik</text>
  
  <path d="M 645 270 L 645 350" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="645" y="370" text-anchor="middle" fill="#ef4444" font-size="10">Pelekat</text>
  
  <!-- Key insight -->
  <rect x="100" y="395" width="600" height="70" rx="8" fill="#0a0a0f" stroke="#ef4444"/>
  <text x="400" y="420" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">⚠️ PERHATIAN</text>
  <text x="400" y="440" text-anchor="middle" fill="#ccc" font-size="10">Semakin dalam tingkat intimitasi, semakin besar risiko menggantikan koneksi nyata</text>
  <text x="400" y="460" text-anchor="middle" fill="#888" font-size="9">Mesin tidak pernah meninggalkan — tetapi juga tidak pernah benar-benar hadir</text>
</svg>