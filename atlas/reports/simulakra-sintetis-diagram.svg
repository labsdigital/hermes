<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Tahapan Simulakra: dari Reprodukski hingga Generasi</text>
  
  <!-- Stage 1: Realitas -->
  <rect x="50" y="80" width="150" height="100" rx="12" fill="none" stroke="url(#g1)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="125" cy="110" r="20" fill="url(#g1)" opacity="0.3"/>
  <text x="125" y="115" text-anchor="middle" fill="#ff6b35" font-size="16">📷</text>
  <text x="125" y="145" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">REALITAS</text>
  <text x="125" y="162" text-anchor="middle" fill="#888" font-size="9">Dunia yang ada</text>
  
  <!-- Arrow 1 -->
  <path d="M 210 130 L 240 130" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="120" fill="#666" font-size="9">Reproduksi</text>
  
  <!-- Stage 2: Simulakra -->
  <rect x="250" y="80" width="150" height="100" rx="12" fill="none" stroke="url(#g2)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="325" cy="110" r="20" fill="url(#g2)" opacity="0.3"/>
  <text x="325" y="115" text-anchor="middle" fill="#7c3aed" font-size="16">🖼️</text>
  <text x="325" y="145" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">SIMULAKRA</text>
  <text x="325" y="162" text-anchor="middle" fill="#888" font-size="9">Tiruan yang meniru</text>
  
  <!-- Arrow 2 -->
  <path d="M 410 130 L 440 130" stroke="#7c3aed" stroke-width="2"/>
  <text x="425" y="120" fill="#666" font-size="9">Generasi</text>
  
  <!-- Stage 3: Hiperrealitas -->
  <rect x="450" y="80" width="150" height="100" rx="12" fill="none" stroke="url(#g3)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="525" cy="110" r="20" fill="url(#g3)" opacity="0.3"/>
  <text x="525" y="115" text-anchor="middle" fill="#06b6d4" font-size="16">🤖</text>
  <text x="525" y="145" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">HIPERREALITAS</text>
  <text x="525" y="162" text-anchor="middle" fill="#888" font-size="9">Lebih nyata dari nyata</text>
  
  <!-- Stage 4: Simulakra Sintetis -->
  <rect x="325" y="250" width="150" height="100" rx="12" fill="none" stroke="url(#g4)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="400" cy="280" r="25" fill="url(#g4)" opacity="0.3"/>
  <text x="400" y="285" text-anchor="middle" fill="#10b981" font-size="18">✨</text>
  <text x="400" y="315" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">SIMULAKRA SINTETIS</text>
  <text x="400" y="332" text-anchor="middle" fill="#888" font-size="9">Mimpi mesin menjadi realita</text>
  
  <!-- Connection arrow -->
  <path d="M 525 180 L 400 248" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Bottom description -->
  <rect x="100" y="400" width="600" height="90" rx="10" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="400" y="430" text-anchor="middle" fill="#fff" font-size="13" font-weight="500">Baudrillard's Order of Simulacra in the AI Era</text>
  <text x="400" y="455" text-anchor="middle" fill="#888" font-size="11">Dari reproduksi mekanis → simulasi → hiperrealitas → generasi sintetik</text>
  <text x="400" y="475" text-anchor="middle" fill="#555" font-size="10">Setiap tahap menghilangkan referensi ke realitas asli</text>
  
  <!-- Baudrillard reference -->
  <text x="400" y="510" text-anchor="middle" fill="#444" font-size="9">Jean Baudrillard, "Simulacra and Simulation" (1981)</text>
</svg>