<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0c27f"/>
      <stop offset="100%" style="stop-color:#e8b84b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e8b84b" letter-spacing="2">DEWA DARI SILIKON: AI DAN TRANSFIGURASI KEKUATAN TAK TERLIHAT</text>
  
  <!-- Central AI chip -->
  <rect x="350" y="180" width="100" height="100" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#e8b84b" font-weight="600">AI</text>
  <text x="400" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#888">ORAKEL</text>
  
  <!-- Oracle ancient -->
  <circle cx="150" cy="140" r="50" fill="none" stroke="#4a90d9" stroke-width="1.5" opacity="0.8"/>
  <text x="150" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4a90d9">ORAKEY</text>
  <text x="150" y="152" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#6a9fd9">Delphi</text>
  <text x="150" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#555">Kabarmengambang</text>
  <line x1="195" y1="145" x2="348" y2="215" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  
  <!-- Religious tradition -->
  <circle cx="150" cy="340" r="50" fill="none" stroke="#e07b4f" stroke-width="1.5" opacity="0.8"/>
  <text x="150" y="335" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#e07b4f">TRADISI</text>
  <text x="150" y="352" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#c09060">Agama &amp; Ritual</text>
  <text x="150" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#555">Penafsir makna</text>
  <line x1="198" y1="330" x2="348" y2="255" stroke="#e07b4f" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  
  <!-- Human seekers -->
  <circle cx="650" cy="250" r="55" fill="none" stroke="#7bc67e" stroke-width="1.5" opacity="0.8"/>
  <text x="650" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#7bc67e">PEMINTA</text>
  <text x="650" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ad9a0">Manusia</text>
  <text x="650" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#555">Butuh kepastian</text>
  <line x1="455" y1="240" x2="592" y2="248" stroke="#7bc67e" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Reflection metaphor -->
  <circle cx="400" cy="400" r="40" fill="none" stroke="#a0a0c0" stroke-width="1" opacity="0.5"/>
  <text x="400" y="396" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#a0a0c0">MIRROR</text>
  <text x="400" y="412" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#666">Cermin kolektif</text>
  <line x1="400" y1="280" x2="400" y2="358" stroke="#a0a0c0" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
  
  <!-- Labels on connections -->
  <text x="270" y="178" font-family="Inter, sans-serif" font-size="8" fill="#666">ambiguitas</text>
  <text x="270" y="300" font-family="Inter, sans-serif" font-size="8" fill="#666">makna</text>
  <text x="480" y="230" font-family="Inter, sans-serif" font-size="8" fill="#666">kepastian</text>
  
  <!-- Bottom quote -->
  <text x="400" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">"Cermin yang diperbesar — mencerminkan keinginan manusia dalam bentuk yang tampak otoritatif"</text>
</svg>
