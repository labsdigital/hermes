<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="580" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Pipeline Vibe Coding: Konsep ke Playable Prototype</text>
  
  <!-- Step 1: Concept -->
  <rect x="40" y="70" width="120" height="80" rx="10" fill="none" stroke="url(#g1)" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="100" text-anchor="middle" fill="#ff6b35" font-size="24">1</text>
  <text x="100" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">KONSEP</text>
  <text x="100" y="140" text-anchor="middle" fill="#888" font-size="9">Vague idea</text>
  
  <!-- Arrow 1->2 -->
  <path d="M 165 110 L 195 110" stroke="#ff6b35" stroke-width="2"/>
  
  <!-- Step 2: Boilerplate -->
  <rect x="200" y="70" width="120" height="80" rx="10" fill="none" stroke="url(#g2)" stroke-width="2"/>
  <text x="260" y="100" text-anchor="middle" fill="#7c3aed" font-size="24">2</text>
  <text x="260" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">BOILERPLATE</text>
  <text x="260" y="140" text-anchor="middle" fill="#888" font-size="9">HTML + CSS + JS</text>
  
  <!-- Arrow 2->3 -->
  <path d="M 325 110 L 355 110" stroke="#7c3aed" stroke-width="2"/>
  
  <!-- Step 3: Mechanics -->
  <rect x="360" y="70" width="120" height="80" rx="10" fill="none" stroke="url(#g3)" stroke-width="2"/>
  <text x="420" y="100" text-anchor="middle" fill="#06b6d4" font-size="24">3</text>
  <text x="420" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">MEKANIK</text>
  <text x="420" y="140" text-anchor="middle" fill="#888" font-size="9">Prompt chain</text>
  
  <!-- Arrow 3->4 -->
  <path d="M 485 110 L 515 110" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Step 4: Loop & State -->
  <rect x="520" y="70" width="120" height="80" rx="10" fill="none" stroke="url(#g4)" stroke-width="2"/>
  <text x="580" y="100" text-anchor="middle" fill="#10b981" font-size="24">4</text>
  <text x="580" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">LOOP & STATE</text>
  <text x="580" y="140" text-anchor="middle" fill="#888" font-size="9">Game loop + FSM</text>
  
  <!-- Arrow 4->5 -->
  <path d="M 645 110 L 675 110" stroke="#10b981" stroke-width="2"/>
  
  <!-- Step 5: Polish -->
  <rect x="680" y="70" width="80" height="80" rx="10" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="720" y="100" text-anchor="middle" fill="#fff" font-size="24">5</text>
  <text x="720" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">POLISH</text>
  <text x="720" y="140" text-anchor="middle" fill="#888" font-size="9">Assets + FX</text>
  
  <!-- Bottom section: Prompt Examples -->
  <rect x="40" y="200" width="720" height="320" rx="12" fill="#111" stroke="#333"/>
  
  <text x="60" y="230" fill="#fff" font-size="14" font-weight="600">Contoh Prompt Chain (Iteratif)</text>
  
  <!-- Prompt boxes -->
  <rect x="60" y="250" width="200" height="50" rx="6" fill="#1a1a2e" stroke="#ff6b35"/>
  <text x="70" y="270" fill="#ff6b35" font-size="10" font-family="monospace">PROMPT 1</text>
  <text x="70" y="288" fill="#ccc" font-size="9" font-family="monospace">"Buatkan class Tile..."</text>
  
  <rect x="280" y="250" width="200" height="50" rx="6" fill="#1a1a2e" stroke="#7c3aed"/>
  <text x="290" y="270" fill="#7c3aed" font-size="10" font-family="monospace">PROMPT 2</text>
  <text x="290" y="288" fill="#ccc" font-size="9" font-family="monospace">"Tambahkan InputHandler..."</text>
  
  <rect x="500" y="250" width="240" height="50" rx="6" fill="#1a1a2e" stroke="#06b6d4"/>
  <text x="510" y="270" fill="#06b6d4" font-size="10" font-family="monospace">PROMPT 3</text>
  <text x="510" y="288" fill="#ccc" font-size="9" font-family="monospace">"Implementasikan win condition..."</text>
  
  <!-- Feedback loop -->
  <path d="M 680 320 L 680 380 Q 680 420 640 420 L 160 420 Q 120 420 120 380 L 120 320" 
        stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <text x="400" y="440" text-anchor="middle" fill="#10b981" font-size="11">Iterasi berdasarkan feedback</text>
  
  <!-- Key principles -->
  <text x="60" y="480" fill="#fff" font-size="12" font-weight="500">Prinsip Vibe Coding:</text>
  <text x="60" y="500" fill="#888" font-size="10">• Prompt iteratif (bukan monolitik)</text>
  <text x="280" y="500" fill="#888" font-size="10">• Context window adalah aset</text>
  <text x="500" y="500" fill="#888" font-size="10">• Verifikasi, jangan hanya copy-paste</text>
  <text x="60" y="520" fill="#888" font-size="10">• Version control tetap wajib</text>
  <text x="280" y="520" fill="#888" font-size="10">• Backup knowledge manual</text>
  
  <!-- Time comparison -->
  <rect x="60" y="540" width="300" height="30" rx="6" fill="#1a1a2e"/>
  <text x="75" y="560" fill="#ff6b35" font-size="10">Traditional: 2-4 jam</text>
  <text x="200" y="560" fill="#888" font-size="10">|</text>
  <text x="220" y="560" fill="#10b981" font-size="10">Vibe Coding: 5-10 menit</text>
</svg>