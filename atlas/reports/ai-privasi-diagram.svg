<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Privasi di Era Digital</title>
  <desc id="svg-desc">Diagram yang menggambarkan bagaimana data pribadi dikumpulkan oleh mesin dan algoritma di era digital modern.</desc>
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Privasi di Era Mesin yang Tahu</text>
  
  <!-- Central figure: Human -->
  <circle cx="400" cy="220" r="50" fill="#e94560" opacity="0.8"/>
  <text x="400" y="225" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14">Manusia</text>
  
  <!-- Data points flowing out -->
  <g stroke="#fff" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Top right - Phone -->
    <path d="M 450 180 L 550 130"/>
    <rect x="560" y="110" width="40" height="70" rx="5" fill="#0f3460" stroke="#fff"/>
    <text x="580" y="150" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10">HP</text>
    
    <!-- Right - Social Media -->
    <path d="M 450 220 L 580 220"/>
    <rect x="590" y="200" width="50" height="40" rx="5" fill="#0f3460" stroke="#fff"/>
    <text x="615" y="225" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9">Sosmed</text>
    
    <!-- Bottom right - Shopping -->
    <path d="M 450 260 L 550 310"/>
    <rect x="560" y="300" width="50" height="40" rx="5" fill="#0f3460" stroke="#fff"/>
    <text x="585" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9">Belanja</text>
    
    <!-- Bottom left - Location -->
    <path d="M 350 260 L 250 310"/>
    <rect x="200" y="300" width="50" height="40" rx="5" fill="#0f3460" stroke="#fff"/>
    <text x="225" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9">Lokasi</text>
    
    <!-- Left - Health -->
    <path d="M 350 220 L 220 220"/>
    <rect x="160" y="200" width="50" height="40" rx="5" fill="#0f3460" stroke="#fff"/>
    <text x="185" y="225" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9">Kesehatan</text>
    
    <!-- Top left - Search -->
    <path d="M 350 180 L 250 130"/>
    <rect x="200" y="110" width="50" height="40" rx="5" fill="#0f3460" stroke="#fff"/>
    <text x="225" y="135" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9">Pencarian</text>
  </g>
  
  <!-- Data collection nodes -->
  <g fill="#e94560" opacity="0.9">
    <circle cx="580" cy="145" r="3"/>
    <circle cx="615" cy="220" r="3"/>
    <circle cx="585" cy="320" r="3"/>
    <circle cx="225" cy="320" r="3"/>
    <circle cx="185" cy="220" r="3"/>
    <circle cx="225" cy="130" r="3"/>
  </g>
  
  <!-- AI/Algorithm representation -->
  <rect x="320" y="380" width="160" height="60" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">Algoritma</text>
  <text x="400" y="425" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Mengumpulkan &amp; Menganalisis</text>
  
  <!-- Connecting lines to algorithm -->
  <g stroke="#e94560" stroke-width="1" stroke-dasharray="5,5" fill="none" opacity="0.5">
    <path d="M 580 145 L 480 390"/>
    <path d="M 615 220 L 480 400"/>
    <path d="M 585 320 L 470 420"/>
    <path d="M 225 320 L 330 420"/>
    <path d="M 185 220 L 320 400"/>
    <path d="M 225 130 L 320 390"/>
  </g>
  
  <!-- Privacy shield concept -->
  <circle cx="400" cy="100" r="35" fill="none" stroke="#4ecca3" stroke-width="2" opacity="0.7"/>
  <text x="400" y="95" text-anchor="middle" fill="#4ecca3" font-family="Arial" font-size="10">Privasi</text>
  <text x="400" y="110" text-anchor="middle" fill="#4ecca3" font-family="Arial" font-size="8">??</text>
  
  <!-- Legend -->
  <g transform="translate(50, 450)" fill="#fff" font-family="Arial" font-size="10">
    <circle cx="0" cy="0" r="4" fill="#e94560"/>
    <text x="12" y="4">Data Pribadi</text>
    <rect x="100" y="-4" width="8" height="8" fill="#0f3460" stroke="#fff"/>
    <text x="114" y="4">Platform Digital</text>
    <line x1="230" y1="0" x2="260" y2="0" stroke="#e94560" stroke-width="2"/>
    <text x="268" y="4">Alur Data</text>
  </g>
</svg>
