<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="22" font-weight="700" letter-spacing="1">MESIN Bekerja Tanpa Henti</text>
  <text x="400" y="70" text-anchor="middle" fill="#8899aa" font-family="Inter, sans-serif" font-size="13">Dampak AI terhadap Makna Pekerjaan dan Identitas Manusia</text>
  
  <!-- Central circle: Human -->
  <circle cx="400" cy="260" r="90" fill="none" stroke="#ff6b35" stroke-width="2.5" filter="url(#glow)"/>
  <text x="400" y="250" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="600">MANUSIA</text>
  <text x="400" y="272" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="11">Nguripi</text>
  
  <!-- AI circle overlapping -->
  <circle cx="400" cy="260" r="150" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="400" y="115" text-anchor="middle" fill="#4a90d9" font-family="Inter, sans-serif" font-size="13" font-weight="600">MESIN (AI)</text>
  
  <!-- Orbiting elements -->
  <!-- Top: Identity -->
  <rect x="220" y="100" width="120" height="40" rx="8" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1"/>
  <text x="280" y="125" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Identitas</text>
  <line x1="310" y1="120" x2="330" y2="170" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  
  <!-- Left: Livelihood -->
  <rect x="100" y="230" width="120" height="40" rx="8" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1"/>
  <text x="160" y="255" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Nafkah</text>
  <line x1="220" y1="250" x2="310" y2="250" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  
  <!-- Right: Automation -->
  <rect x="580" y="230" width="120" height="40" rx="8" fill="#3d1f1f" stroke="#ff6b35" stroke-width="1"/>
  <text x="640" y="255" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Automasi</text>
  <line x1="490" y1="250" x2="580" y2="250" stroke="#ff6b35" stroke-width="1" opacity="0.5"/>
  
  <!-- Bottom: Meaning -->
  <rect x="280" y="390" width="240" height="40" rx="8" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1"/>
  <text x="400" y="415" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Makna Kehidupan</text>
  <line x1="400" y1="350" x2="400" y2="390" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
  
  <!-- Key insight box -->
  <rect x="120" y="450" width="560" height="40" rx="6" fill="#0d1b2a" stroke="#ff6b35" stroke-width="1" opacity="0.8"/>
  <text x="400" y="475" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="11">Pertanyaan Kunci: "Setelah mesin menggantikan semua yang bisa digantikan,</text>
  
  <!-- Bottom text continuation -->
  <text x="400" y="492" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="11">apa yang masih bisa kita lakukan yang hanya manusia bisa lakukan?"</text>
  
  <!-- Decorative dots -->
  <circle cx="180" cy="180" r="3" fill="#ff6b35" opacity="0.4"/>
  <circle cx="620" cy="180" r="3" fill="#4a90d9" opacity="0.4"/>
  <circle cx="150" cy="350" r="2" fill="#ff6b35" opacity="0.3"/>
  <circle cx="650" cy="350" r="2" fill="#4a90d9" opacity="0.3"/>
</svg>
