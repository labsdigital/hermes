<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Window with autumn leaves outside -->
  <rect x="40" y="40" width="180" height="240" rx="8" fill="#fff8ee" stroke="#c4a882" stroke-width="3"/>
  <rect x="50" y="50" width="70" height="105" rx="4" fill="#e8d5b7" stroke="#c4a882" stroke-width="1.5"/>
  <rect x="130" y="50" width="70" height="105" rx="4" fill="#e8d5b7" stroke="#c4a882" stroke-width="1.5"/>
  <rect x="50" y="165" width="70" height="105" rx="4" fill="#e8d5b7" stroke="#c4a882" stroke-width="1.5"/>
  <rect x="130" y="165" width="70" height="105" rx="4" fill="#e8d5b7" stroke="#c4a882" stroke-width="1.5"/>
  
  <!-- Autumn leaves outside window -->
  <ellipse cx="75" cy="80" rx="12" ry="8" fill="#d4a574" opacity="0.8"/>
  <ellipse cx="160" cy="90" rx="10" ry="7" fill="#c4956a" opacity="0.7"/>
  <ellipse cx="90" cy="200" rx="11" ry="6" fill="#d4a574" opacity="0.6"/>
  
  <!-- Desk -->
  <rect x="30" y="300" width="540" height="12" rx="3" fill="#b8956a"/>
  <rect x="30" y="312" width="8" height="60" fill="#a07850"/>
  <rect x="562" y="312" width="8" height="60" fill="#a07850"/>
  
  <!-- Teacher silhouette (right side) -->
  <ellipse cx="480" cy="220" rx="35" ry="40" fill="#8b7355" opacity="0.6"/>
  <path d="M445 260 Q480 300 515 260 L515 300 L445 300 Z" fill="#8b7355" opacity="0.5"/>
  
  <!-- Student silhouettes (background) -->
  <ellipse cx="200" cy="250" rx="25" ry="30" fill="#a08060" opacity="0.4"/>
  <ellipse cx="260" cy="255" rx="25" ry="30" fill="#a08060" opacity="0.4"/>
  <ellipse cx="320" cy="252" rx="25" ry="30" fill="#a08060" opacity="0.4"/>
  
  <!-- Tablets on desk -->
  <rect x="150" y="270" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="155" y="275" width="50" height="20" rx="2" fill="#e8f4f8" opacity="0.8"/>
  
  <rect x="230" y="272" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="235" y="277" width="50" height="20" rx="2" fill="#e8f4f8" opacity="0.8"/>
  
  <rect x="310" y="268" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <rect x="315" y="273" width="50" height="20" rx="2" fill="#e8f4f8" opacity="0.8"/>
  
  <!-- Connection lines (AI + human) -->
  <path d="M180 240 Q300 200 420 220" fill="none" stroke="#d4a574" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Title area -->
  <text x="300" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#6b5b4a">AI 教育：有温度的陪伴</text>
</svg>
