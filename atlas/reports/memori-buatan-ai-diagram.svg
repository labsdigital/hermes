<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Memori Buatan AI: Transformasi Kenangan Menjadi Data Digital</title>
  <desc id="svg-desc">Diagram yang menggambarkan proses transformasi memori manusia menjadi data digital melalui AI, termasuk tahap pengumpulan, analisis, dan rekonstruksi.</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- LEFT SIDE: Manusia & Memori -->
  <g transform="translate(0, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    
    <!-- Human head silhouette -->
    <circle cx="205" cy="100" r="50" fill="#fed7aa" opacity="0.8"/>
    
    <!-- Memory symbols -->
    <rect x="100" y="180" width="60" height="40" rx="8" fill="#fb923c" opacity="0.7"/>
    <rect x="180" y="180" width="60" height="40" rx="8" fill="#fb923c" opacity="0.7"/>
    <rect x="260" y="180" width="60" height="40" rx="8" fill="#fb923c" opacity="0.7"/>
    
    <!-- Photo icons -->
    <circle cx="130" cy="270" r="25" fill="#fdba74" opacity="0.8"/>
    <circle cx="205" cy="270" r="25" fill="#fdba74" opacity="0.8"/>
    <circle cx="280" cy="270" r="25" fill="#fdba74" opacity="0.8"/>
    
    <!-- Labels -->
    <text x="205" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7c2d12" font-weight="bold">Manusia</text>
    <text x="205" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9a3412">Memori & Jejak Digital</text>
  </g>
  
  <!-- Center: AI Processing -->
  <g transform="translate(395, 0)">
    <!-- Arrow container -->
    <rect x="-15" y="80" width="30" height="240" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" rx="5"/>
    
    <!-- AI Chip icon -->
    <rect x="-35" y="160" width="70" height="80" rx="10" fill="#3b82f6" opacity="0.9"/>
    <rect x="-25" y="170" width="50" height="60" rx="5" fill="#1d4ed8"/>
    
    <!-- Circuit lines -->
    <line x1="-35" y1="190" x2="-50" y2="190" stroke="#93c5fd" stroke-width="2"/>
    <line x1="-35" y1="210" x2="-50" y2="210" stroke="#93c5fd" stroke-width="2"/>
    <line x1="-35" y1="230" x2="-50" y2="230" stroke="#93c5fd" stroke-width="2"/>
    <line x1="35" y1="190" x2="50" y2="190" stroke="#93c5fd" stroke-width="2"/>
    <line x1="35" y1="210" x2="50" y2="210" stroke="#93c5fd" stroke-width="2"/>
    <line x1="35" y1="230" x2="50" y2="230" stroke="#93c5fd" stroke-width="2"/>
    
    <!-- Processing arrows -->
    <polygon points="0,100 -10,115 10,115" fill="#3b82f6"/>
    <polygon points="0,280 -10,265 10,265" fill="#3b82f6"/>
    
    <!-- Label -->
    <text x="0" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e3a8a" font-weight="bold">AI</text>
    <text x="0" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e40af">Proses</text>
  </g>
  
  <!-- RIGHT SIDE: Digital Twin -->
  <g transform="translate(410, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    
    <!-- Digital brain -->
    <circle cx="205" cy="100" r="50" fill="#bfdbfe" opacity="0.8"/>
    <circle cx="205" cy="100" r="35" fill="#93c5fd" opacity="0.6"/>
    
    <!-- Data streams -->
    <line x1="100" y1="180" x2="310" y2="180" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="100" y1="200" x2="310" y2="200" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="100" y1="220" x2="310" y2="220" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,3"/>
    
    <!-- Digital faces -->
    <circle cx="130" cy="270" r="25" fill="#93c5fd" opacity="0.8"/>
    <circle cx="205" cy="270" r="25" fill="#93c5fd" opacity="0.8"/>
    <circle cx="280" cy="270" r="25" fill="#93c5fd" opacity="0.8"/>
    
    <!-- Labels -->
    <text x="205" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e3a8a" font-weight="bold">Digital Twin</text>
    <text x="205" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">Simulasi Interaktif</text>
  </g>
  
  <!-- Top labels -->
  <text x="205" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Data Personal</text>
  <text x="605" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Avatar Digital</text>
</svg>
