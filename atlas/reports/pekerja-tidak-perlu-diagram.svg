<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b2b"/>
      <stop offset="100%" style="stop-color:#ff8c42"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ff6b2b" font-size="22" font-weight="700" filter="url(#glow)">REVOLUSI AI &amp; MASA DEPAN PEKERJA</text>
  
  <!-- Three eras -->
  <!-- Era 1: Hunter-Gatherer -->
  <rect x="40" y="80" width="200" height="340" rx="12" fill="#12121c" stroke="#333" stroke-width="1"/>
  <circle cx="140" cy="120" r="30" fill="none" stroke="#ff6b2b" stroke-width="2" opacity="0.6"/>
  <text x="140" y="128" text-anchor="middle" fill="#ff6b2b" font-size="14" font-weight="600">1</text>
  <text x="140" y="175" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="700">Masa Pra-Industri</text>
  <text x="140" y="200" text-anchor="middle" fill="#888" font-size="11">10.000 SM – 1750 M</text>
  <line x1="60" y1="220" x2="220" y2="220" stroke="#333" stroke-width="1"/>
  <text x="140" y="245" text-anchor="middle" fill="#aaa" font-size="11">• Bekerja = bertahan hidup</text>
  <text x="140" y="265" text-anchor="middle" fill="#aaa" font-size="11">• 90% penduduk tani</text>
  <text x="140" y="285" text-anchor="middle" fill="#aaa" font-size="11">• Otot &amp; tenaga manusia</text>
  <text x="140" y="315" text-anchor="middle" fill="#ff6b2b" font-size="10" font-weight="600">RIBU TAHUN</text>
  <text x="140" y="335" text-anchor="middle" fill="#666" font-size="10">stabilitas ekstrem</text>
  
  <!-- Era 2: Industrial -->
  <rect x="300" y="80" width="200" height="340" rx="12" fill="#12121c" stroke="#ff6b2b" stroke-width="1.5" opacity="0.9"/>
  <circle cx="400" cy="120" r="30" fill="none" stroke="#ff6b2b" stroke-width="2" opacity="0.6"/>
  <text x="400" y="128" text-anchor="middle" fill="#ff6b2b" font-size="14" font-weight="600">2</text>
  <text x="400" y="175" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="700">Revolusi Industri</text>
  <text x="400" y="200" text-anchor="middle" fill="#888" font-size="11">1750 – 2020</text>
  <line x1="320" y1="220" x2="480" y2="220" stroke="#ff6b2b" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="245" text-anchor="middle" fill="#aaa" font-size="11">• Mesin ganti otot</text>
  <text x="400" y="265" text-anchor="middle" fill="#aaa" font-size="11">• Manusia tetap dibutuhkan</text>
  <text x="400" y="285" text-anchor="middle" fill="#aaa" font-size="11">• Identitas = pekerjaan</text>
  <text x="400" y="315" text-anchor="middle" fill="#ff6b2b" font-size="10" font-weight="600">200 TAHUN</text>
  <text x="400" y="335" text-anchor="middle" fill="#666" font-size="10">adaptasi bertahap</text>
  
  <!-- Era 3: AI Revolution -->
  <rect x="560" y="80" width="200" height="340" rx="12" fill="#12121c" stroke="#ff4500" stroke-width="2" filter="url(#glow)"/>
  <circle cx="660" cy="120" r="30" fill="none" stroke="#ff4500" stroke-width="2" opacity="0.8"/>
  <text x="660" y="128" text-anchor="middle" fill="#ff4500" font-size="14" font-weight="600">3</text>
  <text x="660" y="175" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Revolusi AI</text>
  <text x="660" y="200" text-anchor="middle" fill="#ff8c42" font-size="11">2020 – ?</text>
  <line x1="580" y1="220" x2="740" y2="220" stroke="#ff4500" stroke-width="1" opacity="0.5"/>
  <text x="660" y="245" text-anchor="middle" fill="#ddd" font-size="11">• Mesin ganti pikiran</text>
  <text x="660" y="265" text-anchor="middle" fill="#ddd" font-size="11">• Otomatisasi kognitif</text>
  <text x="660" y="285" text-anchor="middle" fill="#ddd" font-size="11">• Kerja ≠ identitas?</text>
  <text x="660" y="315" text-anchor="middle" fill="#ff4500" font-size="10" font-weight="600">SAAT INI</text>
  <text x="660" y="335" text-anchor="middle" fill="#ff6b2b" font-size="10">kecepatan tak terbayang</text>
  
  <!-- Arrow between eras -->
  <path d="M245 250 L290 250" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M505 250 L550 250" stroke="#ff4500" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Question at bottom -->
  <rect x="150" y="440" width="500" height="45" rx="8" fill="#1a1a2e" stroke="#ff6b2b" stroke-width="1" opacity="0.8"/>
  <text x="400" y="468" text-anchor="middle" fill="#ff8c42" font-size="13" font-weight="600">Pertanyaan terbesar: Apa artinya menjadi manusia ketika kerja tidak lagi diperlukan?</text>
</svg>