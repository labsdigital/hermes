<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="350" y="40" text-anchor="middle" fill="#e6e6e6" font-size="18" font-weight="bold">Arsitektur Warisan Digital</text>
  <text x="350" y="62" text-anchor="middle" fill="#8892b0" font-size="12">Tiga Lapisan Penciptaan Memori Mesin</text>
  
  <!-- Layer 1: Data -->
  <rect x="50" y="90" width="600" height="100" rx="10" fill="url(#layer1)" opacity="0.85" filter="url(#glow)"/>
  <text x="80" y="120" fill="#fff" font-size="16" font-weight="bold">Lapisan 1: DATA</text>
  <text x="80" y="145" fill="#e0e0e0" font-size="12">Jejak digital — pesan, foto, email, video, suara</text>
  <text x="80" y="165" fill="#c0c0c0" font-size="11">Setiap interaksi online meninggalkan jejak yang dapat diabadikan</text>
  
  <!-- Arrow 1→2 -->
  <line x1="350" y1="190" x2="350" y2="215" stroke="#8892b0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 2: Model -->
  <rect x="50" y="220" width="600" height="100" rx="10" fill="url(#layer2)" opacity="0.85" filter="url(#glow)"/>
  <text x="80" y="250" fill="#fff" font-size="16" font-weight="bold">Lapisan 2: MODEL</text>
  <text x="80" y="275" fill="#e0e0e0" font-size="12">Algoritma pembelajaran mesin yang mengenali pola identitas</text>
  <text x="80" y="295" fill="#c0c0c0" font-size="11">Menangkap kepribadian, nada bicara, dan cara berpikir</text>
  
  <!-- Arrow 2→3 -->
  <line x1="350" y1="320" x2="350" y2="345" stroke="#8892b0" stroke-width="2"/>
  
  <!-- Layer 3: Interface -->
  <rect x="50" y="350" width="600" height="100" rx="10" fill="url(#layer3)" opacity="0.85" filter="url(#glow)"/>
  <text x="80" y="380" fill="#1a1a2e" font-size="16" font-weight="bold">Lapisan 3: ANTARMUKA</text>
  <text x="80" y="405" fill="#2a2a4a" font-size="12">Chatbot / avatar interaktif untuk berdialog dengan warisan digital</text>
  <text x="80" y="425" fill="#3a3a5a" font-size="11">Memungkinkan generasi mendatang berinteraksi dengan memori almarhum</text>
  
  <!-- Side annotations -->
  <text x="670" y="140" text-anchor="end" fill="#667eea" font-size="10" font-style="italic">Foundation</text>
  <text x="670" y="270" text-anchor="end" fill="#f093fb" font-size="10" font-style="italic">Intelligence</text>
  <text x="670" y="400" text-anchor="end" fill="#4facfe" font-size="10" font-style="italic">Connection</text>
</svg>
