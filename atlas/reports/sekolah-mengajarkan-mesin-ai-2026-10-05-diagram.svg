<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Sekolah yang Mengajarkan Mesin, Bukan Manusia</title>
  <desc id="desc">Diagram perbandingan antara pembelajaran dengan guru manusia versus tutor AI, menunjukkan apa yang hilang dalam proses otomatisasi pendidikan.</desc>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#667eea" text-anchor="middle">Dua Jenis Pembelajaran</text>
  
  <!-- Left Side: Human Teacher -->
  <rect x="30" y="80" width="240" height="280" rx="12" fill="#16213e" stroke="#667eea" stroke-width="2"/>
  <circle cx="150" cy="130" r="40" fill="#667eea" opacity="0.3"/>
  <text x="150" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#64ffda" text-anchor="middle">Guru Manusia</text>
  <text x="150" y="145" font-family="Inter, sans-serif" font-size="10" fill="#8892b0" text-anchor="middle">👤</text>
  
  <!-- Human teacher benefits -->
  <g font-family="Inter, sans-serif" font-size="12" fill="#e6e6e6">
    <text x="50" y="190">✓ Membaca emosi siswa</text>
    <text x="50" y="210">✓ Mengajak bertanya "mengapa"</text>
    <text x="50" y="230">✓ Menumbuhkan kebijaksanaan</text>
    <text x="50" y="250">✓ Memberi makna personal</text>
    <text x="50" y="270">✓ Merawat, bukan mengelola</text>
    <text x="50" y="290">✓ Toleransi terhadap ketidakpastian</text>
  </g>
  
  <!-- Right Side: AI Tutor -->
  <rect x="330" y="80" width="240" height="280" rx="12" fill="#16213e" stroke="#764ba2" stroke-width="2"/>
  <circle cx="450" cy="130" r="40" fill="#764ba2" opacity="0.3"/>
  <text x="450" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#f093fb" text-anchor="middle">AI Tutor</text>
  <text x="450" y="145" font-family="Inter, sans-serif" font-size="10" fill="#8892b0" text-anchor="middle">🤖</text>
  
  <!-- AI tutor benefits -->
  <g font-family="Inter, sans-serif" font-size="12" fill="#e6e6e6">
    <text x="350" y="190">✓ Pembelajaran personal</text>
    <text x="350" y="210">✓ Akses 24/7</text>
    <text x="350" y="230">✓ Evaluasi instan</text>
    <text x="350" y="250">✓ Tidak pernah lelah</text>
    <text x="350" y="270">✓ Skala besar</text>
    <text x="350" y="290">✗ Tidak punya stakes</text>
  </g>
  
  <!-- Bottom: What's Lost -->
  <rect x="100" y="330" width="400" height="55" rx="8" fill="#0f0f1a" stroke="#ef4444" stroke-width="1"/>
  <text x="300" y="355" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle">Yang Hilang dalam Optimasi</text>
  <text x="300" y="375" font-family="Inter, sans-serif" font-size="11" fill="#8892b0" text-anchor="middle">Koneksi manusiawi • Makna personal • Pertanyaan yang tidak terukur</text>
</svg>