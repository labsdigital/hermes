<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="chain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold" filter="url(#glow)">RANTAI EKONOMI MODERN YANG PUTUS</text>
  
  <!-- Chain links - intact section -->
  <rect x="80" y="200" width="120" height="60" rx="10" fill="#4ecca3" opacity="0.9"/>
  <text x="140" y="235" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">Pengetahuan</text>
  
  <rect x="220" y="200" width="120" height="60" rx="10" fill="#4ecca3" opacity="0.9"/>
  <text x="280" y="235" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">Kemampuan</text>
  
  <rect x="360" y="200" width="120" height="60" rx="10" fill="#4ecca3" opacity="0.9"/>
  <text x="420" y="235" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">Pekerjaan</text>
  
  <!-- Broken chain - AI disrupting -->
  <rect x="500" y="200" width="60" height="60" rx="10" fill="#e94560" opacity="0.7"/>
  <text x="530" y="235" text-anchor="middle" fill="#ffffff" font-size="20">✕</text>
  
  <rect x="580" y="200" width="120" height="60" rx="10" fill="#e94560" opacity="0.9"/>
  <text x="640" y="235" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Pendapatan?</text>
  
  <!-- Arrow showing break -->
  <path d="M 480 230 L 500 230" stroke="#e94560" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Second row - consequences -->
  <rect x="220" y="320" width="120" height="60" rx="10" fill="#4ecca3" opacity="0.9"/>
  <text x="280" y="355" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">Status Sosial</text>
  
  <rect x="360" y="320" width="120" height="60" rx="10" fill="#4ecca3" opacity="0.9"/>
  <text x="420" y="355" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">Martabat</text>
  
  <rect x="500" y="320" width="120" height="60" rx="10" fill="#4ecca3" opacity="0.9"/>
  <text x="560" y="355" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">Identitas</text>
  
  <!-- AI icon breaking the chain -->
  <circle cx="530" cy="230" r="45" fill="none" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <text x="530" y="225" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">AI</text>
  <text x="530" y="245" text-anchor="middle" fill="#e94560" font-size="10">Mengganggu</text>
  
  <!-- Bottom section - the new reality -->
  <rect x="150" y="450" width="200" height="80" rx="10" fill="#533483" opacity="0.8"/>
  <text x="250" y="485" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Masa Depan yang Kabur</text>
  <text x="250" y="510" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.8">Kelas yang Tak Terpakai?</text>
  
  <rect x="450" y="450" width="200" height="80" rx="10" fill="#533483" opacity="0.8"/>
  <text x="550" y="485" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Pertanyaan Besar</text>
  <text x="550" y="510" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.8">Apa nilai manusia tanpa kerja?</text>
  
  <!-- Connecting arrows -->
  <line x1="420" y1="260" x2="420" y2="310" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="280" y1="260" x2="280" y2="310" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="640" y1="260" x2="640" y2="310" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Source note -->
  <text x="400" y="570" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.5">Berdasarkan analisis Yuval Noah Harari tentang dampak AI terhadap tenaga kerja</text>
</svg>