<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Piramida Pengetahuan: Fondasi vs. Ringkasan AI</text>
  
  <!-- Human learning path - building from bottom -->
  <g transform="translate(120, 80)">
    <!-- Foundation layers -->
    <rect x="0" y="200" width="160" height="40" rx="4" fill="url(#human)" opacity="0.9"/>
    <text x="80" y="225" text-anchor="middle" fill="white" font-size="11" font-weight="600">Membaca & Menulis</text>
    
    <rect x="0" y="155" width="160" height="40" rx="4" fill="url(#human)" opacity="0.85"/>
    <text x="80" y="180" text-anchor="middle" fill="white" font-size="11" font-weight="600">Berhitung & Logika</text>
    
    <rect x="0" y="110" width="160" height="40" rx="4" fill="url(#human)" opacity="0.8"/>
    <text x="80" y="135" text-anchor="middle" fill="white" font-size="11" font-weight="600">Analisis & Evaluasi</text>
    
    <rect x="0" y="65" width="160" height="40" rx="4" fill="url(#human)" opacity="0.75"/>
    <text x="80" y="90" text-anchor="middle" fill="white" font-size="11" font-weight="600">Sintesis & Kreasi</text>
    
    <!-- Arrow showing upward process -->
    <path d="M 180 220 L 220 220 L 220 65 L 180 65" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="220,60 215,70 225,70" fill="#f97316"/>
    <text x="235" y="150" fill="#f97316" font-size="10" font-weight="600">Proses</text>
    <text x="235" y="165" fill="#f97316" font-size="10" font-weight="600">Berjenjang</text>
    
    <!-- Label -->
    <text x="80" y="270" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Pembelajaran Manusia</text>
    <text x="80" y="290" text-anchor="middle" fill="#94a3b8" font-size="11">Bangun dari fondasi</text>
  </g>
  
  <!-- AI shortcut path -->
  <g transform="translate(480, 80)">
    <!-- Single block - product only -->
    <rect x="0" y="65" width="160" height="175" rx="4" fill="url(#ai)" opacity="0.7"/>
    <text x="80" y="140" text-anchor="middle" fill="white" font-size="12" font-weight="600">Output AI</text>
    <text x="80" y="160" text-anchor="middle" fill="white" font-size="10">Esai siap pakai</text>
    <text x="80" y="175" text-anchor="middle" fill="white" font-size="10">Jawaban instan</text>
    <text x="80" y="190" text-anchor="middle" fill="white" font-size="10">Analisis otomatis</text>
    
    <!-- Question mark -->
    <circle cx="80" cy="45" r="18" fill="#ef4444" opacity="0.8"/>
    <text x="80" y="51" text-anchor="middle" fill="white" font-size="18" font-weight="700">?</text>
    <text x="80" y="260" text-anchor="middle" fill="#94a3b8" font-size="10">Fondasi? Tidak jelas</text>
    
    <!-- Label -->
    <text x="80" y="280" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Jalan Pintas AI</text>
    
    <!-- Warning icon -->
    <path d="M 10 30 L 50 30 L 30 60 Z" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="50" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="700">!</text>
  </g>
  
  <!-- Connection between them -->
  <g transform="translate(320, 200)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="40" y="-10" text-anchor="middle" fill="#94a3b8" font-size="10">vs</text>
  </g>
  
  <!-- Bottom insight -->
  <g transform="translate(400, 340)">
    <rect x="0" y="0" width="800" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="400" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Paradoks Inti</text>
    <text x="400" y="52" text-anchor="middle" fill="#cbd5e1" font-size="11">AI memberikan produk akhir tanpa proses — seperti atap tanpa gedung</text>
  </g>
  
  <!-- Key insight boxes -->
  <g transform="translate(60, 450)">
    <rect x="0" y="0" width="240" height="60" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1" opacity="0.8"/>
    <text x="120" y="22" text-anchor="middle" fill="#f97316" font-size="11" font-weight="600">Kesulitan = Bahan Bakar</text>
    <text x="120" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">Struggling membangun koneksi</text>
    <text x="120" y="54" text-anchor="middle" fill="#94a3b8" font-size="10">sinaptik yang permanen</text>
  </g>
  
  <g transform="translate(340, 450)">
    <rect x="0" y="0" width="240" height="60" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
    <text x="120" y="22" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="600">Amnesia Kognitif</text>
    <text x="120" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">Otak berhenti menyimpan</text>
    <text x="120" y="54" text-anchor="middle" fill="#94a3b8" font-size="10">ketika mesin menyimpan untuk kita</text>
  </g>
  
  <g transform="translate(620, 450)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
    <text x="70" y="22" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">Solusi?</text>
    <text x="70" y="40" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">AI sebagai mitra,</text>
    <text x="70" y="54" text-anchor="middle" fill="#94a3b8" font-size="10">bukan pengganti</text>
  </g>
</svg>
