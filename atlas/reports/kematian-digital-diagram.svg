<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c62a47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="20" font-weight="bold" letter-spacing="2">DIGITAL IMMORTALITY: DATA vs BEING</text>
  
  <!-- Left side: Human -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="url(#humanGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="60" fill="url(#humanGrad)" opacity="0.15"/>
  
  <!-- Human icon (simplified) -->
  <circle cx="200" cy="175" r="18" fill="#e94560"/>
  <path d="M170 230 Q200 210 230 230 L230 280 L170 280 Z" fill="#e94560" opacity="0.8"/>
  
  <text x="200" y="310" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">MANUSIA</text>
  <text x="200" y="330" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Kesadaran · Qualia · Kehadiran</text>
  
  <!-- Data streams from human -->
  <line x1="280" y1="180" x2="520" y2="180" stroke="#e94560" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="280" y1="200" x2="520" y2="200" stroke="#e94560" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="280" y1="220" x2="520" y2="220" stroke="#e94560" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Data points flowing -->
  <circle cx="350" cy="180" r="4" fill="#e94560" opacity="0.8"/>
  <circle cx="420" cy="200" r="4" fill="#e94560" opacity="0.8"/>
  <circle cx="380" cy="220" r="4" fill="#e94560" opacity="0.8"/>
  <circle cx="480" cy="180" r="3" fill="#e94560" opacity="0.5"/>
  <circle cx="330" cy="210" r="3" fill="#e94560" opacity="0.5"/>
  
  <!-- Center: AI Processing -->
  <rect x="480" y="150" width="120" height="100" rx="10" fill="none" stroke="#533483" stroke-width="2" filter="url(#glow)"/>
  <text x="540" y="185" text-anchor="middle" fill="#533483" font-family="Inter, sans-serif" font-size="12" font-weight="bold">AI MODEL</text>
  <text x="540" y="205" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="10">Training Data</text>
  <text x="540" y="220" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="10">Pattern Match</text>
  <text x="540" y="235" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="10">Simulation</text>
  
  <!-- Output arrows -->
  <line x1="600" y1="190" x2="650" y2="190" stroke="#533483" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="210" x2="650" y2="210" stroke="#533483" stroke-width="2"/>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#533483"/>
    </marker>
  </defs>
  
  <!-- Right side: Simulation -->
  <circle cx="700" cy="200" r="70" fill="none" stroke="#533483" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <circle cx="700" cy="200" r="50" fill="#533483" opacity="0.1"/>
  
  <!-- AI icon (simplified) -->
  <rect x="680" y="180" width="40" height="35" rx="5" fill="none" stroke="#533483" stroke-width="2"/>
  <circle cx="692" cy="195" r="4" fill="#533483"/>
  <circle cx="708" cy="195" r="4" fill="#533483"/>
  <line x1="690" y1="210" x2="710" y2="210" stroke="#533483" stroke-width="2"/>
  
  <text x="700" y="250" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">SIMULASI</text>
  <text x="700" y="270" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Bukan Kesadaran</text>
  
  <!-- Bottom section: Key Insight -->
  <rect x="100" y="350" width="600" height="120" rx="10" fill="rgba(83,52,131,0.15)" stroke="#533483" stroke-width="1"/>
  
  <text x="400" y="380" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="13" font-weight="bold">PERTANYAAN POKOK</text>
  
  <text x="200" y="410" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">Apakah data tentang</text>
  <text x="200" y="430" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">seseorang = seseorang itu sendiri?</text>
  
  <text x="600" y="410" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">Apakah simulasi percakapan</text>
  <text x="600" y="430" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">= kehadiran sungguhan?</text>
  
  <!-- Bottom quote -->
  <text x="400" y="470" text-anchor="middle" fill="#533483" font-family="Inter, sans-serif" font-size="11" font-style="italic">"Similarity statistik ≠ Identicality esensial"</text>
</svg>
