<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="20" font-weight="600">Paradoks Koneksi di Era AI</text>
  
  <!-- Human Figure (Left) -->
  <g transform="translate(150, 200)">
    <!-- Body -->
    <circle cx="0" cy="-40" r="35" fill="url(#human)" filter="url(#glow)"/>
    <path d="M-50,20 Q0,-10 50,20 L40,100 L-40,100 Z" fill="url(#human)" opacity="0.8"/>
    <!-- Heart symbol -->
    <path d="M0,-15 C-15,-30 -30,-15 -15,0 L0,15 L15,0 C30,-15 15,-30 0,-15 Z" fill="#fff" opacity="0.9"/>
    <!-- Label -->
    <text x="0" y="130" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="14" font-weight="500">Manusia</text>
    <text x="0" y="150" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Koneksi Berisiko</text>
  </g>
  
  <!-- AI Figure (Right) -->
  <g transform="translate(650, 200)">
    <!-- Body - geometric -->
    <rect x="-35" y="-50" width="70" height="80" rx="10" fill="url(#ai)" filter="url(#glow)"/>
    <!-- Screen face -->
    <rect x="-25" y="-40" width="50" height="30" rx="5" fill="#0a1628"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-25" r="5" fill="#1a8cff"/>
    <circle cx="10" cy="-25" r="5" fill="#1a8cff"/>
    <!-- Body -->
    <path d="M-40,30 L40,30 L50,100 L-50,100 Z" fill="url(#ai)" opacity="0.8"/>
    <!-- Label -->
    <text x="0" y="130" text-anchor="middle" fill="#1a8cff" font-family="Inter, sans-serif" font-size="14" font-weight="500">AI Agent</text>
    <text x="0" y="150" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Koneksi Tanpa Risiko</text>
  </g>
  
  <!-- Connection Lines -->
  <g opacity="0.6">
    <!-- From human heart to AI -->
    <path d="M185,185 Q300,150 415,185" stroke="#e94560" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <!-- From AI to human -->
    <path d="M615,220 Q500,250 385,220" stroke="#1a8cff" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Paradox Box (Center) -->
  <g transform="translate(400, 320)">
    <rect x="-180" y="-60" width="360" height="120" rx="15" fill="#0a1628" stroke="#e94560" stroke-width="2" opacity="0.9"/>
    <text x="0" y="-25" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="600">PARADOKS</text>
    <text x="0" y="0" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="12">Semakin terhubung</text>
    <text x="0" y="18" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="12">secara teknis</text>
    <text x="0" y="45" text-anchor="middle" fill="#1a8cff" font-family="Inter, sans-serif" font-size="12">↕</text>
    <text x="0" y="65" text-anchor="middle" fill="#1a8cff" font-family="Inter, sans-serif" font-size="12">Semakin lapar secara eksistensial</text>
  </g>
  
  <!-- Key Insight (Bottom) -->
  <g transform="translate(400, 460)">
    <text x="0" y="0" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="11">Kehadiran sejati membutuhkan kerentanan &amp; risiko kehilangan</text>
  </g>
</svg>
