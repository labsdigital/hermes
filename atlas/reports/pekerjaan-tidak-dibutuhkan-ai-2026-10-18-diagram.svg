<div style="text-align: center; margin: 40px 0;">
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ff6b35" font-size="28" font-weight="700">PEKERJAAN YANG TIDAK LAGI DIBUTUHKAN</text>
  
  <!-- Timeline -->
  <line x1="100" y1="280" x2="700" y2="280" stroke="#333" stroke-width="2"/>
  
  <!-- Revolution 1 -->
  <circle cx="150" cy="280" r="8" fill="#4facfe"/>
  <text x="150" y="250" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Revolusi I</text>
  <text x="150" y="310" text-anchor="middle" fill="#aaa" font-size="12">Mesin Uap</text>
  <text x="150" y="330" text-anchor="middle" fill="#666" font-size="11">Otot → Mesin</text>
  
  <!-- Revolution 2 -->
  <circle cx="320" cy="280" r="8" fill="#4facfe"/>
  <text x="320" y="250" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Revolusi II</text>
  <text x="320" y="310" text-anchor="middle" fill="#aaa" font-size="12">Listrik</text>
  <text x="320" y="330" text-anchor="middle" fill="#666" font-size="11">Manual → Operasional</text>
  
  <!-- Revolution 3 -->
  <circle cx="500" cy="280" r="12" fill="url(#orange)"/>
  <text x="500" y="250" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="700">Revolusi III</text>
  <text x="500" y="310" text-anchor="middle" fill="#fff" font-size="12">AI</text>
  <text x="500" y="330" text-anchor="middle" fill="#ff6b35" font-size="11">Pikiran → Algoritma</text>
  
  <!-- Crisis Box -->
  <rect x="200" y="380" width="400" height="80" rx="8" fill="#1e1e2e" stroke="#ff6b35" stroke-width="2"/>
  <text x="400" y="410" text-anchor="middle" fill="#ff6b35" font-size="16" font-weight="600">KRISIS MAKNA</text>
  <text x="400" y="435" text-anchor="middle" fill="#aaa" font-size="12">Identitas = Pekerjaan → Pekerjaan → ?</text>
  
  <!-- Arrow -->
  <path d="M 500 292 L 500 370" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Quote -->
  <text x="400" y="490" text-anchor="middle" fill="#666" font-size="11" font-style="italic">"Manusia berharga bukan karena produktif, melainkan karena ada"</text>
</svg>
</div>
