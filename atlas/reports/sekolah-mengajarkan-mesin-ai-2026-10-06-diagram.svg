<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="1">Sekolah yang Mengajarkan Mesin</text>
  <text x="400" y="78" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="500">AI sebagai Guru Kedua dalam Pendidikan Modern</text>
  
  <!-- Central icon: School building -->
  <g transform="translate(400, 200)" filter="url(#glow)">
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="none" stroke="url(#orange)" stroke-width="2"/>
    <polygon points="-70,-40 0,-70 70,-40" fill="none" stroke="url(#orange)" stroke-width="2"/>
    <rect x="-20" y="10" width="40" height="30" rx="4" fill="url(#orange)" opacity="0.3"/>
    <text x="0" y="30" text-anchor="middle" fill="#ff6b35" font-size="12" font-weight="600">GURU</text>
  </g>
  
  <!-- AI icon -->
  <g transform="translate(650, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#blue)" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="url(#blue)" opacity="0.2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#4facfe" font-size="20">🤖</text>
    <text x="0" y="25" text-anchor="middle" fill="#4facfe" font-size="11" font-weight="600">AI</text>
  </g>
  
  <!-- Student icon -->
  <g transform="translate(150, 200)" filter="url(#glow)">
    <circle cx="0" cy="-15" r="20" fill="none" stroke="#a8edea" stroke-width="2"/>
    <path d="M-25,15 Q0,40 25,15" fill="none" stroke="#a8edea" stroke-width="2"/>
    <text x="0" y="55" text-anchor="middle" fill="#a8edea" font-size="11" font-weight="600">MURID</text>
  </g>
  
  <!-- Connecting arrows -->
  <line x1="220" y1="200" x2="330" y2="200" stroke="#a8edea" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="470" y1="200" x2="600" y2="200" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="270" y1="170" x2="530" y2="170" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <!-- Key concepts boxes -->
  <g transform="translate(100, 350)">
    <rect width="160" height="70" rx="8" fill="rgba(255,107,53,0.1)" stroke="url(#orange)" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" fill="#ff6b35" font-size="12" font-weight="600">Tradisi Guru</text>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">Hubungan personal</text>
    <text x="80" y="60" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">Transformasi diri</text>
  </g>
  
  <g transform="translate(320, 350)">
    <rect width="160" height="70" rx="8" fill="rgba(79,172,254,0.1)" stroke="url(#blue)" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" fill="#4facfe" font-size="12" font-weight="600">AI Tutor</text>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">Personalisasi masal</text>
    <text x="80" y="60" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">Efisiensi belajar</text>
  </g>
  
  <g transform="translate(540, 350)">
    <rect width="160" height="70" rx="8" fill="rgba(168,237,234,0.1)" stroke="#a8edea" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" fill="#a8edea" font-size="12" font-weight="600">Yang Hilang?</text>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">Kerinduan</text>
    <text x="80" y="60" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.8">Ketidakefisienan bermakna</text>
  </g>
  
  <!-- Bottom quote -->
  <text x="400" y="520" text-anchor="middle" fill="#ffffff" font-size="13" font-style="italic" opacity="0.9">"AI bisa menulis puisi yang lebih baik.</text>
  <text x="400" y="540" text-anchor="middle" fill="#ffffff" font-size="13" font-style="italic" opacity="0.9">Tapi AI tidak punya kerinduan."</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#ff6b35" opacity="0.5"/>
  <circle cx="750" cy="80" r="2" fill="#4facfe" opacity="0.5"/>
  <circle cx="700" cy="550" r="4" fill="#a8edea" opacity="0.3"/>
  <circle cx="80" cy="520" r="2" fill="#ff6b35" opacity="0.4"/>
</svg>
