<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="machine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Tangan yang Tak Pernah Lelah</text>
  <text x="400" y="65" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">Revolusi Pekerjaan di Era Mesin Cerdas</text>
  
  <!-- Timeline axis -->
  <line x1="80" y1="520" x2="720" y2="520" stroke="#475569" stroke-width="2"/>
  
  <!-- Era markers -->
  <g transform="translate(120, 520)">
    <circle r="6" fill="#f97316"/>
    <text x="0" y="25" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Revolusi</text>
    <text x="0" y="38" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Industri</text>
  </g>
  
  <g transform="translate(280, 520)">
    <circle r="6" fill="#f97316"/>
    <text x="0" y="25" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Era</text>
    <text x="0" y="38" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Digital</text>
  </g>
  
  <g transform="translate(440, 520)">
    <circle r="6" fill="#3b82f6"/>
    <text x="0" y="25" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">AI</text>
    <text x="0" y="38" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Klasik</text>
  </g>
  
  <g transform="translate(600, 520)">
    <circle r="8" fill="#ef4444" filter="url(#glow)"/>
    <text x="0" y="25" text-anchor="middle" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Era AI</text>
    <text x="0" y="38" text-anchor="middle" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Generatif</text>
  </g>
  
  <!-- Human worker figure (left) -->
  <g transform="translate(150, 280)">
    <!-- Body -->
    <rect x="-25" y="0" width="50" height="120" rx="8" fill="url(#human)" opacity="0.9"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="22" fill="url(#human)"/>
    <!-- Arms -->
    <rect x="-45" y="20" width="20" height="70" rx="5" fill="url(#human)" opacity="0.7"/>
    <rect x="25" y="20" width="20" height="70" rx="5" fill="url(#human)" opacity="0.7"/>
    <!-- Sweat drops -->
    <circle cx="-35" cy="15" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="35" cy="25" r="2" fill="#fbbf24" opacity="0.6"/>
    <circle cx="-30" cy="35" r="2.5" fill="#fbbf24" opacity="0.7"/>
    <!-- Label -->
    <text x="0" y="145" text-anchor="middle" fill="#f97316" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Manusia</text>
    <text x="0" y="160" text-anchor="middle" fill="#fb923c" font-family="Inter, system-ui, sans-serif" font-size="10">Lelah • Butuh Gaji • Batas Waktu</text>
  </g>
  
  <!-- AI Machine figure (right) -->
  <g transform="translate(650, 280)">
    <!-- Body - sleek design -->
    <rect x="-35" y="0" width="70" height="130" rx="12" fill="url(#machine)" opacity="0.9"/>
    <!-- Head - screen face -->
    <rect x="-28" y="-35" width="56" height="40" rx="8" fill="#1e3a5f"/>
    <!-- Eyes (screens) -->
    <rect x="-18" y="-25" width="14" height="10" rx="2" fill="#60a5fa"/>
    <rect x="4" y="-25" width="14" height="10" rx="2" fill="#60a5fa"/>
    <!-- Mouth line -->
    <line x1="-10" y1="-8" x2="10" y2="-8" stroke="#60a5fa" stroke-width="2"/>
    <!-- Arms - robotic -->
    <rect x="-55" y="25" width="20" height="80" rx="4" fill="url(#machine)" opacity="0.8"/>
    <rect x="35" y="25" width="20" height="80" rx="4" fill="url(#machine)" opacity="0.8"/>
    <!-- Glow effect -->
    <circle cx="0" cy="65" r="15" fill="#3b82f6" opacity="0.3"/>
    <circle cx="0" cy="65" r="8" fill="#3b82f6" opacity="0.5"/>
    <!-- Label -->
    <text x="0" y="145" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Mesin AI</text>
    <text x="0" y="160" text-anchor="middle" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="10">Tanpa Lelah • Gratis • 24/7</text>
  </g>
  
  <!-- Connecting arrow showing transition -->
  <g transform="translate(400, 200)">
    <path d="M -120 0 Q 0 -40 120 0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8,4"/>
    <polygon points="120,-8 130,0 120,8" fill="#64748b"/>
    <text x="0" y="-50" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Transisi Pekerja an</text>
  </g>
  
  <!-- Impact indicators -->
  <g transform="translate(400, 420)">
    <rect x="-180" y="-30" width="140" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="-110" y="-10" text-anchor="middle" fill="#f97316" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Pekerjaan Fisik</text>
    <text x="-110" y="8" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9">✓ Terotomasi</text>
    
    <rect x="-30" y="-30" width="140" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="40" y="-10" text-anchor="middle" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Pekerjaan Kognitif</text>
    <text x="40" y="8" text-anchor="middle" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="9">⚠ Dalam Ancaman</text>
    
    <rect x="110" y="-30" width="140" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="180" y="-10" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Pekerjaan Kreatif</text>
    <text x="180" y="8" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9">? Belum Tentu</text>
  </g>
  
  <!-- Bottom quote -->
  <text x="400" y="570" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10" font-style="italic">"Apa yang akan dilakukan manusia ketika tidak perlu lagi bekerja?"</text>
</svg>