<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a5276"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Mata Tanpa Kelopak</text>
  <text x="400" y="75" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="14">Privasi di Era AI</text>
  
  <!-- Central eye graphic -->
  <ellipse cx="400" cy="200" rx="150" ry="80" fill="#0d1b2a" stroke="#e94560" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="200" r="35" fill="url(#eyeGrad)"/>
  <circle cx="400" cy="200" r="15" fill="#1a1a2e"/>
  
  <!-- Data streams flowing into eye -->
  <path d="M 120 160 Q 280 180 350 190" stroke="#1a5276" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 120 200 Q 280 200 350 200" stroke="#1a5276" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 120 240 Q 280 220 350 210" stroke="#1a5276" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 680 160 Q 520 180 450 190" stroke="#1a5276" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 680 200 Q 520 200 450 200" stroke="#1a5276" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 680 240 Q 520 220 450 210" stroke="#1a5276" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Data sources -->
  <rect x="40" y="140" width="100" height="40" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="90" y="158" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Media</text>
  <text x="90" y="173" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">Sosial</text>
  
  <rect x="40" y="190" width="100" height="40" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="90" y="208" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Lokasi</text>
  <text x="90" y="223" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">GPS</text>
  
  <rect x="40" y="240" width="100" height="40" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="90" y="258" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Transaksi</text>
  <text x="90" y="273" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">Keuangan</text>
  
  <rect x="660" y="140" width="100" height="40" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="710" y="158" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Pesan</text>
  <text x="710" y="173" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">Chat</text>
  
  <rect x="660" y="190" width="100" height="40" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="710" y="208" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Pencarian</text>
  <text x="710" y="223" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">Web</text>
  
  <rect x="660" y="240" width="100" height="40" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="710" y="258" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Biometric</text>
  <text x="710" y="273" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">Data</text>
  
  <!-- Bottom section: Key stats -->
  <text x="400" y="350" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="13">Fakta Kunci:</text>
  
  <!-- Stats boxes -->
  <rect x="60" y="370" width="190" height="70" rx="6" fill="#0d1b2a" stroke="#e94560" stroke-width="1"/>
  <text x="155" y="395" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="20" font-weight="bold">1,000+</text>
  <text x="155" y="415" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Profil Data Rata-rata</text>
  <text x="155" y="430" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">per orang di broker database</text>
  
  <rect x="305" y="370" width="190" height="70" rx="6" fill="#0d1b2a" stroke="#7e57c2" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" fill="#7e57c2" font-family="Inter, sans-serif" font-size="20" font-weight="bold">97.35%</text>
  <text x="400" y="415" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Akurasi Pengenalan Wajah</text>
  <text x="400" y="430" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">Facebook DeepFace (2014)</text>
  
  <rect x="550" y="370" width="190" height="70" rx="6" fill="#0d1b2a" stroke="#1a5276" stroke-width="1"/>
  <text x="645" y="395" text-anchor="middle" fill="#1a5276" font-family="Inter, sans-serif" font-size="20" font-weight="bold">4 Koordinat</text>
  <text x="645" y="415" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Untuk Identifikasi 90%</text>
  <text x="645" y="430" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="9">Lokasi calendar dapat mengidentifikasi</text>
  
  <!-- Annotation -->
  <text x="400" y="480" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="11" font-style="italic">Privasi bukan tentang menyembunyikan yang salah — tapi tentang hak untuk mengendalikan diri</text>
</svg>