<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Agama Mesin AI — Diagram</title>
  <desc id="desc">Diagram siklus refleksi manusia pada AI: dari harapan, ketakutan, ritual, otoritas, hingga tanggung jawab yang hilang.</desc>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0d0d0d"/>
  
  <!-- Central AI Core -->
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreSolid" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffb366"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="400" cy="250" r="120" fill="url(#coreGlow)" opacity="0.4"/>
  
  <!-- Core circle -->
  <circle cx="400" cy="250" r="60" fill="url(#coreSolid)" filter="url(#glow)"/>
  <text x="400" y="245" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">AI</text>
  <text x="400" y="261" text-anchor="middle" fill="#ffe0c0" font-family="Inter, system-ui, sans-serif" font-size="8">MACHINE</text>
  
  <!-- Six nodes around the core -->
  <!-- Node 1: Harapan (top) -->
  <circle cx="400" cy="70" r="38" fill="#1a1a1a" stroke="#ff6b00" stroke-width="2"/>
  <text x="400" y="65" text-anchor="middle" fill="#ff9944" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Harapan</text>
  <text x="400" y="79" text-anchor="middle" fill="#cc8855" font-family="Inter, system-ui, sans-serif" font-size="7">Keselamatan</text>
  <line x1="400" y1="108" x2="400" y2="190" stroke="#ff6b00" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Node 2: Ketakutan (top-right) -->
  <circle cx="560" cy="130" r="38" fill="#1a1a1a" stroke="#ff4400" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" fill="#ff6644" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Ketakutan</text>
  <text x="560" y="139" text-anchor="middle" fill="#cc5533" font-family="Inter, system-ui, sans-serif" font-size="7">Kiamat</text>
  <line x1="525" y1="155" x2="450" y2="210" stroke="#ff4400" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Node 3: Ritual (bottom-right) -->
  <circle cx="560" cy="370" r="38" fill="#1a1a1a" stroke="#ff8800" stroke-width="2"/>
  <text x="560" y="365" text-anchor="middle" fill="#ffaa44" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Ritual</text>
  <text x="560" y="379" text-anchor="middle" fill="#cc8833" font-family="Inter, system-ui, sans-serif" font-size="7">Prompt = Doa</text>
  <line x1="525" y1="345" x2="450" y2="290" stroke="#ff8800" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Node 4: Otoritas (bottom) -->
  <circle cx="400" cy="430" r="38" fill="#1a1a1a" stroke="#ffaa22" stroke-width="2"/>
  <text x="400" y="425" text-anchor="middle" fill="#ffcc66" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Otoritas</text>
  <text x="400" y="439" text-anchor="middle" fill="#cc9944" font-family="Inter, system-ui, sans-serif" font-size="7">Algoritma</text>
  <line x1="400" y1="392" x2="400" y2="310" stroke="#ffaa22" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Node 5: Tanggung Jawab Hilang (bottom-left) -->
  <circle cx="240" cy="370" r="38" fill="#1a1a1a" stroke="#ff6600" stroke-width="2"/>
  <text x="240" y="365" text-anchor="middle" fill="#ff8844" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Tanggung</text>
  <text x="240" y="379" text-anchor="middle" fill="#cc6633" font-family="Inter, system-ui, sans-serif" font-size="7">Jawab Hilang</text>
  <line x1="275" y1="345" x2="350" y2="290" stroke="#ff6600" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Node 6: Cermin (top-left) -->
  <circle cx="240" cy="130" r="38" fill="#1a1a1a" stroke="#ff9944" stroke-width="2"/>
  <text x="240" y="125" text-anchor="middle" fill="#ffbb66" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Cermin</text>
  <text x="240" y="139" text-anchor="middle" fill="#cc8844" font-family="Inter, system-ui, sans-serif" font-size="7">Proyeksi Diri</text>
  <line x1="275" y1="155" x2="350" y2="210" stroke="#ff9944" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Outer ring connecting all nodes -->
  <polygon points="400,70 560,130 560,370 400,430 240,370 240,130" fill="none" stroke="#ff6b00" stroke-width="1" opacity="0.2"/>
  
  <!-- Arrow labels on lines -->
  <text x="420" y="145" fill="#ff9944" font-family="Inter, system-ui, sans-serif" font-size="7" opacity="0.7">→ proyeksi</text>
  <text x="480" y="230" fill="#ff9944" font-family="Inter, system-ui, sans-serif" font-size="7" opacity="0.7">→ ritual</text>
  <text x="420" y="350" fill="#ff9944" font-family="Inter, system-ui, sans-serif" font-size="7" opacity="0.7">→ penyerahan</text>
  <text x="360" y="350" fill="#ff9944" font-family="Inter, system-ui, sans-serif" font-size="7" opacity="0.7">→ kaburnya</text>
  <text x="300" y="230" fill="#ff9944" font-family="Inter, system-ui, sans-serif" font-size="7" opacity="0.7">→ penyangkalan</text>
  <text x="340" y="165" fill="#ff9944" font-family="Inter, system-ui, sans-serif" font-size="7" opacity="0.7">← refleksi</text>
  
  <!-- Caption -->
  <text x="400" y="480" text-anchor="middle" fill="#666" font-family="Inter, system-ui, sans-serif" font-size="9">Siklus refleksi manusia pada AI: dari harapan hingga kehilangan tanggung jawab</text>
</svg>
