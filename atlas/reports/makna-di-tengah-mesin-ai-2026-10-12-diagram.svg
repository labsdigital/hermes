<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="machineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="20" font-weight="bold" letter-spacing="2">MAKNA DI ZAMAN MESIN</text>
  
  <!-- Three Pillars -->
  <!-- Work/Pillar 1 -->
  <rect x="100" y="120" width="160" height="200" rx="8" fill="none" stroke="#e94560" stroke-width="2" opacity="0.8"/>
  <circle cx="180" cy="160" r="30" fill="url(#humanGrad)" opacity="0.9"/>
  <text x="180" y="168" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Kerja</text>
  <text x="180" y="220" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Kontribusi</text>
  <text x="180" y="240" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Pencapaian</text>
  <text x="180" y="260" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Produktivitas</text>
  
  <!-- Machine takeover arrow -->
  <path d="M 260 220 Q 300 200 340 220" fill="none" stroke="#e94560" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6"/>
  <text x="300" y="195" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="10" opacity="0.7">diganti</text>
  
  <!-- Relationships/Pillar 2 -->
  <rect x="320" y="120" width="160" height="200" rx="8" fill="none" stroke="#e94560" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="160" r="30" fill="url(#humanGrad)" opacity="0.9"/>
  <text x="400" y="168" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Hubungan</text>
  <text x="400" y="220" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Cinta</text>
  <text x="400" y="240" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Kebersamaan</text>
  <text x="400" y="260" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Empati</text>
  
  <!-- Transcendence/Pillar 3 -->
  <rect x="540" y="120" width="160" height="200" rx="8" fill="none" stroke="#e94560" stroke-width="2" opacity="0.8"/>
  <circle cx="620" cy="160" r="30" fill="url(#humanGrad)" opacity="0.9"/>
  <text x="620" y="168" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Transenden</text>
  <text x="620" y="220" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Agama</text>
  <text x="620" y="240" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Filsafat</text>
  <text x="620" y="260" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="11">Seni</text>
  
  <!-- Machine silhouette -->
  <rect x="280" y="350" width="240" height="120" rx="12" fill="url(#machineGrad)" opacity="0.9"/>
  <rect x="310" y="370" width="180" height="80" rx="6" fill="#0f3460"/>
  <circle cx="360" cy="410" r="15" fill="#e94560" opacity="0.8"/>
  <circle cx="440" cy="410" r="15" fill="#e94560" opacity="0.8"/>
  <line x1="375" y1="410" x2="425" y2="410" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <text x="400" y="455" text-anchor="middle" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="12">MESIN: Jawaban Tanpa Pertanyaan</text>
  
  <!-- Connection lines from pillars to machine -->
  <line x1="180" y1="320" x2="330" y2="350" stroke="#e94560" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="320" x2="400" y2="350" stroke="#e94560" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="620" y1="320" x2="470" y2="350" stroke="#e94560" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Question mark -->
  <text x="400" y="500" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="16" font-weight="bold" opacity="0.9">"Apa yang membuat kita tetap ingin melakukan sesuatu?"</text>
</svg>