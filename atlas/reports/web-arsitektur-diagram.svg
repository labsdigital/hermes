<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#64ffda" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold">Web Arsitektur Pasca-AI</text>
  <text x="400" y="65" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="14">Agent Interaction Layer dalam Stack Web Modern</text>
  
  <!-- Layer Stack -->
  <!-- Agent Applications Layer -->
  <rect x="150" y="90" width="500" height="60" rx="8" fill="rgba(102,126,234,0.3)" stroke="#667eea" stroke-width="2" filter="url(#glow)"/>
  <text x="170" y="115" fill="#667eea" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Agent Applications</text>
  <text x="170" y="135" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="12">Claude, ChatGPT, Autonomous Agents</text>
  
  <!-- Agent Interaction Layer (NEW) -->
  <rect x="150" y="165" width="500" height="80" rx="8" fill="rgba(255,215,0,0.2)" stroke="#ffd700" stroke-width="3" filter="url(#glow)"/>
  <text x="170" y="195" fill="#ffd700" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Agent Interaction Layer ✨ NEW</text>
  <text x="170" y="215" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="12">MCP • Agent Protocols • Machine-Readable APIs</text>
  <text x="170" y="235" fill="#ffd700" font-family="Segoe UI, sans-serif" font-size="11">↓ Browser as Agent Platform ↓</text>
  
  <!-- Traditional Layers -->
  <rect x="150" y="260" width="500" height="50" rx="8" fill="rgba(100,255,218,0.1)" stroke="#64ffda" stroke-width="1"/>
  <text x="170" y="290" fill="#64ffda" font-family="Segoe UI, sans-serif" font-size="13">Presentation (HTML/CSS/JS)</text>
  
  <rect x="150" y="320" width="500" height="50" rx="8" fill="rgba(100,255,218,0.1)" stroke="#64ffda" stroke-width="1"/>
  <text x="170" y="350" fill="#64ffda" font-family="Segoe UI, sans-serif" font-size="13">Application (Web Apps)</text>
  
  <rect x="150" y="380" width="500" height="50" rx="8" fill="rgba(100,255,218,0.1)" stroke="#64ffda" stroke-width="1"/>
  <text x="170" y="410" fill="#64ffda" font-family="Segoe UI, sans-serif" font-size="13">Data & Infrastructure</text>
  
  <!-- Connection Arrows -->
  <path d="M 400 150 L 400 165" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 245 L 400 260" stroke="#64ffda" stroke-width="1"/>
  <path d="M 400 310 L 400 320" stroke="#64ffda" stroke-width="1"/>
  <path d="M 400 370 L 400 380" stroke="#64ffda" stroke-width="1"/>
  
  <!-- Key Concepts Box -->
  <rect x="50" y="440" width="700" height="45" rx="5" fill="rgba(233,69,96,0.1)" stroke="#e94560" stroke-width="1"/>
  <text x="70" y="468" fill="#e94560" font-family="Segoe UI, sans-serif" font-size="12">Key: MCP = USB-C for AI | Moltbook = Social Network for Agents | AEO = Agent Engine Optimization</text>
</svg>
