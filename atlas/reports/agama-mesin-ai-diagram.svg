<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600" letter-spacing="2">TIGA LAPISAN INTERAKSI SPIRITUAL</text>
  <text x="400" y="65" text-anchor="middle" fill="#8892b0" font-size="12" letter-spacing="1">Manusia × Mesin × Yang Transenden</text>
  
  <!-- Layer 1: Ritual (Outer) -->
  <circle cx="400" cy="280" r="200" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.6"/>
  <text x="400" y="90" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="500">RITUAL</text>
  <text x="400" y="108" text-anchor="middle" fill="#8892b0" font-size="10">Diprogram &amp; Dijadwalkan</text>
  
  <!-- Layer 2: Reflection (Middle) -->
  <circle cx="400" cy="280" r="140" fill="none" stroke="#4fbdba" stroke-width="2" opacity="0.7"/>
  <text x="400" y="150" text-anchor="middle" fill="#4fbdba" font-size="14" font-weight="500">REFLEKSI</text>
  <text x="400" y="165" text-anchor="middle" fill="#8892b0" font-size="10">Personal &amp; Adaptif</text>
  
  <!-- Layer 3: Mystery (Inner) -->
  <circle cx="400" cy="280" r="80" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
  <text x="400" y="275" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="600">MISTERI</text>
  <text x="400" y="292" text-anchor="middle" fill="#8892b0" font-size="9">Tidak Bisa Dihitung</text>
  
  <!-- Center icon - eye/human -->
  <circle cx="400" cy="280" r="35" fill="#ff6b35" opacity="0.15"/>
  <circle cx="400" cy="280" r="15" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <circle cx="400" cy="280" r="5" fill="#ff6b35"/>
  
  <!-- Connecting lines -->
  <line x1="400" y1="80" x2="400" y2="245" stroke="#ff6b35" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="140" x2="400" y2="200" stroke="#4fbdba" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Labels on sides -->
  <text x="620" y="200" fill="#8892b0" font-size="11">↗ Komodifikasi</text>
  <text x="620" y="220" fill="#8892b0" font-size="11">↗ Personalisasi</text>
  <text x="620" y="240" fill="#8892b0" font-size="11">↗ Keimanan</text>
  
  <!-- Bottom note -->
  <text x="400" y="470" text-anchor="middle" fill="#5a6070" font-size="10" font-style="italic">Semakin dalam lapisan, semakin tidak bisa diotomasi</text>
</svg>
