<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="node1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="node2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
    <linearGradient id="node3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#ffffff" font-weight="600" letter-spacing="1">PIRAMIDA PENDIDIKAN GENERASI BARU</text>
  <line x1="200" y1="55" x2="600" y2="55" stroke="#333355" stroke-width="1"/>
  
  <!-- Level 1: Knowledge Access (widest) -->
  <rect x="80" y="380" width="640" height="80" rx="8" fill="url(#node2)" opacity="0.2" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="400" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#00d4ff" font-weight="600">AKSES PENGETAHUAN</text>
  <text x="400" y="432" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#88aacc"> infinite · free · always available</text>
  
  <!-- Level 2: Thinking Skills -->
  <rect x="160" y="280" width="480" height="80" rx="8" fill="url(#node3)" opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="310" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#a855f7" font-weight="600">KETERAMPILAN BERPIKIR</text>
  <text x="400" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#bb88dd"> analyze · question · create</text>
  
  <!-- Level 3: Wisdom & Meaning (narrowest) -->
  <rect x="280" y="180" width="240" height="80" rx="8" fill="url(#node1)" opacity="0.2" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="400" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ff6b35" font-weight="600">KEBIJAKSANAAN</text>
  <text x="400" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#eeaa77"> choose · feel · become</text>
  
  <!-- Connecting arrows -->
  <line x1="400" y1="380" x2="400" y2="360" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="400" y1="280" x2="400" y2="260" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="400" y1="180" x2="400" y2="160" stroke="#ff6b35" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  
  <!-- Side notes -->
  <rect x="30" y="180" width="35" height="280" rx="4" fill="#1a1a2e" stroke="#333355" stroke-width="1"/>
  <text x="47" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#666" transform="rotate(-90, 47, 210)">SCALE OF VALUE</text>
  
  <!-- Legend -->
  <circle cx="120" cy="475" r="5" fill="#00d4ff"/>
  <text x="135" y="478" font-family="Inter, sans-serif" font-size="10" fill="#888">AI-accessible</text>
  <circle cx="240" cy="475" r="5" fill="#a855f7"/>
  <text x="255" y="478" font-family="Inter, sans-serif" font-size="10" fill="#888">Human-AI collaboration</text>
  <circle cx="400" cy="475" r="5" fill="#ff6b35"/>
  <text x="415" y="478" font-family="Inter, sans-serif" font-size="10" fill="#888">Purely human</text>
</svg>
</div>
