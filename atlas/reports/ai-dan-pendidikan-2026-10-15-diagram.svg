<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); font-family: Inter, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Guru yang Tak Pernah Tidur</text>
  <text x="400" y="80" text-anchor="middle" fill="#e94560" font-size="16">AI &amp; Pendidikan di Era Digital</text>
  
  <!-- AI Circle -->
  <circle cx="200" cy="220" r="100" fill="url(#grad1)" opacity="0.9"/>
  <text x="200" y="210" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">AI</text>
  <text x="200" y="235" text-anchor="middle" fill="#ffffff" font-size="14">Tutor Personal</text>
  <text x="200" y="255" text-anchor="middle" fill="#ffffff" font-size="14">24/7</text>
  <text x="200" y="290" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.8">✓ Respons Instan</text>
  <text x="200" y="310" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.8">✓ Materi Lengkap</text>
  <text x="200" y="330" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.8">✗ Tidak Ada Empati</text>
  
  <!-- Teacher Circle -->
  <circle cx="600" cy="220" r="100" fill="url(#grad2)" stroke="#e94560" stroke-width="3"/>
  <text x="600" y="210" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">Guru</text>
  <text x="600" y="235" text-anchor="middle" fill="#ffffff" font-size="14">Pembimbing</text>
  <text x="600" y="255" text-anchor="middle" fill="#ffffff" font-size="14">Manusiah</text>
  <text x="600" y="290" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.8">✓ Memahami Emosi</text>
  <text x="600" y="310" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.8">✓ Inspirasi</text>
  <text x="600" y="330" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.8">✗ Terbatas Waktu</text>
  
  <!-- Student at Bottom -->
  <circle cx="400" cy="420" r="60" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Siswa</text>
  <text x="400" y="435" text-anchor="middle" fill="#ffffff" font-size="12">di Tengah</text>
  
  <!-- Arrows -->
  <path d="M 280 200 Q 340 180 380 200" stroke="#e94560" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 520 200 Q 460 180 420 200" stroke="#0f3460" stroke-width="2" fill="none"/>
  <path d="M 220 300 Q 310 380 380 380" stroke="#e94560" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 580 300 Q 490 380 420 380" stroke="#0f3460" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
  </defs>
  
  <!-- Caption -->
  <text x="400" y="480" text-anchor="middle" fill="#888888" font-size="14">AI &amp; Guru: Simbiosis, Bukan Persaingan</text>
</svg>
