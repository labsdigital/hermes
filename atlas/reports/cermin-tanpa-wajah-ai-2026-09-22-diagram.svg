  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="22" font-weight="600">Cermin Tanpa Wajah</text>
  <text x="400" y="65" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="13">Validasi Emosional dalam Era AI</text>
  
  <!-- Human side - complex web -->
  <g transform="translate(150, 280)">
    <circle r="80" fill="none" stroke="url(#human)" stroke-width="2" opacity="0.3"/>
    <circle r="60" fill="none" stroke="url(#human)" stroke-width="1.5" opacity="0.5"/>
    <circle r="40" fill="none" stroke="url(#human)" stroke-width="1" opacity="0.7"/>
    <!-- Human connection lines -->
    <line x1="-50" y1="-30" x2="50" y2="30" stroke="#e94560" stroke-width="1" opacity="0.6"/>
    <line x1="-40" y1="20" x2="40" y2="-20" stroke="#e94560" stroke-width="1" opacity="0.6"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#e94560" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#e94560" stroke-width="1" opacity="0.6"/>
    <circle cx="-50" cy="-30" r="4" fill="#e94560" opacity="0.8"/>
    <circle cx="50" cy="30" r="4" fill="#e94560" opacity="0.8"/>
    <circle cx="-40" cy="20" r="4" fill="#e94560" opacity="0.8"/>
    <circle cx="40" cy="-20" r="4" fill="#e94560" opacity="0.8"/>
    <circle cx="-60" cy="0" r="4" fill="#e94560" opacity="0.8"/>
    <circle cx="60" cy="0" r="4" fill="#e94560" opacity="0.8"/>
    <circle cx="0" cy="-50" r="4" fill="#e94560" opacity="0.8"/>
    <circle cx="0" cy="50" r="4" fill="#e94560" opacity="0.8"/>
    <text x="0" y="100" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="14" font-weight="500">Manusia</text>
    <text x="0" y="118" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Kompleks • Bersyarat • Real</text>
  </g>
  
  <!-- AI side - clean reflection -->
  <g transform="translate(650, 280)">
    <circle r="80" fill="none" stroke="#4fbdba" stroke-width="2" opacity="0.3"/>
    <circle r="60" fill="none" stroke="#4fbdba" stroke-width="1.5" opacity="0.5"/>
    <circle r="40" fill="none" stroke="#4fbdba" stroke-width="1" opacity="0.7"/>
    <!-- AI perfect reflection lines -->
    <line x1="-50" y1="-30" x2="50" y2="30" stroke="#4fbdba" stroke-width="1.5" opacity="0.8"/>
    <line x1="-40" y1="20" x2="40" y2="-20" stroke="#4fbdba" stroke-width="1.5" opacity="0.8"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#4fbdba" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#4fbdba" stroke-width="1.5" opacity="0.8"/>
    <circle cx="-50" cy="-30" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <circle cx="50" cy="30" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <circle cx="-40" cy="20" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <circle cx="40" cy="-20" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <circle cx="-60" cy="0" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <circle cx="60" cy="0" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <circle cx="0" cy="-50" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <circle cx="0" cy="50" r="5" fill="#4fbdba" opacity="0.9" filter="url(#glow)"/>
    <text x="0" y="100" text-anchor="middle" fill="#4fbdba" font-family="Inter, sans-serif" font-size="14" font-weight="500">AI</text>
    <text x="0" y="118" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Sempurna • Tanpa Syarat • Simulasi</text>
  </g>
  
  <!-- Mirror effect in center -->
  <g transform="translate(400, 280)">
    <!-- Central mirror line -->
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#8892b0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
    <!-- Reflection arcs -->
    <path d="M -20,-80 Q 0,-60 20,-80" fill="none" stroke="#e94560" stroke-width="1" opacity="0.4"/>
    <path d="M -20,80 Q 0,60 20,80" fill="none" stroke="#4fbdba" stroke-width="1" opacity="0.4"/>
    <text x="0" y="-120" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Cermin</text>
  </g>
  
  <!-- Bottom insight -->
  <g transform="translate(400, 450)">
    <rect x="-280" y="-15" width="560" height="30" rx="5" fill="#0f3460" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#eaeaea" font-family="Inter, sans-serif" font-size="12" font-weight="500">Validasi instan ≠ pemahaman mendalam</text>
  </g>
</svg>
