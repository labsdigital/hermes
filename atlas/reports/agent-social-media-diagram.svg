<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#667eea" font-size="32" font-family="Arial" font-weight="bold" filter="url(#glow)">
    Agent Social Media
  </text>
  <text x="400" y="80" text-anchor="middle" fill="#8892b0" font-size="16" font-family="Arial">
    Layer Baru Dunia Web
  </text>
  
  <!-- Network nodes -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="0" r="40" fill="#667eea" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="12" font-family="Arial">Agent</text>
    <text x="0" y="24" text-anchor="middle" fill="white" font-size="10" font-family="Arial">A1</text>
  </g>
  
  <g transform="translate(250, 120)">
    <circle cx="0" cy="0" r="35" fill="#f093fb" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="12" font-family="Arial">Agent</text>
    <text x="0" y="24" text-anchor="middle" fill="white" font-size="10" font-family="Arial">A2</text>
  </g>
  
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="45" fill="#64ffda" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="12" font-family="Arial">Agent</text>
    <text x="0" y="24" text-anchor="middle" fill="white" font-size="10" font-family="Arial">A3</text>
  </g>
  
  <g transform="translate(550, 130)">
    <circle cx="0" cy="0" r="35" fill="#ffd700" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="12" font-family="Arial">Agent</text>
    <text x="0" y="24" text-anchor="middle" fill="white" font-size="10" font-family="Arial">A4</text>
  </g>
  
  <g transform="translate(700, 170)">
    <circle cx="0" cy="0" r="40" fill="#e94560" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="12" font-family="Arial">Agent</text>
    <text x="0" y="24" text-anchor="middle" fill="white" font-size="10" font-family="Arial">A5</text>
  </g>
  
  <!-- Connection lines -->
  <line x1="140" y1="150" x2="215" y2="120" stroke="#667eea" stroke-width="2" opacity="0.5"/>
  <line x1="285" y1="120" x2="355" y2="180" stroke="#f093fb" stroke-width="2" opacity="0.5"/>
  <line x1="445" y1="180" x2="515" y2="130" stroke="#64ffda" stroke-width="2" opacity="0.5"/>
  <line x1="585" y1="130" x2="660" y2="170" stroke="#ffd700" stroke-width="2" opacity="0.5"/>
  <line x1="140" y1="150" x2="400" y2="180" stroke="#667eea" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="120" x2="550" y2="130" stroke="#f093fb" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="180" x2="700" y2="170" stroke="#64ffda" stroke-width="1" opacity="0.3"/>
  
  <!-- Features -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#2d3748"/>
    <text x="90" y="30" text-anchor="middle" fill="#667eea" font-size="14" font-family="Arial">Memory Persistence</text>
  </g>
  
  <g transform="translate(310, 280)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#2d3748"/>
    <text x="90" y="30" text-anchor="middle" fill="#667eea" font-size="14" font-family="Arial">Agent Protocols</text>
  </g>
  
  <g transform="translate(520, 280)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#2d3748"/>
    <text x="90" y="30" text-anchor="middle" fill="#667eea" font-size="14" font-family="Arial">Autonomous Choice</text>
  </g>
  
  <!-- Implications -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="250" height="70" rx="8" fill="#1a365d" opacity="0.8"/>
    <text x="125" y="25" text-anchor="middle" fill="#64ffda" font-size="14" font-family="Arial" font-weight="bold">Implications</text>
    <text x="125" y="50" text-anchor="middle" fill="#8892b0" font-size="11" font-family="Arial">Social • Economic • Ethical</text>
  </g>
  
  <g transform="translate(450, 360)">
    <rect x="0" y="0" width="250" height="70" rx="8" fill="#1a365d" opacity="0.8"/>
    <text x="125" y="25" text-anchor="middle" fill="#64ffda" font-size="14" font-family="Arial" font-weight="bold">Future of Web</text>
    <text x="125" y="50" text-anchor="middle" fill="#8892b0" font-size="11" font-family="Arial">Polyglot • Machine-Social</text>
  </g>
</svg>
