<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365"/>
      <stop offset="100%" style="stop-color:#fda085"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Pendidikan di Era AI</text>
  <text x="400" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#888899">Transformasi Peran Guru dan Pelajar</text>
  
  <!-- Central AI Node -->
  <circle cx="400" cy="250" r="60" fill="url(#blue)" opacity="0.9"/>
  <text x="400" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">AI</text>
  <text x="400" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#e0e0e0">Mesin Pengajar</text>
  
  <!-- Left: Traditional Knowledge -->
  <circle cx="150" cy="150" r="45" fill="#2a2a3e" stroke="#4facfe" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Pengetahuan</text>
  <text x="150" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#888899">Tradisional</text>
  
  <!-- Right: Meaning Making -->
  <circle cx="650" cy="150" r="45" fill="#2a2a3e" stroke="#f6d365" stroke-width="2"/>
  <text x="650" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Makna</text>
  <text x="650" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#888899">Manusiawi</text>
  
  <!-- Bottom: Human Connection -->
  <circle cx="400" cy="420" r="50" fill="#2a2a3e" stroke="#43e97b" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Koneksi</text>
  <text x="400" y="432" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#888899">Manusia</text>
  
  <!-- Connecting lines -->
  <line x1="195" y1="175" x2="345" y2="230" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="605" y1="175" x2="455" y2="230" stroke="#f6d365" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="400" y1="310" x2="400" y2="370" stroke="#43e97b" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Arrows -->
  <polygon points="340,225 350,235 345,220" fill="#4facfe" opacity="0.8"/>
  <polygon points="460,225 450,235 455,220" fill="#f6d365" opacity="0.8"/>
  <polygon points="400,375 395,365 405,365" fill="#43e97b" opacity="0.8"/>
  
  <!-- Legend -->
  <rect x="50" y="460" width="12" height="12" fill="#4facfe" opacity="0.8"/>
  <text x="70" y="471" font-family="Inter, sans-serif" font-size="11" fill="#888899">AI / Mesin</text>
  <rect x="200" y="460" width="12" height="12" fill="#f6d365" opacity="0.8"/>
  <text x="220" y="471" font-family="Inter, sans-serif" font-size="11" fill="#888899">Makna</text>
  <rect x="330" y="460" width="12" height="12" fill="#43e97b" opacity="0.8"/>
  <text x="350" y="471" font-family="Inter, sans-serif" font-size="11" fill="#888899">Koneksi Manusia</text>
</svg>
</div>
