<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="machine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#eee" font-family="Inter, sans-serif" font-size="22" font-weight="600">Transisi Nilai: Manusia dalam Era Mesin Bekerja</text>
  
  <!-- Left side - Human Work -->
  <rect x="50" y="80" width="280" height="380" rx="12" fill="#1a1a2e" stroke="#e94560" stroke-width="2" opacity="0.9"/>
  <text x="190" y="115" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="18" font-weight="600">PEKERJAAN MANUSIA</text>
  
  <!-- Human icons -->
  <circle cx="120" cy="170" r="25" fill="url(#human)" opacity="0.8"/>
  <text x="120" y="175" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">👤</text>
  
  <circle cx="190" cy="170" r="25" fill="url(#human)" opacity="0.8"/>
  <text x="190" y="175" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">👤</text>
  
  <circle cx="260" cy="170" r="25" fill="url(#human)" opacity="0.8"/>
  <text x="260" y="175" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12">👤</text>
  
  <!-- Labels -->
  <text x="190" y="230" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="13">Produktivitas = Harga Diri</text>
  <text x="190" y="260" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="12">Kerja → Penghasilan → Identitas</text>
  
  <!-- Arrow down -->
  <path d="M 190 280 L 190 320" stroke="#e94560" stroke-width="2" marker-end="url(#arrowred)"/>
  
  <!-- Bottom section -->
  <rect x="80" y="340" width="220" height="100" rx="8" fill="#16213e" stroke="#e94560" stroke-width="1" opacity="0.6"/>
  <text x="190" y="370" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="13" font-weight="500">Krisis Makna</text>
  <text x="190" y="395" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Jika mesin bekerja lebih baik,</text>
  <text x="190" y="412" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">apa nilai manusia?</text>
  
  <!-- Right side - Machine Work -->
  <rect x="470" y="80" width="280" height="380" rx="12" fill="#1a1a2e" stroke="#533483" stroke-width="2" opacity="0.9"/>
  <text x="610" y="115" text-anchor="middle" fill="#533483" font-family="Inter, sans-serif" font-size="18" font-weight="600">PEKERJAAN MESIN</text>
  
  <!-- Machine icons -->
  <rect x="530" y="150" width="50" height="50" rx="8" fill="url(#machine)" stroke="#533483" stroke-width="2"/>
  <text x="555" y="180" text-anchor="middle" fill="#533483" font-family="Inter, sans-serif" font-size="20">🤖</text>
  
  <rect x="595" y="150" width="50" height="50" rx="8" fill="url(#machine)" stroke="#533483" stroke-width="2"/>
  <text x="620" y="180" text-anchor="middle" fill="#533483" font-family="Inter, sans-serif" font-size="20">⚙️</text>
  
  <rect x="660" y="150" width="50" height="50" rx="8" fill="url(#machine)" stroke="#533483" stroke-width="2"/>
  <text x="685" y="180" text-anchor="middle" fill="#533483" font-family="Inter, sans-serif" font-size="20">🧠</text>
  
  <!-- Labels -->
  <text x="610" y="230" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="13">Tanpa Kompensasi</text>
  <text x="610" y="260" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="12">Cepat · Akurat · Konsisten</text>
  
  <!-- Arrow down -->
  <path d="M 610 280 L 610 320" stroke="#533483" stroke-width="2"/>
  
  <!-- Bottom section -->
  <rect x="500" y="340" width="220" height="100" rx="8" fill="#16213e" stroke="#533483" stroke-width="1" opacity="0.6"/>
  <text x="610" y="370" text-anchor="middle" fill="#533483" font-family="Inter, sans-serif" font-size="13" font-weight="500">Efisiensi Maksimal</text>
  <text x="610" y="395" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Mesin tidak butuh makan,</text>
  <text x="610" y="412" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">tidur, atau liburan.</text>
  
  <!-- Center bridge -->
  <rect x="340" y="200" width="120" height="100" rx="10" fill="#16213e" stroke="url(#bridge)" stroke-width="2"/>
  <text x="400" y="235" text-anchor="middle" fill="#eee" font-family="Inter, sans-serif" font-size="14" font-weight="600">TRANSISI</text>
  <text x="400" y="260" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Era Pasca-</text>
  <text x="400" y="278" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Pekerjaan?</text>
  
  <!-- Connecting arrows -->
  <path d="M 330 250 L 340 250" stroke="#e94560" stroke-width="2" marker-end="url(#arrowred)"/>
  <path d="M 460 250 L 470 250" stroke="#533483" stroke-width="2" marker-end="url(#arrowpurple)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e94560"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#533483"/>
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="400" y="485" text-anchor="middle" fill="#666" font-family="Inter, sans-serif" font-size="11">Ketika nilai diri terlepas dari produktivitas, manusia harus menemukan makna baru</text>
</svg>
