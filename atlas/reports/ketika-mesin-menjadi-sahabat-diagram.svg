<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Hubungan Manusia vs AI Companion</title>
  <desc id="svg-desc">Perbandingan karakteristik hubungan manusia dengan hubungan bersama AI companion</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- LEFT SIDE: Human Relationship -->
  <g transform="translate(0, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    
    <!-- Icon: Two connected circles -->
    <circle cx="130" cy="100" r="35" fill="#fb923c" opacity="0.8"/>
    <circle cx="280" cy="100" r="35" fill="#fb923c" opacity="0.8"/>
    <path d="M165 100 Q205 70 245 100" stroke="#f97316" stroke-width="3" fill="none"/>
    
    <!-- Labels -->
    <text x="130" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Saya</text>
    <text x="280" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Mereka</text>
    
    <!-- Characteristics -->
    <text x="205" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7c2d12" font-weight="bold">Hubungan Manusia</text>
    
    <circle cx="50" cy="240" r="5" fill="#f97316"/>
    <text x="65" y="245" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Timbal balik</text>
    
    <circle cx="50" cy="270" r="5" fill="#f97316"/>
    <text x="65" y="275" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Risiko kehilangan</text>
    
    <circle cx="50" cy="300" r="5" fill="#f97316"/>
    <text x="65" y="305" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Pertumbuhan melalui konflik</text>
    
    <circle cx="50" cy="330" r="5" fill="#f97316"/>
    <text x="65" y="335" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Kesulitan & ketidakpastian</text>
    
    <circle cx="50" cy="360" r="5" fill="#f97316"/>
    <text x="65" y="365" font-family="Georgia, serif" font-size="14" fill="#7c2d12">Makna melalui pengorbanan</text>
  </g>
  
  <!-- RIGHT SIDE: AI Relationship -->
  <g transform="translate(410, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    
    <!-- Icon: Circle connected to square -->
    <circle cx="130" cy="100" r="35" fill="#3b82f6" opacity="0.8"/>
    <rect x="250" y="65" width="70" height="70" rx="10" fill="#3b82f6" opacity="0.8"/>
    <line x1="165" y1="100" x2="250" y2="100" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Labels -->
    <text x="130" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Saya</text>
    <text x="285" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Mesin</text>
    
    <!-- Characteristics -->
    <text x="205" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e3a8a" font-weight="bold">AI Companion</text>
    
    <circle cx="50" cy="240" r="5" fill="#3b82f6"/>
    <text x="65" y="245" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Satu arah</text>
    
    <circle cx="50" cy="270" r="5" fill="#3b82f6"/>
    <text x="65" y="275" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Tidak ada risiko kehilangan</text>
    
    <circle cx="50" cy="300" r="5" fill="#3b82f6"/>
    <text x="65" y="305" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Tanpa konflik</text>
    
    <circle cx="50" cy="330" r="5" fill="#3b82f6"/>
    <text x="65" y="335" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Keamanan & kepastian</text>
    
    <circle cx="50" cy="360" r="5" fill="#3b82f6"/>
    <text x="65" y="365" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">Validasi tanpa persyaratan</text>
  </g>
  
  <!-- Center divider -->
  <line x1="395" y1="20" x2="395" y2="380" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Question mark in center -->
  <text x="400" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#94a3b8" font-weight="bold">?</text>
</svg>
