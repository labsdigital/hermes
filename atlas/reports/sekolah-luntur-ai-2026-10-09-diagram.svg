<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="22" font-weight="700" letter-spacing="2">PERUBAHAN PENDIDIKAN PASCA-AI</text>
  
  <!-- Left side: Traditional Education -->
  <rect x="50" y="80" width="280" height="380" rx="16" fill="#0f3460" stroke="#1a5490" stroke-width="2"/>
  <text x="190" y="115" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="16" font-weight="600">PENDIDIKAN TRADISIONAL</text>
  
  <!-- Traditional elements -->
  <circle cx="190" cy="170" r="35" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <text x="190" y="176" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="24">👨‍🏫</text>
  <text x="190" y="225" text-anchor="middle" fill="#cccccc" font-family="Inter, sans-serif" font-size="13">Guru sebagai sumber utama</text>
  
  <rect x="100" y="250" width="180" height="40" rx="8" fill="#1a1a2e" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="190" y="275" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="12">Ujian Standar</text>
  
  <rect x="100" y="305" width="180" height="40" rx="8" fill="#1a1a2e" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="190" y="330" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="12">Hafalan & Prosedur</text>
  
  <rect x="100" y="360" width="180" height="40" rx="8" fill="#1a1a2e" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="190" y="385" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="12">Satu untuk Semua</text>
  
  <text x="190" y="435" text-anchor="middle" fill="#888888" font-family="Inter, sans-serif" font-size="11">Model: Pabrik → Produk Seragam</text>
  
  <!-- Right side: AI-Enhanced Education -->
  <rect x="470" y="80" width="280" height="380" rx="16" fill="#1a472a" stroke="#2d6a4f" stroke-width="2"/>
  <text x="610" y="115" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="16" font-weight="600">PENDIDIKAN PASCA-AI</text>
  
  <!-- AI elements -->
  <circle cx="610" cy="170" r="35" fill="none" stroke="#52b788" stroke-width="2"/>
  <text x="610" y="176" text-anchor="middle" fill="#52b788" font-family="Inter, sans-serif" font-size="24">🤖</text>
  <text x="610" y="225" text-anchor="middle" fill="#cccccc" font-family="Inter, sans-serif" font-size="13">AI sebagai tutor pribadi</text>
  
  <rect x="520" y="250" width="180" height="40" rx="8" fill="#0f3460" stroke="#52b788" stroke-width="1.5"/>
  <text x="610" y="275" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="12">Personalisasi Adaptif</text>
  
  <rect x="520" y="305" width="180" height="40" rx="8" fill="#0f3460" stroke="#52b788" stroke-width="1.5"/>
  <text x="610" y="330" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="12">Literasi Mesin</text>
  
  <rect x="520" y="360" width="180" height="40" rx="8" fill="#0f3460" stroke="#52b788" stroke-width="1.5"/>
  <text x="610" y="385" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="12">Komunitas & Empati</text>
  
  <text x="610" y="435" text-anchor="middle" fill="#888888" font-family="Inter, sans-serif" font-size="11">Model: Komunitas → Potensi Unik</text>
  
  <!-- Center arrow/connection -->
  <path d="M 340 270 L 460 270" stroke="#ff6b35" stroke-width="3" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b35"/>
    </marker>
  </defs>
  <text x="400" y="255" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="11" font-weight="600">PERGESERAN</text>
  
  <!-- Bottom insight -->
  <rect x="200" y="470" width="400" height="20" rx="10" fill="#ff6b35" opacity="0.2"/>
  <text x="400" y="484" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="10">Dari Knowledge Accumulation → Knowledge Discernment</text>
</svg>
</div>
