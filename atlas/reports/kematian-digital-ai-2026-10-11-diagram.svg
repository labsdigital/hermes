<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="600">KEMATIAN DIGITAL</text>
  <text x="400" y="65" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="14">AI &amp; Keabadian yang Hilang</text>
  
  <!-- Central circle - Human -->
  <circle cx="200" cy="250" r="80" fill="none" stroke="#64ffda" stroke-width="2" opacity="0.8"/>
  <text x="200" y="245" text-anchor="middle" fill="#64ffda" font-family="Inter, sans-serif" font-size="16" font-weight="500">MANUSIA</text>
  <text x="200" y="265" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Hidup</text>
  
  <!-- Data trail from human -->
  <path d="M 280 250 Q 350 200 400 250" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <path d="M 280 240 Q 350 190 400 240" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <path d="M 280 260 Q 350 210 400 260" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Cloud/Data layer -->
  <ellipse cx="400" cy="250" rx="100" ry="60" fill="#ff6b35" opacity="0.15"/>
  <ellipse cx="400" cy="250" rx="100" ri="60" fill="none" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="400" y="245" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="12" font-weight="500">DATA DIGITAL</text>
  <text x="400" y="262" text-anchor="middle" fill="#ff8c5a" font-family="Inter, sans-serif" font-size="10">Foto, Pesan, Suara</text>
  
  <!-- Arrow to AI -->
  <path d="M 500 250 L 540 250" fill="none" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b35"/>
    </marker>
  </defs>
  
  <!-- AI Circle -->
  <circle cx="600" cy="250" r="80" fill="none" stroke="#bd93f9" stroke-width="2" opacity="0.8"/>
  <text x="600" y="245" text-anchor="middle" fill="#bd93f9" font-family="Inter, sans-serif" font-size="16" font-weight="500">AI REPLIKA</text>
  <text x="600" y="265" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Simulasi Kehadiran</text>
  
  <!-- Bottom section - Questions -->
  <rect x="100" y="360" width="600" height="80" rx="8" fill="#ffffff" opacity="0.05"/>
  <text x="400" y="385" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="500">PERTANYAAN INTI</text>
  <text x="400" y="405" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Apakah replika digital sama dengan kehadiran?</text>
  <text x="400" y="422" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Siapa yang memiliki almarhum?</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="100" r="3" fill="#64ffda" opacity="0.4"/>
  <circle cx="720" cy="120" r="2" fill="#ff6b35" opacity="0.4"/>
  <circle cx="120" cy="450" r="2" fill="#bd93f9" opacity="0.4"/>
  <circle cx="680" cy="440" r="3" fill="#64ffda" opacity="0.4"/>
</svg>
</div>
