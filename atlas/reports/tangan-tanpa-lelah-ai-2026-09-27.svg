<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="machineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold">Tangan Tanpa Lelah</text>
  <text x="400" y="65" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="14">Paradoks Pekerjaan di Era Kecerdasan Buatan</text>
  
  <!-- Human figure (left) -->
  <circle cx="200" cy="180" r="40" fill="url(#humanGrad)" opacity="0.9"/>
  <line x1="200" y1="220" x2="200" y2="320" stroke="#e94560" stroke-width="3"/>
  <line x1="200" y1="250" x2="150" y2="290" stroke="#e94560" stroke-width="3"/>
  <line x1="200" y1="250" x2="250" y2="290" stroke="#e94560" stroke-width="3"/>
  <line x1="200" y1="320" x2="170" y2="380" stroke="#e94560" stroke-width="3"/>
  <line x1="200" y1="320" x2="230" y2="380" stroke="#e94560" stroke-width="3"/>
  
  <!-- Human label -->
  <rect x="140" y="400" width="120" height="40" rx="8" fill="#e94560" opacity="0.2"/>
  <text x="200" y="425" text-anchor="middle" fill="#e94560" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Manusia</text>
  <text x="200" y="445" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="11">Kerapuhan & Makna</text>
  
  <!-- Machine figure (right) -->
  <rect x="520" y="140" width="80" height="100" rx="10" fill="url(#machineGrad)" stroke="#0f3460" stroke-width="2"/>
  <circle cx="545" cy="170" r="8" fill="#64ffda"/>
  <circle cx="575" cy="170" r="8" fill="#64ffda"/>
  <line x1="540" y1="200" x2="580" y2="200" stroke="#64ffda" stroke-width="2"/>
  
  <!-- Machine arms -->
  <line x1="520" y1="180" x2="480" y2="220" stroke="#0f3460" stroke-width="4"/>
  <line x1="600" y1="180" x2="640" y2="220" stroke="#0f3460" stroke-width="4"/>
  
  <!-- Machine legs -->
  <line x1="540" y1="240" x2="540" y2="300" stroke="#0f3460" stroke-width="4"/>
  <line x1="580" y1="240" x2="580" y2="300" stroke="#0f3460" stroke-width="4"/>
  
  <!-- Machine label -->
  <rect x="540" y="400" width="120" height="40" rx="8" fill="#0f3460" opacity="0.3"/>
  <text x="600" y="425" text-anchor="middle" fill="#64ffda" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Mesin AI</text>
  <text x="600" y="445" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="11">Efisiensi & Daya Tahan</text>
  
  <!-- Center comparison box -->
  <rect x="320" y="200" width="160" height="120" rx="12" fill="rgba(255,255,255,0.05)" stroke="#667eea" stroke-width="1"/>
  <text x="400" y="230" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="12">PERBANDINGAN</text>
  <text x="400" y="255" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="10">Kelelahan: ✓ / ✗</text>
  <text x="400" y="275" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="10">Makna: ✓ / ✗</text>
  <text x="400" y="295" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="10">Identitas: ✓ / ✗</text>
  <text x="400" y="315" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="10">Gaji: ✓ / ✗</text>
  
  <!-- Arrow from human to machine -->
  <path d="M 260 250 Q 320 230 380 250" fill="none" stroke="#667eea" stroke-width="2"/>
  
  <!-- Bottom insight box -->
  <rect x="200" y="470" width="400" height="25" rx="5" fill="rgba(102,126,234,0.2)"/>
  <text x="400" y="487" text-anchor="middle" fill="#64ffda" font-family="Segoe UI, sans-serif" font-size="12">Pertanyaan Utama: Siapa kita tanpa pekerjaan?</text>
</svg>
