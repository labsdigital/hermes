<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Kehilangan Ruang Kosong: AI dan Penghapusan Jeda Manusia</title>
  <desc id="desc">Diagram yang membandingkan era pra-AI dengan keheningan sebagai ruang kreativitas versus era pasc-AI dengan jeda yang diisi oleh algoritma, menampilkan hilangnya ruang kosong yang diperlukan untuk pemikiran mendalam.</desc>
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </linearGradient>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#f7dc6f"/>
    </linearGradient>
    <linearGradient id="filledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="400" y="40" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="18" font-weight="bold" letter-spacing="2">KEHILANGAN RUANG KOSONG</text>
  <text x="400" y="62" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="11" letter-spacing="1">AI DAN PENGHAPUSAN JEDA MANUSIA</text>
  
  <!-- Left Panel: Pra-AI Era -->
  <rect x="30" y="85" width="350" height="370" rx="12" fill="#0d0d20" stroke="#f5a623" stroke-width="1.5" opacity="0.9"/>
  
  <text x="205" y="115" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">ERA PRA-AI</text>
  <text x="205" y="133" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="10">Sebelum algoritma mengisi setiap jeda</text>
  
  <!-- Empty space visualization - large golden area -->
  <rect x="55" y="150" width="300" height="140" rx="8" fill="url(#emptyGrad)" opacity="0.15"/>
  <rect x="55" y="150" width="300" height="140" rx="8" fill="none" stroke="#f5a623" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Icons in empty space -->
  <circle cx="150" cy="200" r="25" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6"/>
  <text x="150" y="205" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="20" opacity="0.8">...</text>
  
  <circle cx="250" cy="200" r="25" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6"/>
  <text x="250" y="205" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="20" opacity="0.8">?</text>
  
  <circle cx="350" cy="200" r="25" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6"/>
  <text x="350" y="205" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="20" opacity="0.8">∞</text>
  
  <text x="205" y="255" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="11" font-weight="bold">RUANG KOSONG = POTENSI</text>
  
  <!-- Benefits list -->
  <text x="55" y="310" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✓ Kreativitas lahir dari kebosanan</text>
  <text x="55" y="330" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✓ Refleksi mendalam tanpa gangguan</text>
  <text x="55" y="350" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✓ Pembentukan identitas otentik</text>
  <text x="55" y="370" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✓ Default Mode Network aktif</text>
  <text x="55" y="390" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✓ Kejelasan pikiran melalui diam</text>
  <text x="55" y="410" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✓ Rasa ingin tahu yang organik</text>
  
  <text x="205" y="445" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="10" font-style="italic">「Ma」— keindahan dalam ketidakhadiran</text>
  
  <!-- Right Panel: PascA-I Era -->
  <rect x="420" y="85" width="350" height="370" rx="12" fill="#0d0d20" stroke="#e74c3c" stroke-width="1.5" opacity="0.9"/>
  
  <text x="595" y="115" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">ERA PASCА-AI</text>
  <text x="595" y="133" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="10">Ketika algoritma membaca pikiran kita</text>
  
  <!-- Filled space visualization - red chaotic area -->
  <rect x="445" y="150" width="300" height="140" rx="8" fill="url(#filledGrad)" opacity="0.12"/>
  <rect x="445" y="150" width="300" height="140" rx="8" fill="none" stroke="#e74c3c" stroke-width="1"/>
  
  <!-- Notification icons filling the space -->
  <g opacity="0.7">
    <rect x="460" y="160" width="40" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="480" y="177" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">notif</text>
    
    <rect x="520" y="155" width="45" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="542" y="172" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">scroll</text>
    
    <rect x="590" y="162" width="40" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="610" y="179" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">like</text>
    
    <rect x="470" y="200" width="50" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="495" y="217" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">rekomendasi</text>
    
    <rect x="540" y="205" width="40" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="560" y="222" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">feed</text>
    
    <rect x="610" y="198" width="45" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="632" y="215" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">prediksi</text>
    
    <rect x="465" y="240" width="35" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="482" y="257" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">target</text>
    
    <rect x="530" y="238" width="40" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="550" y="255" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">tracking</text>
    
    <rect x="600" y="245" width="50" height="25" rx="4" fill="#e74c3c" opacity="0.3"/>
    <text x="625" y="262" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="9">optimasi</text>
  </g>
  
  <text x="595" y="315" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="11" font-weight="bold">RUANG KOSONG = DIHAPUS</text>
  
  <!-- Costs list -->
  <text x="445" y="340" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✗ Kreativitas dikriminalisasi sebagai「tidak produktif」</text>
  <text x="445" y="360" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✗ Default Mode Network tertekan</text>
  <text x="445" y="380" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✗ Identitas dikonstruksi oleh algoritma</text>
  <text x="445" y="400" fill="#ccc" font-family="Inter, sans-serif" font-size="11">✗ Ketidakpastian dihapus untuk efisiensi</text>
  
  <text x="595" y="440" text-anchor="middle" fill="#e74c3c" font-family="Inter, sans-serif" font-size="10" font-style="italic">「Optimized self」— diri yang diprediksi, bukan dialami</text>
  
  <!-- Center divider with arrow -->
  <line x1="395" y1="180" x2="395" y2="380" stroke="#555" stroke-width="1" stroke-dasharray="6,4"/>
  
  <!-- Arrow showing transformation -->
  <path d="M 380 270 L 420 270 M 410 262 L 420 270 L 410 278" fill="none" stroke="#f5a623" stroke-width="2" filter="url(#glow)"/>
  
  <text x="400" y="295" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="9" font-weight="bold">⚡</text>
  
  <!-- Bottom insight bar -->
  <rect x="30" y="468" width="740" height="22" rx="6" fill="#f5a623" opacity="0.1"/>
  <text x="400" y="483" text-anchor="middle" fill="#f5a623" font-family="Inter, sans-serif" font-size="10" font-style="italic">「Kita bukan budak yang dipaksa bekerja — kita pekerja termotivasi yang memilih untuk terus bekerja tanpa bertanya mengapa」</text>
</svg>