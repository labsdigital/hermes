<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Etika Mesin: Moralitas Manusia vs Simulasi Algoritmik</title>
  <desc id="svg-desc">Diagram perbandingan antara moralitas manusia yang berbasis kesadaran dan komitmen, dengan moralitas mesin yang merupakan simulasi berdasarkan pola data.</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- LEFT SIDE: Moralitas Manusia -->
  <g transform="translate(0, 0)">
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    
    <!-- Brain icon -->
    <circle cx="205" cy="100" r="50" fill="#fed7aa" opacity="0.8"/>
    <path d="M180,85 Q190,70 205,75 Q220,70 230,85 Q235,100 225,115 Q210,125 195,120 Q180,125 175,115 Q170,100 180,85 Z" fill="#f97316" opacity="0.6"/>
    <path d="M190,90 L205,110 M220,90 L205,110" stroke="#f97316" stroke-width="2" fill="none"/>
    
    <!-- Heart icon -->
    <path d="M185,160 Q185,145 200,145 Q215,145 215,160 Q215,175 200,190 Q185,175 185,160 Z" fill="#ef4444" opacity="0.7"/>
    
    <!-- Text labels -->
    <text x="205" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7c2d12" font-weight="bold">Moralitas Manusia</text>
    <text x="205" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9a3412">• Kesadaran (Consciousness)</text>
    <text x="205" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9a3412">• Empati (Empathy)</text>
    <text x="205" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9a3412">• Komitmen (Commitment)</text>
    <text x="205" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9a3412">• Tanggung Jawab (Responsibility)</text>
  </g>
  
  <!-- RIGHT SIDE: Simulasi Algoritmik -->
  <g transform="translate(410, 0)">
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    
    <!-- Chip icon -->
    <rect x="175" y="70" width="60" height="60" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <line x1="185" y1="70" x2="185" y2="55" stroke="#3b82f6" stroke-width="2"/>
    <line x1="205" y1="70" x2="205" y2="55" stroke="#3b82f6" stroke-width="2"/>
    <line x1="225" y1="70" x2="225" y2="55" stroke="#3b82f6" stroke-width="2"/>
    <line x1="185" y1="130" x2="185" y2="145" stroke="#3b82f6" stroke-width="2"/>
    <line x1="205" y1="130" x2="205" y2="145" stroke="#3b82f6" stroke-width="2"/>
    <line x1="225" y1="130" x2="225" y2="145" stroke="#3b82f6" stroke-width="2"/>
    <line x1="175" y1="90" x2="160" y2="90" stroke="#3b82f6" stroke-width="2"/>
    <line x1="175" y1="110" x2="160" y2="110" stroke="#3b82f6" stroke-width="2"/>
    <line x1="235" y1="90" x2="250" y2="90" stroke="#3b82f6" stroke-width="2"/>
    <line x1="235" y1="110" x2="250" y2="110" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Data particles -->
    <circle cx="160" cy="80" r="4" fill="#60a5fa"/>
    <circle cx="150" cy="100" r="3" fill="#60a5fa"/>
    <circle cx="240" cy="80" r="4" fill="#60a5fa"/>
    <circle cx="250" cy="100" r="3" fill="#60a5fa"/>
    
    <!-- Text labels -->
    <text x="205" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e3a8a" font-weight="bold">Simulasi Algoritmik</text>
    <text x="205" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">• Pola Data (Data Patterns)</text>
    <text x="205" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">• Konsistensi (Consistency)</text>
    <text x="205" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">• Optimasi (Optimization)</text>
    <text x="205" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">• Rekomendasi (Recommendations)</text>
  </g>
  
  <!-- Center divider -->
  <line x1="395" y1="20" x2="395" y2="380" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Arrow from human to machine -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <path d="M205,200 Q400,180 595,200" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">Pelatihan Data</text>
  
  <!-- Bottom caption -->
  <text x="400" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">Moralitas bukan algoritma — ia adalah komitmen yang memerlukan subjek</text>
</svg>
