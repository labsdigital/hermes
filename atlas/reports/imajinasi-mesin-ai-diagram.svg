<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a8cff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="600">Imajinasi Manusia vs Mesin</text>
  
  <!-- Human Side -->
  <circle cx="150" cy="200" r="80" fill="none" stroke="url(#humanGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="150" cy="200" r="60" fill="url(#humanGrad)" opacity="0.3"/>
  
  <!-- Human brain neurons -->
  <g stroke="#e94560" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M150 160 L170 180 L160 200 L180 220"/>
    <path d="M150 160 L130 180 L140 200 L120 220"/>
    <path d="M170 180 L190 175"/>
    <path d="M130 180 L110 175"/>
    <path d="M160 200 L180 210"/>
    <path d="M140 200 L120 210"/>
    <path d="M180 220 L190 240"/>
    <path d="M120 220 L110 240"/>
  </g>
  
  <!-- Human icons -->
  <circle cx="150" cy="140" r="8" fill="#e94560"/>
  <rect x="145" y="148" width="10" height="25" rx="2" fill="#e94560"/>
  <line x1="140" y1="155" x2="160" y2="155" stroke="#e94560" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="150" y="290" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="600">Manusia</text>
  <text x="150" y="310" text-anchor="middle" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="11">Emosi • Pengalaman • Maksud</text>
  
  <!-- AI Side -->
  <rect x="420" y="120" width="160" height="160" rx="15" fill="none" stroke="url(#aiGrad)" stroke-width="3" filter="url(#glow)"/>
  <rect x="435" y="135" width="130" height="130" rx="10" fill="url(#aiGrad)" opacity="0.3"/>
  
  <!-- AI circuits -->
  <g stroke="#1a8cff" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M450 150 L470 170 L470 190 L490 210"/>
    <path d="M510 150 L490 170 L490 190 L510 210"/>
    <path d="M450 230 L470 210 L470 190 L490 170"/>
    <path d="M510 230 L490 210 L490 190 L510 170"/>
  </g>
  
  <!-- Nodes -->
  <circle cx="450" cy="150" r="4" fill="#1a8cff"/>
  <circle cx="510" cy="150" r="4" fill="#1a8cff"/>
  <circle cx="450" cy="230" r="4" fill="#1a8cff"/>
  <circle cx="510" cy="230" r="4" fill="#1a8cff"/>
  <circle cx="490" cy="190" r="5" fill="#1a8cff"/>
  
  <!-- Labels -->
  <text x="500" y="310" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="600">AI</text>
  <text x="500" y="330" text-anchor="middle" fill="#1a8cff" font-family="Inter, sans-serif" font-size="11">Statistik • Pattern • Prediksi</text>
  
  <!-- Connection -->
  <line x1="230" y1="200" x2="420" y2="200" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="325" y="195" text-anchor="middle" fill="#888888" font-family="Inter, sans-serif" font-size="10">TIRUAN vs MAKNA</text>
  
  <!-- Key difference box -->
  <rect x="180" y="350" width="240" height="40" rx="8" fill="#ffffff" opacity="0.1"/>
  <text x="300" y="375" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="500">Imajinasi = Pengalaman + Emosi + Maksud</text>
</svg>
