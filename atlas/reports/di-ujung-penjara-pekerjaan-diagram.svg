<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Perjalanan Makna Manusia di Zaman AI</title>
  <desc id="svg-desc">Diagram evolusi makna manusia dari era pemburu-pengumpul hingga era AI, menunjukkan pergeseran dari makna eksternal ke internal.</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e293b" font-weight="bold">Perjalanan Makna Manusia</text>
  
  <!-- Timeline path -->
  <line x1="50" y1="200" x2="750" y2="200" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Era 1: Pemburu-Pengumpul -->
  <g transform="translate(80, 0)">
    <circle cx="0" cy="200" r="12" fill="#f97316"/>
    <rect x="-50" y="60" width="100" height="80" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7c2d12" font-weight="bold">Pemburu</text>
    <text x="0" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7c2d12">Bertahan Hidup</text>
    <text x="0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">Makna = Keberadaan</text>
  </g>
  
  <!-- Era 2: Pertanian -->
  <g transform="translate(230, 0)">
    <circle cx="0" cy="200" r="12" fill="#22c55e"/>
    <rect x="-50" y="60" width="100" height="80" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#166534" font-weight="bold">Pertanian</text>
    <text x="0" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#166534">Membangun</text>
    <text x="0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">Makna = Warisan</text>
  </g>
  
  <!-- Era 3: Industri -->
  <g transform="translate(380, 0)">
    <circle cx="0" cy="200" r="12" fill="#3b82f6"/>
    <rect x="-50" y="60" width="100" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e3a8a" font-weight="bold">Industri</text>
    <text x="0" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1e3a8a">Kemajuan</text>
    <text x="0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">Makna = Produktivitas</text>
  </g>
  
  <!-- Era 4: Informasi -->
  <g transform="translate(530, 0)">
    <circle cx="0" cy="200" r="12" fill="#a855f7"/>
    <rect x="-50" y="60" width="100" height="80" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6b21a8" font-weight="bold">Informasi</text>
    <text x="0" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6b21a8">Pilihan</text>
    <text x="0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">Makna = Eksplorasi</text>
  </g>
  
  <!-- Era 5: AI -->
  <g transform="translate(680, 0)">
    <circle cx="0" cy="200" r="12" fill="#ef4444"/>
    <rect x="-50" y="60" width="100" height="80" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#991b1b" font-weight="bold">AI Era</text>
    <text x="0" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#991b1b">Pertanyaan</text>
    <text x="0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">Makna = ?</text>
  </g>
  
  <!-- Arrow between eras -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="400" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b"> Pergeseran dari makna eksternal → pencarian makna internal</text>
</svg>
