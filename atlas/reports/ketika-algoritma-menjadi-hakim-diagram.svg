<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Arsitektur Pemerintahan Algoritma">
  <title>Arsitektur Pemerintahan Algoritma</title>
  <desc>Diagram yang menunjukkan alur pemerintahan algoritma: dari input data, pemrosesan, keputusan, hingga akuntabilitas</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6b3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a1a6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="400" y="36" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#e0e0ff" text-anchor="middle">Arsitektur Pemerintahan Algoritma</text>

  <!-- Arrow helper lines (subtle) -->
  <line x1="165" y1="160" x2="285" y2="110" stroke="#334466" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="165" y1="200" x2="285" y2="200" stroke="#334466" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="165" y1="240" x2="285" y2="290" stroke="#334466" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- INPUT NODES -->
  <g id="input-layer">
    <!-- Data citizens -->
    <rect x="20" y="140" width="140" height="40" rx="8" fill="url(#nodeGrad1)" stroke="#6ab0ff" stroke-width="1"/>
    <text x="90" y="165" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Data Warga Negara</text>

    <!-- Historical records -->
    <rect x="20" y="180" width="140" height="40" rx="8" fill="url(#nodeGrad1)" stroke="#6ab0ff" stroke-width="1"/>
    <text x="90" y="205" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Rekam Jejak Historis</text>

    <!-- Behavioral patterns -->
    <rect x="20" y="220" width="140" height="40" rx="8" fill="url(#nodeGrad1)" stroke="#6ab0ff" stroke-width="1"/>
    <text x="90" y="245" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Pola Perilaku</text>

    <text x="90" y="285" font-family="Arial, sans-serif" font-size="11" fill="#8899bb" text-anchor="middle" font-style="italic">Input Layer</text>
  </g>

  <!-- Arrow to processing -->
  <path d="M 165 200 L 210 200" stroke="#aabbcc" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- CENTRAL PROCESSING - THE BLACK BOX -->
  <g id="processing-layer">
    <rect x="220" y="100" width="180" height="200" rx="12" fill="#111122" stroke="#5555aa" stroke-width="2" filter="url(#glow)"/>
    <text x="310" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ccccff" text-anchor="middle">ALGORITMA</text>
    <text x="310" y="155" font-family="Arial, sans-serif" font-size="11" fill="#8888bb" text-anchor="middle">(Black Box)</text>

    <!-- Internal processing blocks -->
    <rect x="235" y="170" width="150" height="25" rx="5" fill="#1a1a3a" stroke="#4444aa" stroke-width="1"/>
    <text x="310" y="187" font-family="Courier New, monospace" font-size="10" fill="#aaaaff" text-anchor="middle">Pattern Recognition</text>

    <rect x="235" y="202" width="150" height="25" rx="5" fill="#1a1a3a" stroke="#4444aa" stroke-width="1"/>
    <text x="310" y="219" font-family="Courier New, monospace" font-size="10" fill="#aaaaff" text-anchor="middle">Risk Scoring</text>

    <rect x="235" y="234" width="150" height="25" rx="5" fill="#1a1a3a" stroke="#4444aa" stroke-width="1"/>
    <text x="310" y="251" font-family="Courier New, monospace" font-size="10" fill="#aaaaff" text-anchor="middle">Decision Engine</text>

    <text x="310" y="280" font-family="Arial, sans-serif" font-size="11" fill="#5566aa" text-anchor="middle">ML Model Processing</text>
  </g>

  <!-- Arrows to output nodes -->
  <line x1="400" y1="140" x2="460" y2="100" stroke="#cc8899" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="200" x2="460" y2="200" stroke="#cc8899" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="260" x2="460" y2="300" stroke="#cc8899" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- OUTPUT NODES -->
  <g id="output-layer">
    <!-- Decision - prison -->
    <rect x="470" y="80" width="150" height="40" rx="8" fill="url(#nodeGrad2)" stroke="#ff8888" stroke-width="1"/>
    <text x="545" y="100" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Putusan Penitentiary</text>
    <text x="545" y="113" font-family="Arial, sans-serif" font-size="10" fill="#ffcccc" text-anchor="middle">(Bebas / Penahanan)</text>

    <!-- Decision - credit -->
    <rect x="470" y="180" width="150" height="40" rx="8" fill="url(#nodeGrad5)" stroke="#ffcc66" stroke-width="1"/>
    <text x="545" y="200" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Persetujuan Kredit</text>
    <text x="545" y="213" font-family="Arial, sans-serif" font-size="10" fill="#ffeebb" text-anchor="middle">(Setuju / Ditolak)</text>

    <!-- Decision - employment -->
    <rect x="470" y="280" width="150" height="40" rx="8" fill="url(#nodeGrad4)" stroke="#cc88dd" stroke-width="1"/>
    <text x="545" y="300" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Seleksi Tenaga Kerja</text>
    <text x="545" y="313" font-family="Arial, sans-serif" font-size="10" fill="#ddbbff" text-anchor="middle">(Diterima / Ditolak)</text>

    <text x="545" y="345" font-family="Arial, sans-serif" font-size="11" fill="#8899bb" text-anchor="middle" font-style="italic">Output Layer</text>
  </g>

  <!-- ACCOUNTABILITY CHAIN -->
  <g id="accountability-layer">
    <rect x="660" y="140" width="120" height="140" rx="10" fill="url(#nodeGrad3)" stroke="#66dd88" stroke-width="1.5"/>
    <text x="720" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">AKUNTABILITAS</text>
    <line x1="668" y1="175" x2="772" y2="175" stroke="#44aa66" stroke-width="1"/>
    <text x="720" y="193" font-family="Arial, sans-serif" font-size="10" fill="#ccffcc" text-anchor="middle">• Transparansi</text>
    <text x="720" y="208" font-family="Arial, sans-serif" font-size="10" fill="#ccffcc" text-anchor="middle">• Auditan Independen</text>
    <text x="720" y="223" font-family="Arial, sans-serif" font-size="10" fill="#ccffcc" text-anchor="middle">• Jalur Banding</text>
    <text x="720" y="238" font-family="Arial, sans-serif" font-size="10" fill="#ccffcc" text-anchor="middle">• Keterlibatan Publik</text>
    <text x="720" y="270" font-family="Arial, sans-serif" font-size="11" fill="#8899bb" text-anchor="middle" font-style="italic">Oversight</text>
  </g>

  <!-- Connection from outputs to accountability -->
  <line x1="620" y1="100" x2="655" y2="175" stroke="#66aa88" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="200" x2="655" y2="200" stroke="#66aa88" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="300" x2="655" y2="225" stroke="#66aa88" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Human Override -->
  <rect x="240" y="360" width="160" height="36" rx="8" fill="#2a2a4a" stroke="#8888cc" stroke-width="1.5"/>
  <text x="320" y="377" font-family="Arial, sans-serif" font-size="11" fill="#aaaaff" text-anchor="middle">⚖ Human Override Button</text>
  <text x="320" y="393" font-family="Arial, sans-serif" font-size="9" fill="#6677aa" text-anchor="middle">(Pengawasan Manusia)</text>

  <line x1="320" y1="300" x2="320" y2="360" stroke="#8888cc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Labels on sides -->
  <text x="18" y="395" font-family="Arial, sans-serif" font-size="10" fill="#5566aa">← DATA</text>
  <text x="620" y="395" font-family="Arial, sans-serif" font-size="10" fill="#aa5566">DECISIONS →</text>
  <text x="660" y="395" font-family="Arial, sans-serif" font-size="10" fill="#55aa66">ACCOUNT→</text>

  <!-- Legend -->
  <rect x="20" y="430" width="760" height="75" rx="8" fill="#0d0d22" stroke="#334466" stroke-width="1"/>
  <text x="40" y="452" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#aaaacc">Legenda:</text>
  <rect x="40" y="462" width="14" height="14" rx="3" fill="url(#nodeGrad1)"/>
  <text x="60" y="474" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc">Input Data (Data warga, historis, perilaku)</text>
  <rect x="280" y="462" width="14" height="14" rx="3" fill="#111122"/>
  <text x="300" y="474" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc">Algoritma (Black Box ML)</text>
  <rect x="440" y="462" width="14" height="14" rx="3" fill="url(#nodeGrad2)"/>
  <text x="460" y="474" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc">Keputusan kritis (pidana, kredit, kerja)</text>
  <rect x="660" y="462" width="14" height="14" rx="3" fill="url(#nodeGrad3)"/>
  <text x="680" y="474" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc">Oversight (transparansi &amp; akuntabilitas)</text>

  <text x="40" y="495" font-family="Arial, sans-serif" font-size="9" fill="#667799">Pemerintahan algoritma bekerja dalam tiga lapisan: pengumpulan data → pemrosesan ML → keputusan → akuntabilitas.</text>

  <line x1="150" y1="310" x2="470" y2="310" stroke="#334466" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="310" y="316" font-family="Arial, sans-serif" font-size="9" fill="#556688" text-anchor="middle" font-style="italic">Dampak: jutaan nyawa manusia ditentukan setiap hari</text>

</svg>
