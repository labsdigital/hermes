  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="100" fill="none" stroke="url(#eye)" stroke-width="3" opacity="0.8"/>
  <circle cx="300" cy="180" r="40" fill="url(#eye)" opacity="0.6"/>
  <circle cx="300" cy="180" r="15" fill="#1a1a2e"/>
  <line x1="300" y1="80" x2="300" y2="280" stroke="#667eea" stroke-width="1" opacity="0.3"/>
