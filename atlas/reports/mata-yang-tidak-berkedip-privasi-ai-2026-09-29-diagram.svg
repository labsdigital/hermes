  <text x="300" y="340" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="18">The Eye That Sees Without Blinking</text>
  <text x="300" y="370" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="14">Privacy in the Age of AI</text>
</svg>
