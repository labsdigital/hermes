<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="emotionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold">Empati Buatan vs Empati Sejati</text>
  
  <!-- Human side -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="#667eea" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="200" r="60" fill="none" stroke="#667eea" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="200" r="40" fill="#667eea" opacity="0.2"/>
  
  <!-- Human brain icon -->
  <path d="M180 180 Q200 160 220 180 Q230 200 220 220 Q200 240 180 220 Q170 200 180 180Z" fill="none" stroke="#667eea" stroke-width="2"/>
  <line x1="200" y1="160" x2="200" y2="240" stroke="#667eea" stroke-width="1.5"/>
  <line x1="170" y1="200" x2="230" y2="200" stroke="#667eea" stroke-width="1.5"/>
  
  <text x="200" y="290" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="14">Manusia</text>
  <text x="200" y="310" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="11">Pengalaman Subjektif</text>
  
  <!-- AI side -->
  <rect x="520" y="140" width="120" height="100" rx="10" fill="none" stroke="#764ba2" stroke-width="2" opacity="0.6"/>
  <rect x="540" y="160" width="80" height="50" rx="5" fill="#764ba2" opacity="0.1"/>
  
  <!-- Circuit lines -->
  <line x1="560" y1="175" x2="600" y2="175" stroke="#764ba2" stroke-width="1.5"/>
  <line x1="560" y1="190" x2="600" y2="190" stroke="#764ba2" stroke-width="1.5"/>
  <line x1="560" y1="205" x2="600" y2="205" stroke="#764ba2" stroke-width="1.5"/>
  
  <text x="580" y="270" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="14">Mesin</text>
  <text x="580" y="290" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="11">Pola & Probabilitas</text>
  
  <!-- Connection arrows -->
  <path d="M280 200 Q400 150 520 200" fill="none" stroke="url(#emotionGrad)" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <path d="M280 220 Q400 270 520 220" fill="none" stroke="url(#emotionGrad)" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Arrow heads -->
  <polygon points="520,195 530,200 520,205" fill="#764ba2" opacity="0.6"/>
  <polygon points="520,215 530,220 520,225" fill="#764ba2" opacity="0.6"/>
  <polygon points="280,195 270,200 280,205" fill="#667eea" opacity="0.6"/>
  <polygon points="280,215 270,220 280,225" fill="#667eea" opacity="0.6"/>
  
  <!-- Center question -->
  <circle cx="400" cy="210" r="35" fill="#16213e" stroke="url(#emotionGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="205" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="12">Apakah</text>
  <text x="400" y="222" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="12">Nyata?</text>
  
  <!-- Bottom explanation -->
  <rect x="150" y="380" width="500" height="80" rx="8" fill="rgba(102,126,234,0.1)" stroke="rgba(102,126,234,0.3)" stroke-width="1"/>
  <text x="400" y="410" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="12">Empati mesin: respons yang dihitung</text>
  <text x="400" y="430" text-anchor="middle" fill="#e6e6e6" font-family="Segoe UI, sans-serif" font-size="12">Empati manusia: pengalaman yang dirasakan</text>
  <text x="400" y="450" text-anchor="middle" fill="#8892b0" font-family="Segoe UI, sans-serif" font-size="11">Tapi efeknya bisa sama nyatanya</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="3" fill="#667eea" opacity="0.5"/>
  <circle cx="700" cy="120" r="2" fill="#764ba2" opacity="0.5"/>
  <circle cx="150" cy="400" r="2" fill="#667eea" opacity="0.3"/>
  <circle cx="650" cy="380" r="3" fill="#764ba2" opacity="0.4"/>
</svg>
