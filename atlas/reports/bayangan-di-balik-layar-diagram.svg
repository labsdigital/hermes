<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">Arsitektur Berlapis AI</text>
  <text x="400" y="65" text-anchor="middle" fill="#888" font-size="12">Dari Data Mentah Hingga Keputusan Cerdas</text>
  
  <!-- Layer 1: Raw Data -->
  <ellipse cx="400" cy="420" rx="300" ry="50" fill="url(#grad1)" opacity="0.3" stroke="#ff6b35" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="415" text-anchor="middle" fill="#fff" font-size="14" font-weight="500">Data Mentah</text>
  <text x="400" y="435" text-anchor="middle" fill="#ccc" font-size="10">Triliunan baris informasi</text>
  
  <!-- Layer 2: Processing -->
  <ellipse cx="400" cy="320" rx="250" ry="45" fill="url(#grad2)" opacity="0.3" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="315" text-anchor="middle" fill="#fff" font-size="14" font-weight="500">Pemrosesan & Embedding</text>
  <text x="400" y="335" text-anchor="middle" fill="#ccc" font-size="10">Vector representation</text>
  
  <!-- Layer 3: Model -->
  <ellipse cx="400" cy="220" rx="200" ry="40" fill="url(#grad3)" opacity="0.3" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="215" text-anchor="middle" fill="#fff" font-size="14" font-weight="500">Model Neural Network</text>
  <text x="400" y="235" text-anchor="middle" fill="#ccc" font-size="10">Miliaran parameter</text>
  
  <!-- Layer 4: Intelligence -->
  <ellipse cx="400" cy="130" rx="140" ry="35" fill="url(#grad1)" opacity="0.4" stroke="#ff6b35" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="125" text-anchor="middle" fill="#fff" font-size="14" font-weight="500">Kecerdasan Buatan</text>
  <text x="400" y="145" text-anchor="middle" fill="#ccc" font-size="10">Pattern recognition</text>
  
  <!-- Arrows -->
  <path d="M 400 370 L 400 365" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 270 L 400 265" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 400 180 L 400 175" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Flow labels -->
  <text x="420" y="368" fill="#ff6b35" font-size="10">Transformasi</text>
  <text x="420" y="268" fill="#7c3aed" font-size="10">Processing</text>
  <text x="420" y="178" fill="#06b6d4" font-size="10">Inference</text>
  
  <!-- Side annotations -->
  <text x="50" y="250" fill="#666" font-size="11" transform="rotate(-90, 50, 250)">Aliran Data</text>
  <text x="750" y="250" fill="#666" font-size="11" transform="rotate(90, 750, 250)">Output</text>
</svg>