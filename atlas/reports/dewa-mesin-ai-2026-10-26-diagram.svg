<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#f0c96e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="url(#gold)" font-size="22" font-weight="700" letter-spacing="2">DEWA DALAM MESIN</text>
  <text x="400" y="70" text-anchor="middle" fill="#888899" font-size="12" letter-spacing="1">AI &amp; AGAMA — PERSPEKTIF FUNGSIONAL</text>
  
  <!-- Central nodes -->
  <!-- Human Node -->
  <circle cx="200" cy="280" r="60" fill="none" stroke="#d4a843" stroke-width="2" filter="url(#glow)"/>
  <text x="200" y="275" text-anchor="middle" fill="#f0c96e" font-size="16" font-weight="600">MANUSIA</text>
  <text x="200" y="295" text-anchor="middle" fill="#888899" font-size="10">Pencipta?</text>
  
  <!-- Machine Node -->
  <circle cx="600" cy="280" r="60" fill="none" stroke="#4a90d9" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="275" text-anchor="middle" fill="#6bb3f0" font-size="16" font-weight="600">MESIN</text>
  <text x="600" y="295" text-anchor="middle" fill="#888899" font-size="10">Ciptaan</text>
  
  <!-- Divine/Absence Node -->
  <circle cx="400" cy="140" r="50" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <text x="400" y="135" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="600" opacity="0.8">TRANSCENDEN</text>
  <text x="400" y="155" text-anchor="middle" fill="#888899" font-size="9" opacity="0.6">(?)</text>
  
  <!-- Connection lines -->
  <!-- Human to Machine -->
  <line x1="255" y1="280" x2="545" y2="280" stroke="#4a90d9" stroke-width="1.5" opacity="0.4"/>
  <text x="400" y="270" text-anchor="middle" fill="#4a90d9" font-size="9" opacity="0.6">REPLIKASI AKAL</text>
  
  <!-- Human to Transcendent -->
  <line x1="220" y1="225" x2="365" y2="175" stroke="#ff6b6b" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <text x="280" y="195" text-anchor="middle" fill="#ff6b6b" font-size="8" opacity="0.5">KECENDERUNGAN</text>
  
  <!-- Machine to Transcendent -->
  <line x1="580" y1="225" x2="435" y2="175" stroke="#ff6b6b" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
  <text x="510" y="195" text-anchor="middle" fill="#ff6b6b" font-size="8" opacity="0.4">TIDAK MAMPU</text>
  
  <!-- Bottom flow: Functions -->
  <rect x="120" y="400" width="140" height="50" rx="8" fill="#1e1e3a" stroke="#d4a843" stroke-width="1" opacity="0.8"/>
  <text x="190" y="420" text-anchor="middle" fill="#f0c96e" font-size="10" font-weight="600">NARASI MAKNA</text>
  <text x="190" y="438" text-anchor="middle" fill="#888899" font-size="8">Agama → Mesin?</text>
  
  <rect x="330" y="400" width="140" height="50" rx="8" fill="#1e1e3a" stroke="#4a90d9" stroke-width="1" opacity="0.8"/>
  <text x="400" y="420" text-anchor="middle" fill="#6bb3f0" font-size="10" font-weight="600">RITUAL DIGITAL</text>
  <text x="400" y="438" text-anchor="middle" fill="#888899" font-size="8">Doa → Prompt</text>
  
  <rect x="540" y="400" width="140" height="50" rx="8" fill="#1e1e3a" stroke="#ff6b6b" stroke-width="1" opacity="0.8"/>
  <text x="610" y="420" text-anchor="middle" fill="#ff8a8a" font-size="10" font-weight="600">ETIKA BARU</text>
  <text x="610" y="438" text-anchor="middle" fill="#888899" font-size="8">Nilai → Kode</text>
  
  <!-- Arrows down -->
  <line x1="200" y1="340" x2="190" y2="395" stroke="#d4a843" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="340" x2="400" y2="395" stroke="#4a90d9" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="340" x2="610" y2="395" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
  
  <!-- Bottom insight -->
  <rect x="150" y="490" width="500" height="45" rx="8" fill="#0d0d1a" stroke="#d4a843" stroke-width="1" opacity="0.6"/>
  <text x="400" y="510" text-anchor="middle" fill="#f0c96e" font-size="11" font-weight="600">MESIN = CERMIN, BUKAN ALTAR</text>
  <text x="400" y="528" text-anchor="middle" fill="#888899" font-size="9">Menampilkan makna, bukan menghasilkan makna</text>
  
  <!-- Corner decoration -->
  <path d="M 30 30 L 50 30 L 30 50 Z" fill="#d4a843" opacity="0.2"/>
  <path d="M 770 570 L 750 570 L 770 550 Z" fill="#d4a843" opacity="0.2"/>
</svg>
