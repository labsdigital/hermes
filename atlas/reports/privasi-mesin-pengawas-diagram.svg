<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="600">Privasi di Zaman Mesin Pengawas</text>
  
  <!-- Left side - Human -->
  <circle cx="200" cy="250" r="80" fill="none" stroke="url(#orangeGrad)" stroke-width="3" opacity="0.8"/>
  <circle cx="200" cy="250" r="60" fill="none" stroke="url(#orangeGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="250" r="40" fill="none" stroke="url(#orangeGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Human icon -->
  <circle cx="200" cy="220" r="15" fill="#f97316" opacity="0.9"/>
  <path d="M180 280 Q200 260 220 280" stroke="#f97316" stroke-width="3" fill="none" opacity="0.9"/>
  <line x1="200" y1="235" x2="200" y2="270" stroke="#f97316" stroke-width="3" opacity="0.9"/>
  
  <text x="200" y="320" text-anchor="middle" fill="#fb923c" font-family="Inter, sans-serif" font-size="14" font-weight="500">MANUSIA</text>
  <text x="200" y="340" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Privasi = Kompleksitas</text>
  
  <!-- Right side - Machine -->
  <rect x="520" y="170" width="160" height="120" rx="10" fill="none" stroke="url(#blueGrad)" stroke-width="3" opacity="0.8"/>
  <rect x="540" y="190" width="120" height="80" rx="5" fill="#1e3a5f" opacity="0.5"/>
  
  <!-- Camera lens -->
  <circle cx="600" cy="230" r="25" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.9"/>
  <circle cx="600" cy="230" r="15" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <circle cx="600" cy="230" r="5" fill="#3b82f6" opacity="0.9"/>
  
  <!-- Data streams -->
  <line x1="620" y1="200" x2="660" y2="200" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="620" y1="215" x2="670" y2="215" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="620" y1="230" x2="660" y2="230" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="620" y1="245" x2="670" y2="245" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="620" y1="260" x2="660" y2="260" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  
  <text x="600" y="320" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="14" font-weight="500">MESIN</text>
  <text x="600" y="340" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Data = Prediktabilitas</text>
  
  <!-- Connection arrows -->
  <path d="M280 250 Q400 200 520 250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.6"/>
  <path d="M280 250 Q400 300 520 250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.6"/>
  
  <!-- Center - the exchange -->
  <rect x="350" y="220" width="100" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="11" font-weight="500">TRANSAKSI</text>
  <text x="400" y="265" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Data ↔ Layanan</text>
  
  <!-- Warning symbols -->
  <polygon points="400,380 390,400 410,400" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
  <text x="400" y="420" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="12" opacity="0.8">⚠️ Privasi = Fondasi Demokrasi</text>
  
  <!-- Bottom notes -->
  <text x="100" y="460" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Kapelisme Pengawasan</text>
  <text x="700" y="460" fill="#64748b" font-family="Inter, sans-serif" font-size="10" text-anchor="end">Zuboff, 2014</text>
</svg>