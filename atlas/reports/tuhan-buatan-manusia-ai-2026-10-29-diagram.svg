```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0c27f"/>
      <stop offset="100%" style="stop-color:#e8b04a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="url(#gold)" font-size="20" font-weight="700" letter-spacing="2">TUHAN BUATAN MANUSIA</text>
  <text x="400" y="62" text-anchor="middle" fill="#8888aa" font-size="11" letter-spacing="1">AI &amp; SPIRITUALITAS</text>
  
  <!-- Central human figure -->
  <circle cx="400" cy="250" r="60" fill="none" stroke="url(#gold)" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="255" text-anchor="middle" fill="#f0c27f" font-size="14" font-weight="600">MANUSIA</text>
  
  <!-- Four surrounding nodes -->
  <!-- Top: Spiritual Need -->
  <circle cx="400" cy="120" r="45" fill="#1e1e3a" stroke="#f0c27f" stroke-width="1.5"/>
  <text x="400" y="115" text-anchor="middle" fill="#f0c27f" font-size="10" font-weight="600">KEBUTUHAN</text>
  <text x="400" y="130" text-anchor="middle" fill="#f0c27f" font-size="10" font-weight="600">SPIRITUAL</text>
  <line x1="400" y1="165" x2="400" y2="190" stroke="#f0c27f" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Left: Tradition -->
  <circle cx="220" cy="250" r="45" fill="#1e1e3a" stroke="#4facfe" stroke-width="1.5"/>
  <text x="220" y="245" text-anchor="middle" fill="#4facfe" font-size="10" font-weight="600">TRADISI</text>
  <text x="220" y="260" text-anchor="middle" fill="#4facfe" font-size="10" font-weight="600">AGAMA</text>
  <line x1="265" y1="250" x2="330" y2="250" stroke="#4facfe" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Right: AI Technology -->
  <circle cx="580" cy="250" r="45" fill="#1e1e3a" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="580" y="245" text-anchor="middle" fill="#00f2fe" font-size="10" font-weight="600">TEKNOLOGI</text>
  <text x="580" y="260" text-anchor="middle" fill="#00f2fe" font-size="10" font-weight="600">AI</text>
  <line x1="460" y1="250" x2="535" y2="250" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Bottom: Future -->
  <circle cx="400" cy="380" r="45" fill="#1e1e3a" stroke="#e8b04a" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" fill="#e8b04a" font-size="10" font-weight="600">MASA</text>
  <text x="400" y="390" text-anchor="middle" fill="#e8b04a" font-size="10" font-weight="600"> DEPAN</text>
  <line x1="400" y1="310" x2="400" y2="335" stroke="#e8b04a" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Connection lines from center -->
  <line x1="355" y1="235" x2="265" y2="240" stroke="#8888aa" stroke-width="1" opacity="0.5"/>
  <line x1="445" y1="235" x2="535" y2="240" stroke="#8888aa" stroke-width="1" opacity="0.5"/>
  
  <!-- Labels on connections -->
  <text x="300" y="230" text-anchor="middle" fill="#8888aa" font-size="8">ekspresi</text>
  <text x="500" y="230" text-anchor="middle" fill="#8888aa" font-size="8">media baru</text>
  
  <!-- Key insight box -->
  <rect x="150" y="440" width="500" height="0" rx="6" fill="none" stroke="#333355" stroke-width="1"/>
  <text x="400" y="455" text-anchor="middle" fill="#666688" font-size="9" font-style="italic">Mesin tidak bisa menjadi tujuan — hanya pelayan dalam pencarian makna</text>
</svg>
