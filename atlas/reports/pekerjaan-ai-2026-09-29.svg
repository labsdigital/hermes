<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">AI dan Masa Depan Pekerjaan</title>
  <desc id="desc">Diagram yang menunjukkan bagaimana AI mengubah hubungan manusia dengan pekerjaan, dari otonomi menuju dependensi algoritma.</desc>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">AI dan Masa Depan Pekerjaan</text>

  <!-- Left side: Human Worker -->
  <g transform="translate(100, 200)">
    <!-- Person silhouette -->
    <circle cx="0" cy="-50" r="35" fill="#58a6ff" opacity="0.9"/>
    <path d="M-40,20 Q0,-10 40,20 L40,80 L-40,80 Z" fill="#58a6ff" opacity="0.7"/>
    <!-- Arms -->
    <line x1="-50" y1="10" x2="-80" y2="40" stroke="#58a6ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="10" x2="80" y2="40" stroke="#58a6ff" stroke-width="6" stroke-linecap="round"/>
    <!-- Tools in hand -->
    <rect x="-95" y="30" width="20" height="50" rx="3" fill="#f0883e"/>
    <rect x="75" y="30" width="20" height="50" rx="3" fill="#f0883e"/>

    <!-- Label -->
    <text x="0" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8b949e">Manusia Otonom</text>
    <text x="0" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e7681">Membuat keputusan sendiri</text>
  </g>

  <!-- Center: AI Algorithm -->
  <g transform="translate(400, 200)">
    <!-- Gear/circle representing AI -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#a371f7" stroke-width="3" stroke-dasharray="8 4"/>
    <circle cx="0" cy="0" r="50" fill="#a371f7" opacity="0.15"/>
    <!-- Brain icon inside -->
    <path d="M-20,-10 Q-25,-30 -10,-35 Q0,-40 10,-30 Q20,-25 15,-10 Q20,5 10,15 Q0,25 -10,15 Q-25,5 -20,-10 Z" fill="none" stroke="#a371f7" stroke-width="2"/>
    <circle cx="-8" cy="-5" r="3" fill="#a371f7"/>
    <circle cx="8" cy="-5" r="3" fill="#a371f7"/>
    <path d="M-5,8 Q0,12 5,8" fill="none" stroke="#a371f7" stroke-width="1.5"/>

    <!-- Label -->
    <text x="0" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#d2a8ff">Algoritma AI</text>
    <text x="0" y="118" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e7681">Mengoptimalkan, memprediksi, mengarahkan</text>
  </g>

  <!-- Right side: Algorithm-Guided Worker -->
  <g transform="translate(700, 200)">
    <!-- Person silhouette - smaller, dependent -->
    <circle cx="0" cy="-30" r="25" fill="#f0883e" opacity="0.6"/>
    <path d="M-30,15 Q0,0 30,15 L30,60 L-30,60 Z" fill="#f0883e" opacity="0.45"/>
    <!-- No tools - hands empty/down -->
    <line x1="-35" y1="25" x2="-55" y2="50" stroke="#f0883e" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="35" y1="25" x2="55" y2="50" stroke="#f0883e" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- Connection lines to center AI -->
    <line x1="-30" y1="0" x2="0" y2="-10" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <line x1="30" y1="0" x2="0" y2="-10" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Label -->
    <text x="0" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8b949e">Manusia Terarah</text>
    <text x="0" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e7681">Mengikuti instruksi algoritma</text>
  </g>

  <!-- Arrows showing flow -->
  <path d="M180,200 L280,200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.6"/>
  <path d="M520,200 L620,200" stroke="#a371f7" stroke-width="2" marker-end="url(#arrowPurple)" opacity="0.6"/>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" opacity="0.7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a371f7" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Bottom: Key insight -->
  <rect x="150" y="370" width="500" height="80" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#e6edf3" font-weight="600">Transisi: Dari Otonomi ke Dependen</text>
  <text x="400" y="422" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8b949e">Mesin tidak menggantikan manusia — ia mengubah cara manusia bekerja dan menilai diri sendiri</text>

  <!-- Decorative data flow lines -->
  <path d="M50,300 Q150,280 200,310 T350,300" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <path d="M450,290 Q550,310 600,280 T750,300" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.2"/>
  <path d="M80,340 Q200,360 300,330 T500,350" fill="none" stroke="#f0883e" stroke-width="1" opacity="0.15"/>
</svg>