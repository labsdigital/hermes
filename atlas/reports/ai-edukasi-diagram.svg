<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Guru yang Tidak Pernah Tidur: Pendidikan di Era AI</title>
  <desc id="desc">Diagram konseptual tentang transformasi pendidikan oleh kecerdasan buatan, menunjukkan peran guru tradisional versus tutor AI.</desc>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Traditional Teacher -->
  <rect x="30" y="40" width="220" height="300" rx="15" fill="#fff" stroke="#8B4513" stroke-width="2"/>
  <text x="140" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#8B4513">Guru Tradisional</text>
  
  <!-- Blackboard -->
  <rect x="60" y="90" width="160" height="100" rx="5" fill="#2F4F4F" stroke="#8B4513" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#fff">Matematika</text>
  <text x="140" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#fff">Bahasa</text>
  <text x="140" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#fff">Ilmu Pengetahuan</text>
  
  <!-- Teacher figure -->
  <circle cx="140" cy="230" r="20" fill="#DEB887"/>
  <rect x="125" y="250" width="30" height="50" rx="5" fill="#8B4513"/>
  <line x1="125" y1="270" x2="100" y2="290" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="270" x2="180" y2="290" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Limitations -->
  <text x="140" y="325" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666">Waktu terbatas</text>
  <text x="140" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666">Satu untuk semua</text>
  
  <!-- AI Tutor -->
  <rect x="350" y="40" width="220" height="300" rx="15" fill="#fff" stroke="#4169E1" stroke-width="2"/>
  <text x="460" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#4169E1">AI Tutor</text>
  
  <!-- Screen -->
  <rect x="380" y="90" width="160" height="100" rx="5" fill="#1a1a2e" stroke="#4169E1" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#00FF00">AI Assistant</text>
  <text x="460" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#00FF00">Adaptive Learning</text>
  <text x="460" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#00FF00">24/7 Available</text>
  
  <!-- Circuit pattern -->
  <path d="M390 200 L420 200 L420 230 L460 230" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <path d="M390 215 L410 215 L410 245 L450 245" fill="none" stroke="#9370DB" stroke-width="1.5"/>
  <circle cx="460" cy="230" r="4" fill="#4169E1"/>
  <circle cx="450" cy="245" r="4" fill="#9370DB"/>
  
  <!-- Advantages -->
  <text x="460" y="325" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666">Personalisasi</text>
  <text x="460" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666">Tersedia 24/7</text>
  
  <!-- Center: Bridge -->
  <path d="M250 190 Q300 160 350 190" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="300" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#333">Kolaborasi</text>
  
  <!-- Bottom insight -->
  <rect x="100" y="370" width="400" height="25" rx="5" fill="#fff" stroke="#ddd"/>
  <text x="300" y="387" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666">Guru + AI = Pendidikan yang Lebih Baik</text>
</svg>
