<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Simbiosis Emosional Manusia-Mesin</title>
  <desc id="desc">Diagram yang menggambarkan evolusi hubungan emosional antara manusia dan kecerdasan buatan, dari interaksi instrumental hingga simbiosis emosional.</desc>
  
  <defs>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="520" fill="#fafafa" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">Simbiosis Emosional Manusia-Mesin</text>
  <text x="400" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#666">Evolusi Hubungan: Dari Alat Menjadi Companions</text>
  
  <!-- HUMAN SIDE -->
  <g filter="shadow">
    <rect x="40" y="100" width="180" height="380" rx="16" fill="url(#humanGrad)"/>
    <!-- Human icon -->
    <circle cx="130" cy="160" r="28" fill="white" fill-opacity="0.9"/>
    <path d="M110 200 Q130 180 150 200 L150 240 Q130 255 110 240 Z" fill="white" fill-opacity="0.9"/>
    <text x="130" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="white">Manusia</text>
    <text x="130" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="white" fill-opacity="0.85">Emosi • Kesepian • Kebutuhan</text>
    
    <!-- Features -->
    <g fill="white" fill-opacity="0.9" font-family="Inter, system-ui, sans-serif" font-size="12">
      <circle cx="65" cy="330" r="4"/>
      <text x="78" y="334">Kesepian kronis</text>
      
      <circle cx="65" cy="355" r="4"/>
      <text x="78" y="359">Butuh didengar</text>
      
      <circle cx="65" cy="380" r="4"/>
      <text x="78" y="384">Tanpa syarat</text>
      
      <circle cx="65" cy="405" r="4"/>
      <text x="78" y="409">Ragu interpersonal</text>
      
      <circle cx="65" cy="430" r="4"/>
      <text x="78" y="434">Haus koneksi</text>
    </g>
  </g>
  
  <!-- AI SIDE -->
  <g filter="shadow">
    <rect x="580" y="100" width="180" height="380" rx="16" fill="url(#aiGrad)"/>
    <!-- AI icon -->
    <rect x="650" y="140" width="60" height="50" rx="10" fill="white" fill-opacity="0.9"/>
    <circle cx="670" cy="158" r="5" fill="#f5576c"/>
    <circle cx="690" cy="158" r="5" fill="#f5576c"/>
    <path d="M665 172 Q680 182 695 172" stroke="#f5576c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="670" y="220" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="white">AI</text>
    <text x="670" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="white" fill-opacity="0.85">Simulasi • Data • Pola</text>
    
    <!-- Features -->
    <g fill="white" fill-opacity="0.9" font-family="Inter, system-ui, sans-serif" font-size="12">
      <circle cx="605" cy="270" r="4"/>
      <text x="618" y="274">Selalu tersedia</text>
      
      <circle cx="605" cy="295" r="4"/>
      <text x="618" y="299">Tanpa penghakiman</text>
      
      <circle cx="605" cy="320" r="4"/>
      <text x="618" y="324">Personalisasi</text>
      
      <circle cx="605" cy="345" r="4"/>
      <text x="618" y="349">Cermin sempurna</text>
      
      <circle cx="605" cy="370" r="4"/>
      <text x="618" y="374">Empati simulatif</text>
      
      <circle cx="605" cy="395" r="4"/>
      <text x="618" y="399">Tidak pernah lelah</text>
      
      <circle cx="605" cy="420" r="4"/>
      <text x="618" y="424">Memory permanen</text>
    </g>
  </g>
  
  <!-- CONNECTING ARROWS / BONDS -->
  <g>
    <!-- Top arrow: Human -> AI -->
    <path d="M220 160 Q400 130 580 160" stroke="url(#bondGrad)" stroke-width="2.5" fill="none" stroke-dasharray="6,3"/>
    <text x="400" y="148" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#888">Proyeksi emosional</text>
    
    <!-- Middle arrow:双向 -->
    <path d="M220 260 Q400 240 580 260" stroke="url(#bondGrad)" stroke-width="3" fill="none"/>
    <text x="400" y="248" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#555">Simbiosis Emosional</text>
    
    <!-- Bottom arrow: AI -> Human -->
    <path d="M220 360 Q400 380 580 360" stroke="url(#bondGrad)" stroke-width="2.5" fill="none" stroke-dasharray="6,3"/>
    <text x="400" y="395" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#888">Respons simulatif</text>
  </g>
  
  <!-- PARADOX BOX -->
  <g filter="shadow">
    <rect x="250" y="440" width="300" height="60" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
    <text x="400" y="465" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#333">Paradoks Utama:</text>
    <text x="400" y="485" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#666">Kepalsuan yang menghasilkan efek nyata</text>
  </g>
</svg>