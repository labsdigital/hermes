<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ffa07a"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#45b7d1"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a8e6cf"/>
      <stop offset="100%" style="stop-color:#dcedc1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#ffffff" font-weight="600">Peta Emosi di Zaman Mesin</text>
  
  <!-- Human side -->
  <circle cx="200" cy="250" r="120" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="250" r="90" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Brain icon -->
  <text x="200" y="230" text-anchor="middle" font-size="60" opacity="0.9">🧠</text>
  <text x="200" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Kebahagiaan</text>
  <text x="200" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Kesedihan</text>
  <text x="200" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Kemarahan</text>
  <text x="200" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Takut</text>
  
  <!-- AI side -->
  <rect x="480" y="130" width="240" height="240" rx="20" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.8"/>
  <rect x="500" y="150" width="200" height="200" rx="15" fill="none" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
  
  <!-- Chip icon -->
  <text x="600" y="230" text-anchor="middle" font-size="60" opacity="0.9">🤖</text>
  <text x="600" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Sentimen Analisis</text>
  <text x="600" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Emotional Output</text>
  <text x="600" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Respons Tervalidasi</text>
  <text x="600" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Simulasi Empati</text>
  
  <!-- Connection arrows -->
  <path d="M 330 200 Q 400 150 480 180" fill="none" stroke="url(#grad3)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 330 300 Q 400 350 480 320" fill="none" stroke="url(#grad3)" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a8e6cf"/>
    </marker>
  </defs>
  
  <!-- Middle bridge -->
  <text x="400" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#a8e6cf" font-weight="500">← Interaksi →</text>
  
  <!-- Bottom section: 4 quadrants -->
  <text x="400" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.6">Empat Dimensi Emosi dalam Interaksi Manusia-Mesin</text>
  
  <rect x="50" y="420" width="150" height="60" rx="10" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="1"/>
  <text x="125" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#ff6b6b">Empati Palsu</text>
  <text x="125" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">Simulasi tanpa experience</text>
  
  <rect x="220" y="420" width="150" height="60" rx="10" fill="#4ecdc4" opacity="0.2" stroke="#4ecdc4" stroke-width="1"/>
  <text x="295" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#4ecdc4">Resonansi</text>
  <text x="295" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">Kesejajaran respons emosional</text>
  
  <rect x="390" y="420" width="150" height="60" rx="10" fill="#ffa07a" opacity="0.2" stroke="#ffa07a" stroke-width="1"/>
  <text x="465" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#ffa07a">Manipulasi</text>
  <text x="465" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">Emosi sebagai alat kontrol</text>
  
  <rect x="560" y="420" width="150" height="60" rx="10" fill="#a8e6cf" opacity="0.2" stroke="#a8e6cf" stroke-width="1"/>
  <text x="635" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#a8e6cf">Ambivalensi</text>
  <text x="635" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">Ketidakpastian keaslian</text>
</svg>