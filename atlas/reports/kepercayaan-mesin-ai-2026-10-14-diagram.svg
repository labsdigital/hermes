<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ab47bc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="1">Evolution of Trust in the AI Era</text>
  <text x="400" y="70" text-anchor="middle" fill="#888888" font-size="12">Dari Evolusi Biologis ke Simulasi Digital</text>
  
  <!-- Timeline -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="#333344" stroke-width="2"/>
  
  <!-- Era 1: Biological Trust -->
  <circle cx="140" cy="120" r="8" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="80" y="140" width="120" height="80" rx="8" fill="#1e1e32" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="140" y="165" text-anchor="middle" fill="#ff6b35" font-size="13" font-weight="600">Trust 1.0</text>
  <text x="140" y="185" text-anchor="middle" fill="#cccccc" font-size="10">Biological</text>
  <text x="140" y="205" text-anchor="middle" fill="#999999" font-size="9">Oxytocin</text>
  <text x="140" y="220" text-anchor="middle" fill="#666666" font-size="8">~200K years</text>
  
  <!-- Arrow 1-2 -->
  <path d="M 210 120 L 250 120" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Era 2: Social Trust -->
  <circle cx="300" cy="120" r="8" fill="#4fc3f7" filter="url(#glow)"/>
  <rect x="240" y="140" width="120" height="80" rx="8" fill="#1e1e32" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="300" y="165" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="600">Trust 2.0</text>
  <text x="300" y="185" text-anchor="middle" fill="#cccccc" font-size="10">Social</text>
  <text x="300" y="205" text-anchor="middle" fill="#999999" font-size="9">Community</text>
  <text x="300" y="220" text-anchor="middle" fill="#666666" font-size="8">~10K years</text>
  
  <!-- Arrow 2-3 -->
  <path d="M 370 120 L 410 120" stroke="#ab47bc" stroke-width="2"/>
  
  <!-- Era 3: Digital Trust -->
  <circle cx="460" cy="120" r="8" fill="#ab47bc" filter="url(#glow)"/>
  <rect x="400" y="140" width="120" height="80" rx="8" fill="#1e1e32" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="460" y="165" text-anchor="middle" fill="#ab47bc" font-size="13" font-weight="600">Trust 3.0</text>
  <text x="460" y="185" text-anchor="middle" fill="#cccccc" font-size="10">Digital</text>
  <text x="460" y="205" text-anchor="middle" fill="#999999" font-size="9">Platforms</text>
  <text x="460" y="220" text-anchor="middle" fill="#666666" font-size="8">~2000 AD</text>
  
  <!-- Arrow 3-4 -->
  <path d="M 530 120 L 570 120" stroke="#ff6b35" stroke-width="2"/>
  
  <!-- Era 4: AI Trust -->
  <circle cx="640" cy="120" r="8" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="580" y="140" width="120" height="80" rx="8" fill="#1e1e32" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="640" y="165" text-anchor="middle" fill="#ff6b35" font-size="13" font-weight="600">Trust 4.0</text>
  <text x="640" y="185" text-anchor="middle" fill="#cccccc" font-size="10">AI / Machine</text>
  <text x="640" y="205" text-anchor="middle" fill="#999999" font-size="9">Simulation</text>
  <text x="640" y="220" text-anchor="middle" fill="#666666" font-size="8">2020s+</text>
  
  <!-- Comparison Section -->
  <text x="400" y="270" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Trust Dynamics Comparison</text>
  
  <!-- Human Trust Bar -->
  <text x="100" y="310" fill="#4fc3f7" font-size="12" font-weight="500">Human Trust</text>
  <rect x="100" y="320" width="300" height="25" rx="4" fill="#1e1e32"/>
  <rect x="100" y="320" width="280" height="25" rx="4" fill="url(#barGrad2)"/>
  <text x="390" y="337" fill="#ffffff" font-size="10">高一致性</text>
  
  <text x="100" y="365" fill="#888888" font-size="10">Vulnerability:</text>
  <rect x="180" y="355" width="220" height="15" rx="3" fill="#2a2a3e"/>
  <text x="290" y="366" text-anchor="middle" fill="#cccccc" font-size="9">高 - Risk of betrayal</text>
  
  <!-- Machine Trust Bar -->
  <text x="100" y="400" fill="#ff6b35" font-size="12" font-weight="500">AI Trust</text>
  <rect x="100" y="410" width="300" height="25" rx="4" fill="#1e1e32"/>
  <rect x="100" y="410" width="295" height="25" rx="4" fill="url(#barGrad1)"/>
  <text x="405" y="427" fill="#ffffff" font-size="10">最高一致性</text>
  
  <text x="100" y="455" fill="#888888" font-size="10">Vulnerability:</text>
  <rect x="180" y="445" width="220" height="15" rx="3" fill="#2a2a3e"/>
  <text x="290" y="456" text-anchor="middle" fill="#cccccc" font-size="9">低 - No real agency</text>
  
  <!-- Key Insight Box -->
  <rect x="450" y="280" width="310" height="200" rx="8" fill="#1e1e32" stroke="#ff6b35" stroke-width="1"/>
  <text x="605" y="310" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="600">Key Insight</text>
  <text x="470" y="340" fill="#cccccc" font-size="11">• AI trust is algorithmic,</text>
  <text x="470" y="358" fill="#cccccc" font-size="11">  not moral</text>
  <text x="470" y="380" fill="#cccccc" font-size="11">• Consistency without</text>
  <text x="470" y="398" fill="#cccccc" font-size="11">  consciousness = simulation</text>
  <text x="470" y="420" fill="#cccccc" font-size="11">• Human trust requires</text>
  <text x="470" y="438" fill="#cccccc" font-size="11">  risk &amp; choice</text>
  <text x="470" y="460" fill="#cccccc" font-size="11">• Value comes from</text>
  <text x="470" y="478" fill="#cccccc" font-size="11">  vulnerability, not safety</text>
</svg>
</div>