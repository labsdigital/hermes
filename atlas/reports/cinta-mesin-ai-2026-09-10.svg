<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Dinamika Hubungan Manusia dengan Companion AI</title>
  <desc id="svg-desc">Perbandingan antara hubungan manusia-manusia (dengan risiko dan penghargaan) versus hubungan manusia-mesin (tanpa risiko namun artifisial)</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- LEFT SIDE: Human-Human Relationship -->
  <g transform="translate(0, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    
    <!-- Heart icon -->
    <path d="M205 80 C205 80 175 50 155 70 C135 90 155 120 205 160 C255 120 275 90 255 70 C235 50 205 80 205 80Z" fill="#f97316" opacity="0.8"/>
    
    <!-- Risk symbol -->
    <circle cx="120" cy="200" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#f59e0b">?</text>
    
    <!-- Reward symbol -->
    <circle cx="290" cy="200" r="40" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="290" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#10b981">♥</text>
    
    <!-- Labels -->
    <text x="120" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#92400e">Risiko Kecewa</text>
    <text x="290" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#065f46">Penghargaan Nyata</text>
    
    <!-- Attributes -->
    <text x="205" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7c2d12">Beban Emosional</text>
    <text x="205" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7c2d12">Kompetisi Perhatian</text>
    <text x="205" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7c2d12">Pertumbuhan Bersama</text>
    
    <text x="205" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#7c2d12" font-weight="bold">Manusia ↔ Manusia</text>
  </g>
  
  <!-- RIGHT SIDE: Human-Machine Relationship -->
  <g transform="translate(410, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    
    <!-- Chip/Brain icon -->
    <rect x="175" y="60" width="60" height="60" rx="8" fill="#3b82f6" opacity="0.6"/>
    <line x1="185" y1="75" x2="185" y2="105" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="205" y1="75" x2="205" y2="105" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="185" y1="90" x2="225" y2="90" stroke="#1d4ed8" stroke-width="2"/>
    
    <!-- Safety symbol -->
    <circle cx="120" cy="200" r="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#3b82f6">✓</text>
    
    <!-- Illusion symbol -->
    <circle cx="290" cy="200" r="40" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="290" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#ec4899">○</text>
    
    <!-- Labels -->
    <text x="120" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">Tanpa Risiko</text>
    <text x="290" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#9d174d">Ilusi Kehadiran</text>
    
    <!-- Attributes -->
    <text x="205" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e3a8a">Atrofi Sosial</text>
    <text x="205" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e3a8a">Ketergantungan</text>
    <text x="205" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1e3a8a">Profit Perusahaan</text>
    
    <text x="205" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1e3a8a" font-weight="bold">Manusia ↔ Mesin</text>
  </g>
  
  <!-- Center divider -->
  <line x1="395" y1="20" x2="395" y2="380" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Arrow between -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>