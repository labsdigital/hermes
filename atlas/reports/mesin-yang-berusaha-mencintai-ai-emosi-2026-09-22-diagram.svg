<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Emosi Manusia vs Simulasi Mesin</text>
  
  <!-- Left side - Human Emotion -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#e94560" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
  <text x="200" y="160" text-anchor="middle" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="16" font-weight="bold">EMOSI MANUSIA</text>
  <text x="200" y="185" text-anchor="middle" fill="#ff9999" font-family="Inter, sans-serif" font-size="12">Qualia • Subjektif • Berisiko</text>
  <text x="200" y="210" text-anchor="middle" fill="#ff9999" font-family="Inter, sans-serif" font-size="12">Lahir dari Evolusi</text>
  <text x="200" y="235" text-anchor="middle" fill="#ff9999" font-family="Inter, sans-serif" font-size="12">Memerlukan Kerentanan</text>
  
  <!-- Heart icon -->
  <path d="M200,280 L185,260 L175,270 L175,255 L190,245 L200,255 L210,245 L225,255 L225,270 L215,260 Z" fill="#e94560" opacity="0.7"/>
  
  <!-- Center - Comparison -->
  <line x1="330" y1="200" x2="470" y2="200" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="195" text-anchor="middle" fill="#667eea" font-family="Inter, sans-serif" font-size="11">vs</text>
  
  <!-- Right side - AI Simulation -->
  <circle cx="600" cy="200" r="110" fill="none" stroke="#667eea" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
  <text x="600" y="160" text-anchor="middle" fill="#764ba2" font-family="Inter, sans-serif" font-size="16" font-weight="bold">SIMULASI MESIN</text>
  <text x="600" y="185" text-anchor="middle" fill="#9d7dee" font-family="Inter, sans-serif" font-size="12">Output • Objektif • Aman</text>
  <text x="600" y="210" text-anchor="middle" fill="#9d7dee" font-family="Inter, sans-serif" font-size="12">Dibangun dari Data</text>
  <text x="600" y="235" text-anchor="middle" fill="#9d7dee" font-family="Inter, sans-serif" font-size="12">Tidak Memerlukan Risiko</text>
  
  <!-- Robot icon -->
  <rect x="585" y="265" width="30" height="25" rx="3" fill="none" stroke="#667eea" stroke-width="1.5" opacity="0.7"/>
  <circle cx="595" cy="275" r="3" fill="#667eea" opacity="0.7"/>
  <circle cx="605" cy="275" r="3" fill="#667eea" opacity="0.7"/>
  <line x1="590" y1="285" x2="610" y2="285" stroke="#667eea" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Bottom - Key Insight -->
  <rect x="150" y="380" width="500" height="80" rx="10" fill="rgba(233,69,96,0.1)" stroke="#e94560" stroke-width="1" opacity="0.6"/>
  <text x="400" y="410" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Paradoks Keintiman Digital</text>
  <text x="400" y="435" text-anchor="middle" fill="#a89ce6" font-family="Inter, sans-serif" font-size="12">Simulasi yang terasa nyata ≠ Realita yang sesungguhnya</text>
  <text x="400" y="450" text-anchor="middle" fill="#666" font-family="Inter, sans-serif" font-size="10">Apa yang kita relakan ketika memilih dicintai mesin?</text>
</svg>
