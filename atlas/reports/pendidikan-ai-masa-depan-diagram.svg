<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="20" font-weight="600">Transformasi Pendidikan oleh AI</text>
  
  <!-- Traditional Education Box -->
  <rect x="50" y="120" width="180" height="120" rx="12" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="600">TRADISIONAL</text>
  <text x="140" y="180" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Guru → Murid</text>
  <text x="140" y="200" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Kurikulum Seragam</text>
  <text x="140" y="220" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Penilaian Standar</text>
  
  <!-- AI Education Box -->
  <rect x="570" y="120" width="180" height="120" rx="12" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="660" y="155" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="600">AI-DRIVEN</text>
  <text x="660" y="180" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Personalisasi</text>
  <text x="660" y="200" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Adaptif Real-time</text>
  <text x="660" y="220" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="11">Analisis Belajar</text>
  
  <!-- Arrow between boxes -->
  <path d="M 230 180 L 560 180" stroke="url(#arrow)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e94560"/>
    </marker>
  </defs>
  
  <!-- Central Node: Human Elements -->
  <circle cx="400" cy="320" r="80" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
  <text x="400" y="310" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="600">ELEMEN MANUSIA</text>
  <text x="400" y="335" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="11">Kritik • Empati •</text>
  <text x="400" y="352" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="11">Kreativitas •</text>
  <text x="400" y="369" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="11">Pertanyaan</text>
  
  <!-- Connecting lines from boxes to center -->
  <line x1="140" y1="240" x2="340" y2="300" stroke="#e94560" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="660" y1="240" x2="460" y2="300" stroke="#e94560" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Warning text -->
  <text x="400" y="450" text-anchor="middle" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="12">⚠ Jangan biarkan mesin menggantikan manusia yang bertanya</text>
</svg>