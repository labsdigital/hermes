<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Sekolah yang Mengajarkan Mesin</title>
  <desc id="desc">Ilustrasi tentang perubahan peran guru dan siswa di era AI: dari mimbar tradisional ke layar digital</desc>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">Mimbar yang Berpindah</text>
  
  <!-- Traditional School -->
  <g id="traditional" transform="translate(50, 60)">
    <!-- Building -->
    <rect x="0" y="50" width="180" height="120" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
    <!-- Roof -->
    <polygon points="0,50 90,10 180,50" fill="#F59E0B"/>
    <!-- Door -->
    <rect x="70" y="110" width="40" height="60" fill="#92400E"/>
    <!-- Windows -->
    <rect x="15" y="70" width="35" height="35" fill="#BFDBFE"/>
    <rect x="130" y="70" width="35" height="35" fill="#BFDBFE"/>
    <!-- Teacher figure -->
    <circle cx="90" cy="95" r="12" fill="#1F2937"/>
    <rect x="82" y="107" width="16" height="25" fill="#1F2937"/>
    <!-- Students (simplified) -->
    <circle cx="30" cy="145" r="8" fill="#6B7280"/>
    <circle cx="60" cy="145" r="8" fill="#6B7280"/>
    <circle cx="120" cy="145" r="8" fill="#6B7280"/>
    <circle cx="150" cy="145" r="8" fill="#6B7280"/>
    <!-- Label -->
    <text x="90" y="190" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#4B5563">Sekolah Tradisional</text>
    <text x="90" y="205" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">Kehadiran fisik</text>
  </g>
  
  <!-- AI Classroom -->
  <g id="ai-class" transform="translate(370, 60)">
    <!-- Screen -->
    <rect x="20" y="30" width="140" height="100" fill="#1F2937" stroke="#374151" stroke-width="2"/>
    <!-- Screen glow -->
    <rect x="25" y="35" width="130" height="90" fill="#3B82F6" opacity="0.3"/>
    <!-- AI face (simplified) -->
    <circle cx="90" cy="70" r="25" fill="#3B82F6"/>
    <circle cx="80" cy="65" r="4" fill="#1F2937"/>
    <circle cx="100" cy="65" r="4" fill="#1F2937"/>
    <path d="M 80 80 Q 90 90 100 80" stroke="#1F2937" stroke-width="2" fill="none"/>
    <!-- Student with device -->
    <circle cx="90" cy="160" r="15" fill="#6B7280"/>
    <rect x="75" y="175" width="30" height="40" fill="#6B7280"/>
    <!-- Device -->
    <rect x="70" y="140" width="40" height="25" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <!-- Label -->
    <text x="90" y="235" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#4B5563">Kelas AI</text>
    <text x="90" y="250" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">Tanpa kehadiran</text>
  </g>
  
  <!-- Arrow showing transition -->
  <g id="arrow" transform="translate(240, 140)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#EF4444" stroke-width="3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
      </marker>
    </defs>
    <text x="60" y="-10" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#EF4444">Perubahan</text>
  </g>
  
  <!-- Key insight box -->
  <g id="insight" transform="translate(100, 300)">
    <rect x="0" y="0" width="400" height="70" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="8"/>
    <text x="200" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400E">Pertanyaan Kunci</text>
    <text x="200" y="48" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#78350F">Ketika pengetahuan tersedia instan, apa yang hilang dari proses belajar?</text>
  </g>
</svg>