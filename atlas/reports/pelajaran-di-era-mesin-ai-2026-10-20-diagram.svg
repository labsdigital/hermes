<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a08d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#ffffff" opacity="0.9">Pendidikan di Era Mesin Cerdas</text>
  
  <!-- Left side - Traditional Education -->
  <rect x="40" y="80" width="220" height="380" rx="12" fill="#1e1e3a" stroke="#3a3a5c" stroke-width="1"/>
  <text x="150" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ff6b35">Tradisional</text>
  
  <!-- Traditional icons -->
  <rect x="70" y="140" width="160" height="60" rx="8" fill="#2a2a4a"/>
  <text x="150" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#a0a0c0">Guru → Murid</text>
  <text x="150" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#707090">(Transfer Satu Arah)</text>
  
  <rect x="70" y="220" width="160" height="60" rx="8" fill="#2a2a4a"/>
  <text x="150" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#a0a0c0">Hafalan & Ulangan</text>
  <text x="150" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#707090">(Fakta Terstruktur)</text>
  
  <rect x="70" y="300" width="160" height="60" rx="8" fill="#2a2a4a"/>
  <text x="150" y="325" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#a0a0c0">Satu Untuk Semua</text>
  <text x="150" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#707090">(Kurikulum Seragam)</text>
  
  <!-- Center - AI Revolution -->
  <circle cx="400" cy="250" r="100" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="400" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#ff6b35">AI</text>
  <text x="400" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#f7931e">Revolusi</text>
  
  <!-- Arrows -->
  <path d="M 260 250 L 290 250" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 510 250 L 540 250" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Right side - AI-Enhanced Education -->
  <rect x="540" y="80" width="220" height="380" rx="12" fill="#1e1e3a" stroke="#3a3a5c" stroke-width="1"/>
  <text x="650" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#4ecdc4">Era Baru</text>
  
  <!-- AI icons -->
  <rect x="570" y="140" width="160" height="60" rx="8" fill="#2a2a4a"/>
  <text x="650" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#a0a0c0">Personalisasi</text>
  <text x="650" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#707090">(Sesuai Kecepatan Individu)</text>
  
  <rect x="570" y="220" width="160" height="60" rx="8" fill="#2a2a4a"/>
  <text x="650" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#a0a0c0">Berpikir Kritis</text>
  <text x="650" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#707090">(Evaluasi & Analisis)</text>
  
  <rect x="570" y="300" width="160" height="60" rx="8" fill="#2a2a4a"/>
  <text x="650" y="325" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#a0a0c0">Manusia Sentris</text>
  <text x="650" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#707090">(Empati & Makna)</text>
  
  <!-- Bottom insight -->
  <rect x="200" y="450" width="400" height="36" rx="6" fill="#2a2a4a"/>
  <text x="400" y="473" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#a0a0c0">Tujuan: Bukan Pekerja Efisien, Tapi Manusia Utuh</text>
</svg>
</div>
