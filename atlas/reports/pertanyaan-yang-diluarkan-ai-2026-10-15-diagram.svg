<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Pendidikan: Dari Dialectica ke AI</text>
  
  <!-- Timeline flow -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#3a3a5c" stroke-width="3" stroke-dasharray="8,4"/>
  
  <!-- Phase 1: Dialectica -->
  <circle cx="140" cy="250" r="35" fill="#ff6b35" opacity="0.9"/>
  <text x="140" y="245" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">350 SM</text>
  <text x="140" y="265" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10">Dialectica</text>
  
  <rect x="60" y="310" width="160" height="80" rx="8" fill="#1e1e3a" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="140" y="335" text-anchor="middle" fill="#ff6b35" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Pertanyaan</text>
  <text x="140" y="355" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">Socrates &amp; Plato</text>
  <text x="140" y="375" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">Seni bertanya</text>
  
  <!-- Arrow -->
  <path d="M 230 250 L 250 250" fill="none" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 2: Industrial -->
  <circle cx="320" cy="250" r="35" fill="#4a90d9" opacity="0.9"/>
  <text x="320" y="245" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">1800</text>
  <text x="320" y="265" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10">Industri</text>
  
  <rect x="240" y="310" width="160" height="80" rx="8" fill="#1e1e3a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="320" y="335" text-anchor="middle" fill="#4a90d9" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Jawaban</text>
  <text x="320" y="355" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">Kurikulum standar</text>
  <text x="320" y="375" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">Penghafalan</text>
  
  <!-- Arrow -->
  <path d="M 410 250 L 430 250" fill="none" stroke="#4a90d9" stroke-width="2"/>
  
  <!-- Phase 3: AI -->
  <circle cx="500" cy="250" r="35" fill="#ff6b35" opacity="0.9"/>
  <text x="500" y="245" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">2023+</text>
  <text x="500" y="265" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10">AI Era</text>
  
  <rect x="420" y="310" width="160" height="80" rx="8" fill="#1e1e3a" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="500" y="335" text-anchor="middle" fill="#ff6b35" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Pertanyaan</text>
  <text x="500" y="355" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">AI + Manusia</text>
  <text x="500" y="375" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">Kreasi &amp; Kritik</text>
  
  <!-- Arrow -->
  <path d="M 590 250 L 610 250" fill="none" stroke="#ff6b35" stroke-width="2"/>
  
  <!-- Phase 4: Future -->
  <circle cx="680" cy="250" r="35" fill="#f7931e" opacity="0.9"/>
  <text x="680" y="245" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Masa Depan</text>
  
  <rect x="600" y="310" width="160" height="80" rx="8" fill="#1e1e3a" stroke="#f7931e" stroke-width="1.5"/>
  <text x="680" y="335" text-anchor="middle" fill="#f7931e" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Equilibrium</text>
  <text x="680" y="355" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">Pertanyaan + Jawaban</text>
  <text x="680" y="375" text-anchor="middle" fill="#b8b8d0" font-family="Inter, system-ui, sans-serif" font-size="10">Manusia &amp; Mesin</text>
  
  <!-- Bottom note -->
  <text x="400" y="440" text-anchor="middle" fill="#8888aa" font-family="Inter, system-ui, sans-serif" font-size="11">Siklus Pendidikan: Dari Pertanyaan → Jawaban → Pertanyaan</text>
  <text x="400" y="460" text-anchor="middle" fill="#6666aa" font-family="Inter, system-ui, sans-serif" font-size="10">Mesin menjawab semua pertanyaan. Manusia kembali bertanya.</text>
</svg>
</div>
