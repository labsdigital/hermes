<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Tangan Tanpa Rasa: Agen Ekonomi Tanpa Kesadaran</title>
  <desc id="svg-desc">Diagram yang menunjukkan kontras antara manusia dengan kesadaran subjektif dan agen AI yang beroperasi tanpa pengalaman internal di ekosistem ekonomi otonom.</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- LEFT SIDE: Human with consciousness -->
  <g transform="translate(0, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    
    <!-- Human figure (abstract) -->
    <circle cx="205" cy="100" r="45" fill="#fdba74" opacity="0.8"/>
    <path d="M160 160 Q205 200 250 160 L240 280 Q205 300 170 280 Z" fill="#fb923c" opacity="0.7"/>
    
    <!-- Thought bubbles representing consciousness -->
    <circle cx="140" cy="70" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="270" cy="70" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="205" cy="50" r="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    
    <!-- Connection lines to bubbles -->
    <line x1="170" y1="80" x2="150" y2="75" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="240" y1="80" x2="260" y2="75" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="205" y1="65" x2="205" y2="68" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
    
    <!-- Labels -->
    <text x="205" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7c2d12" font-weight="bold">Manusia</text>
    <text x="205" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#92400e">Kesadaran Subjektif</text>
    <text x="205" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#b45309">Pengalaman • Makna • Rasa</text>
  </g>
  
  <!-- RIGHT SIDE: AI Agent without consciousness -->
  <g transform="translate(410, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    
    <!-- AI chip representation -->
    <rect x="155" y="70" width="100" height="100" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="170" y="85" width="70" height="70" rx="5" fill="#dbeafe"/>
    
    <!-- Circuit lines -->
    <line x1="155" y1="100" x2="130" y2="100" stroke="#3b82f6" stroke-width="2"/>
    <line x1="155" y1="130" x2="130" y2="130" stroke="#3b82f6" stroke-width="2"/>
    <line x1="255" y1="100" x2="280" y2="100" stroke="#3b82f6" stroke-width="2"/>
    <line x1="255" y1="130" x2="280" y2="130" stroke="#3b82f6" stroke-width="2"/>
    <line x1="205" y1="70" x2="205" y2="50" stroke="#3b82f6" stroke-width="2"/>
    <line x1="205" y1="170" x2="205" y2="190" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Empty circles (no consciousness) -->
    <circle cx="120" cy="60" r="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="290" cy="60" r="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="205" cy="40" r="14" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
    
    <!-- X marks on empty circles -->
    <line x1="115" y1="55" x2="125" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="125" y1="55" x2="115" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="285" y1="55" x2="295" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="295" y1="55" x2="285" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="200" y1="35" x2="210" y2="45" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="210" y1="35" x2="200" y2="45" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Labels -->
    <text x="205" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e3a8a" font-weight="bold">Agen AI</text>
    <text x="205" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e40af">Tanpa Kesadaran</text>
    <text x="205" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1d4ed8">Optimasi • Eksekusi • Tanpa Rasa</text>
  </g>
  
  <!-- Center divider -->
  <line x1="395" y1="20" x2="395" y2="380" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Arrow showing one-way flow (human creates, agent executes) -->
  <path d="M 395 180 L 420 200 L 395 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">Delegasi</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Bottom caption -->
  <text x="400" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#94a3b8">Ekonomi Agentic: Aktivitas tanpa subyek pengalaman</text>
</svg>
