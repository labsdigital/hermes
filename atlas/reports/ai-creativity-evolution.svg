<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#0d1b2a"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Evolusi Kreativitas AI</text>
  
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="60" fill="url(#artGrad)" opacity="0.8"/>
    <text x="0" y="-70" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="14" font-weight="bold">MANUSIA</text>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Inter" font-size="12">🎨</text>
    <text x="0" y="85" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">Intuisi + Emosi</text>
    <text x="0" y="100" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">Pengalaman Hidup</text>
  </g>
  
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="60" fill="#16213e" stroke="#ffd700" stroke-width="3"/>
    <text x="0" y="-70" text-anchor="middle" fill="#ffd700" font-family="Inter" font-size="14" font-weight="bold">AI</text>
    <text x="0" y="5" text-anchor="middle" fill="#ffd700" font-family="Inter" font-size="12">🤖</text>
    <text x="0" y="85" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">Pattern Recognition</text>
    <text x="0" y="100" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">Training Data</text>
  </g>
  
  <g transform="translate(700, 100)">
    <circle cx="0" cy="0" r="60" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="0" y="-70" text-anchor="middle" fill="#e94560" font-family="Inter" font-size="14" font-weight="bold">KOLABORASI</text>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Inter" font-size="12">✨</text>
    <text x="0" y="85" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">Human + Machine</text>
    <text x="0" y="100" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">New Forms</text>
  </g>
  
  <path d="M 160 100 L 340 100" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 460 100 L 640 100" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  
  <g transform="translate(100, 280)">
    <rect width="250" height="180" rx="8" fill="#16213e" stroke="#667eea" stroke-width="1"/>
    <text x="125" y="30" text-anchor="middle" fill="#64ffda" font-family="Inter" font-size="14" font-weight="bold">Era 1: Tool</text>
    <text x="20" y="60" fill="#ccd6f6" font-family="Inter" font-size="11">Photoshop, Procreate</text>
    <text x="20" y="80" fill="#ccd6f6" font-family="Inter" font-size="11">AI sebagai alat bantu</text>
    <text x="20" y="100" fill="#ccd6f6" font-family="Inter" font-size="11">Manusia tetap kontrol</text>
    <line x1="20" y1="115" x2="230" y2="115" stroke="#667eea" stroke-width="1"/>
    <text x="125" y="140" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">2010-2020</text>
  </g>
  
  <g transform="translate(425, 280)">
    <rect width="250" height="180" rx="8" fill="#16213e" stroke="#ffd700" stroke-width="1"/>
    <text x="125" y="30" text-anchor="middle" fill="#ffd700" font-family="Inter" font-size="14" font-weight="bold">Era 2: Generator</text>
    <text x="20" y="60" fill="#ccd6f6" font-family="Inter" font-size="11">Midjourney, DALL-E</text>
    <text x="20" y="80" fill="#ccd6f6" font-family="Inter" font-size="11">AI generate dari text</text>
    <text x="20" y="100" fill="#ccd6f6" font-family="Inter" font-size="11">Prompt = kuas baru</text>
    <line x1="20" y1="115" x2="230" y2="115" stroke="#ffd700" stroke-width="1"/>
    <text x="125" y="140" text-anchor="middle" fill="#8892b0" font-family="Inter" font-size="10">2022-2024</text>
  </g>
  
  <g transform="translate(100, 490)">
    <rect width="675" height="80" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="337" y="30" text-anchor="middle" fill="#e94560" font-family="Inter" font-size="14" font-weight="bold">Era 3: Co-Creation?</text>
    <text x="337" y="55" text-anchor="middle" fill="#ccd6f6" font-family="Inter" font-size="11">AI + Manusia = Seni baru yang belum pernah ada sebelumnya</text>
  </g>
</svg>
