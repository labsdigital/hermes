<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="max-width:800px;width:100%;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <style>text{font-family:Inter,sans-serif;}</style>
  
  <!-- Central AI node -->
  <circle cx="400" cy="250" r="60" fill="#1e3a5f" stroke="#4a9eff" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="245" text-anchor="middle" fill="#4a9eff" font-size="14" font-weight="bold">AI</text>
  <text x="400" y="265" text-anchor="middle" fill="#8ab4f8" font-size="10">Mesin</text>
  
  <!-- Religious nodes -->
  <circle cx="150" cy="120" r="45" fill="#2d1a4e" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
  <text x="150" y="115" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">Agama</text>
  <text x="150" y="132" text-anchor="middle" fill="#d8b4fe" font-size="9">Tradisi</text>
  
  <circle cx="650" cy="120" r="45" fill="#2d1a4e" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
  <text x="650" y="115" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">Spiritual</text>
  <text x="650" y="132" text-anchor="middle" fill="#d8b4fe" font-size="9">Personal</text>
  
  <circle cx="150" cy="380" r="45" fill="#1a3a2d" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <text x="150" y="375" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">Ritual</text>
  <text x="150" y="392" text-anchor="middle" fill="#bbf7d0" font-size="9">Komunitas</text>
  
  <circle cx="650" cy="380" r="45" fill="#3a1a1a" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
  <text x="650" y="375" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">Makna</text>
  <text x="650" y="392" text-anchor="middle" fill="#fecaca" font-size="9">Eksistensial</text>
  
  <!-- Connection lines -->
  <line x1="200" y1="160" x2="350" y2="220" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="600" y1="160" x2="450" y2="220" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="200" y1="340" x2="350" y2="280" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="600" y1="340" x2="450" y2="280" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  
  <!-- Inner connections -->
  <line x1="195" y1="145" x2="195" y2="335" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="605" y1="145" x2="605" y2="335" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="195" y1="145" x2="605" y2="145" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="195" y1="335" x2="605" y2="335" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Labels -->
  <text x="400" y="460" text-anchor="middle" fill="#9ca3af" font-size="12">Cermin Baru untuk Refleksi Diri</text>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="bold">AI &amp; Spiritualitas</text>
  <text x="400" y="62" text-anchor="middle" fill="#6b7280" font-size="11">Perjumpaan Mesin dan yang Suci</text>
</svg>
</div>