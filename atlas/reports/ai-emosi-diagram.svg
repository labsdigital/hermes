<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title">
  <title id="title">AI dan Emosi: Diagram Saling Memengaruhi</title>
  
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8edf5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emosiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>
  
  <!-- AI Circle (left) -->
  <circle cx="180" cy="200" r="100" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <text x="180" y="185" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="600">AI</text>
  <text x="180" y="215" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter, sans-serif" font-size="12">Logika & Data</text>
  
  <!-- Emotion Circle (right) -->
  <circle cx="420" cy="200" r="100" fill="url(#emosiGrad)" filter="url(#shadow)"/>
  <text x="420" y="185" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="600">EMOSI</text>
  <text x="420" y="215" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter, sans-serif" font-size="12">Perasaan & Makna</text>
  
  <!-- Overlap region -->
  <ellipse cx="300" cy="200" rx="35" ry="80" fill="white" opacity="0.25"/>
  <text x="300" y="195" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11" font-weight="500">Saling</text>
  <text x="300" y="215" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11" font-weight="500">Mempengaruhi</text>
  
  <!-- Arrows showing bidirectional flow -->
  <path d="M 180 120 Q 300 80 420 120" fill="none" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 420 280 Q 300 320 180 280" fill="none" stroke="#f5576c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead2)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#667eea"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f5576c"/>
    </marker>
  </defs>
  
  <!-- Labels -->
  <text x="300" y="75" text-anchor="middle" fill="#555" font-family="Inter, sans-serif" font-size="11">AI memahami & merespons emosi manusia</text>
  <text x="300" y="335" text-anchor="middle" fill="#555" font-family="Inter, sans-serif" font-size="11">Emosi manusia memengaruhi cara AI dikembangkan</text>
  
  <!-- Bottom insight -->
  <rect x="150" y="355" width="300" height="32" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="300" y="376" text-anchor="middle" fill="#333" font-family="Inter, sans-serif" font-size="12" font-weight="500">Dua kekuatan yang membentuk masa depan bersama</text>
</svg>
