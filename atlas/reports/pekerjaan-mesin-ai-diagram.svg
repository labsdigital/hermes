<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of Work: From Muscle to Mind</title>
  <desc id="desc">A timeline showing how AI shifts work from physical labor to cognitive labor, and the emerging question of post-work society.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8590c"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="20" font-weight="600">EVOLUSI PEKERJAAN: DARI OTOT KE PIKIRAN</text>
  
  <!-- Timeline line -->
  <line x1="80" y1="280" x2="720" y2="280" stroke="#ff6b35" stroke-width="2" opacity="0.6"/>
  
  <!-- Era 1: Hunter-Gatherer -->
  <circle cx="140" cy="280" r="8" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="100" y="120" width="80" height="60" rx="8" fill="#2a2a4a" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="140" y="145" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="500">PEMBURU</text>
  <text x="140" y="162" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="9">12.000 thn lalu</text>
  <path d="M140 180 L140 270" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Era 2: Agriculture -->
  <circle cx="280" cy="280" r="8" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="240" y="120" width="80" height="60" rx="8" fill="#2a2a4a" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="280" y="145" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="500">PERTANIAN</text>
  <text x="280" y="162" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="9">10.000 thn lalu</text>
  <path d="M280 180 L280 270" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Era 3: Industrial -->
  <circle cx="420" cy="280" r="8" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="380" y="120" width="80" height="60" rx="8" fill="#2a2a4a" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="420" y="145" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="500">INDUSTRI</text>
  <text x="420" y="162" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="9">200 thn lalu</text>
  <path d="M420 180 L420 270" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Era 4: Digital -->
  <circle cx="560" cy="280" r="8" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="520" y="120" width="80" height="60" rx="8" fill="#2a2a4a" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="560" y="145" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="500">DIGITAL</text>
  <text x="560" y="162" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="9">50 thn lalu</text>
  <path d="M560 180 L560 270" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Era 5: AI Era (highlighted) -->
  <circle cx="700" cy="280" r="12" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="660" y="100" width="80" height="80" rx="8" fill="#3a2a1a" stroke="#ff6b35" stroke-width="2"/>
  <text x="700" y="130" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="11" font-weight="600">AI ERA</text>
  <text x="700" y="150" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">Sekarang</text>
  <text x="700" y="165" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="9">?</text>
  <path d="M700 180 L700 268" stroke="#ff6b35" stroke-width="2" opacity="0.8"/>
  
  <!-- Key insight box -->
  <rect x="150" y="320" width="500" height="140" rx="12" fill="#2a2a4a" stroke="#ff6b35" stroke-width="1" opacity="0.9"/>
  
  <text x="400" y="350" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="13" font-weight="600">PERUBAHAN FUNDAMENTAL</text>
  
  <!-- Before vs After -->
  <rect x="180" y="370" width="200" height="70" rx="8" fill="#1a1a2e"/>
  <text x="280" y="395" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="500">Masa Lalu</text>
  <text x="280" y="415" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="10">Mesin menggantikan OTOT</text>
  <text x="280" y="432" text-anchor="middle" fill="#888" font-family="Inter, sans-serif" font-size="9">Pekerjaan = Identitas</text>
  
  <rect x="420" y="370" width="200" height="70" rx="8" fill="#3a2a1a"/>
  <text x="520" y="395" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="11" font-weight="500">Era AI</text>
  <text x="520" y="415" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">Mesin menggantikan PIKIRAN</text>
  <text x="520" y="432" text-anchor="middle" fill="#aaa" font-family="Inter, sans-serif" font-size="9">Apa sisa bagi manusia?</text>
  
  <!-- Arrow between boxes -->
  <path d="M380 405 L420 405" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Bottom quote -->
  <text x="400" y="485" text-anchor="middle" fill="#666" font-family="Inter, sans-serif" font-size="10" font-style="italic">"Mesin tidak pernah lelah. Tapi mereka juga tidak pernah bertanya mengapa."</text>
</svg>
