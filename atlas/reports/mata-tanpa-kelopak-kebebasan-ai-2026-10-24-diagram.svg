<div style="text-align: center; margin: 40px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="circleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="circleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.7" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="2">INFERENSI AI: MATA YANG TIDAK BERKEDIP</text>
  
  <!-- Central Human Figure -->
  <circle cx="400" cy="250" r="60" fill="url(#circleGrad1)" filter="url(#glow)"/>
  <text x="400" y="255" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="500">MANUSIA</text>
  
  <!-- Data Points Orbiting -->
  <circle cx="250" cy="150" r="25" fill="url(#circleGrad2)" filter="url(#glow)"/>
  <text x="250" y="155" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9">DATA</text>
  
  <circle cx="550" cy="150" r="25" fill="url(#circleGrad2)" filter="url(#glow)"/>
  <text x="550" y="155" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9">DATA</text>
  
  <circle cx="250" cy="350" r="25" fill="url(#circleGrad2)" filter="url(#glow)"/>
  <text x="250" y="350" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9">DATA</text>
  
  <circle cx="550" cy="350" r="25" fill="url(#circleGrad2)" filter="url(#glow)"/>
  <text x="550" y="350" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9">DATA</text>
  
  <!-- AI Processing Center -->
  <circle cx="400" cy="380" r="45" fill="url(#circleGrad3)" filter="url(#glow)"/>
  <text x="400" y="375" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">AI</text>
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9">PREDIKSI</text>
  
  <!-- Connection Lines -->
  <line x1="340" y1="220" x2="270" y2="170" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="460" y1="220" x2="530" y2="170" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="340" y1="280" x2="270" y2="330" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="460" y1="280" x2="530" y2="330" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Lines to AI -->
  <line x1="370" y1="300" x2="380" y2="340" stroke="#4facfe" stroke-width="2" opacity="0.8"/>
  <line x1="430" y1="300" x2="420" y2="340" stroke="#4facfe" stroke-width="2" opacity="0.8"/>
  
  <!-- Prediction Output -->
  <circle cx="400" cy="120" r="35" fill="none" stroke="#f093fb" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
  <text x="400" y="115" text-anchor="middle" fill="#f093fb" font-family="Inter, sans-serif" font-size="10" font-weight="500">PREDIKSI</text>
  <text x="400" y="130" text-anchor="middle" fill="#f093fb" font-family="Inter, sans-serif" font-size="9">PERILAKU</text>
  
  <!-- Arrow from AI to Prediction -->
  <line x1="400" y1="335" x2="400" y2="160" stroke="#f093fb" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Key Insight Box -->
  <rect x="50" y="440" width="700" height="45" rx="8" fill="rgba(102,126,234,0.15)" stroke="#667eea" stroke-width="1"/>
  <text x="400" y="468" text-anchor="middle" fill="#a0aec0" font-family="Inter, sans-serif" font-size="12">AI tidak memerlukan data sensitif untuk mengetahui segalanya—ia cukup merekonstruksi dari fragment yang tersebar</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="3" fill="#667eea" opacity="0.4"/>
  <circle cx="700" cy="100" r="3" fill="#764ba2" opacity="0.4"/>
  <circle cx="100" cy="400" r="3" fill="#4facfe" opacity="0.4"/>
  <circle cx="700" cy="400" r="3" fill="#00f2fe" opacity="0.4"/>
</svg>
</div>
