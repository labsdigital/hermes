<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#667eea" font-size="32" font-family="Arial" font-weight="bold" filter="url(#glow)">
    Semantic Web 2.0
  </text>
  <text x="400" y="80" text-anchor="middle" fill="#8892b0" font-size="16" font-family="Arial">
    Agent-Readable Content Layer
  </text>
  
  <!-- Left: Human Layer -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="280" height="320" rx="12" fill="#2d3748" opacity="0.8"/>
    <text x="140" y="40" text-anchor="middle" fill="#f093fb" font-size="20" font-family="Arial" font-weight="bold">Human Layer</text>
    
    <!-- UI Elements -->
    <rect x="30" y="70" width="220" height="50" rx="6" fill="#4a5568"/>
    <text x="140" y="100" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Website UI/UX</text>
    
    <rect x="30" y="140" width="220" height="50" rx="6" fill="#4a5568"/>
    <text x="140" y="170" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Human Content</text>
    
    <rect x="30" y="210" width="220" height="50" rx="6" fill="#4a5568"/>
    <text x="140" y="240" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Visual Design</text>
    
    <rect x="30" y="280" width="220" height="50" rx="6" fill="#4a5568"/>
    <text x="140" y="310" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Interactive Elements</text>
  </g>
  
  <!-- Right: Agent Layer -->
  <g transform="translate(440, 120)">
    <rect x="0" y="0" width="280" height="320" rx="12" fill="#1a365d" opacity="0.8"/>
    <text x="140" y="40" text-anchor="middle" fill="#64ffda" font-size="20" font-family="Arial" font-weight="bold">Agent Layer</text>
    
    <!-- AI Elements -->
    <rect x="30" y="70" width="220" height="50" rx="6" fill="#2c5282"/>
    <text x="140" y="100" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Semantic Summary</text>
    
    <rect x="30" y="140" width="220" height="50" rx="6" fill="#2c5282"/>
    <text x="140" y="170" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Entity Extraction</text>
    
    <rect x="30" y="210" width="220" height="50" rx="6" fill="#2c5282"/>
    <text x="140" y="240" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Context Inference</text>
    
    <rect x="30" y="280" width="220" height="50" rx="6" fill="#2c5282"/>
    <text x="140" y="310" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Machine Relations</text>
  </g>
  
  <!-- Center: Connection -->
  <g transform="translate(360, 250)">
    <circle cx="40" cy="0" r="35" fill="#667eea" filter="url(#glow)"/>
    <text x="40" y="8" text-anchor="middle" fill="white" font-size="14" font-family="Arial" font-weight="bold">AI</text>
    <text x="40" y="28" text-anchor="middle" fill="white" font-size="10" font-family="Arial">LLM</text>
    
    <!-- Arrows -->
    <path d="M 0,0 L -60,0" stroke="#667eea" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 80,0 L 140,0" stroke="#667eea" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Bottom: Benefits -->
  <g transform="translate(100, 460)">
    <text x="300" y="0" text-anchor="middle" fill="#8892b0" font-size="12" font-family="Arial">
      Personalized Navigation | Cross-site Reasoning | Automated Workflows
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="700" cy="100" r="20" fill="#667eea" opacity="0.2"/>
  <circle cx="100" cy="400" r="15" fill="#f093fb" opacity="0.2"/>
</svg>
