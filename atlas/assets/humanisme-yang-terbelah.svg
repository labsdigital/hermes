<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Humanisme yang Terbelah: Transhumanis vs Pro-Humanis</title>
  <desc id="svg-desc">Diagram yang menunjukkan dua aliran humanisme modern: transhumanis yang ingin melebur dengan mesin dan pro-humanis yang ingin mempertahankan kemanusiaan asli.</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Center Divider -->
  <line x1="395" y1="30" x2="395" y2="370" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- LEFT SIDE: Transhumanis -->
  <g transform="translate(0, 0)">
    <!-- Card background -->
    <rect x="20" y="30" width="365" height="340" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    
    <!-- Icon: Brain with circuit -->
    <circle cx="200" cy="100" r="50" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <path d="M170 90 Q200 60 230 90" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <path d="M175 110 Q200 85 225 110" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="200" cy="130" r="8" fill="#22c55e"/>
    <!-- Circuit lines -->
    <line x1="200" y1="138" x2="200" y2="160" stroke="#22c55e" stroke-width="2"/>
    <line x1="185" y1="150" x2="215" y2="150" stroke="#22c55e" stroke-width="2"/>
    <circle cx="185" cy="150" r="4" fill="#22c55e"/>
    <circle cx="215" cy="150" r="4" fill="#22c55e"/>
    
    <!-- Label -->
    <text x="200" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#166534" font-weight="bold">TRANSHUMANIS</text>
    
    <!-- Key ideas -->
    <text x="50" y="230" font-family="Georgia, serif" font-size="14" fill="#15803d">✓ Enhance tubuh & pikiran</text>
    <text x="50" y="255" font-family="Georgia, serif" font-size="14" fill="#15803d">✓ Melebur dengan AI</text>
    <text x="50" y="280" font-family="Georgia, serif" font-size="14" fill="#15803d">✓ Batas adalah ilusi</text>
    <text x="50" y="305" font-family="Georgia, serif" font-size="14" fill="#15803d">✓ Evolusi berlanjut</text>
    <text x="50" y="330" font-family="Georgia, serif" font-size="14" fill="#15803d">✓ Kematian = masalah teknis</text>
    
    <!-- Bottom label -->
    <text x="200" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#166534" font-style="italic">"Menjadi lebih dari manusia"</text>
  </g>
  
  <!-- RIGHT SIDE: Pro-Humanis -->
  <g transform="translate(415, 0)">
    <!-- Card background -->
    <rect x="20" y="30" width="365" height="340" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    
    <!-- Icon: Heart/human figure -->
    <path d="M200 70 C180 50 150 70 170 100 L200 140 L230 100 C250 70 220 50 200 70 Z" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <circle cx="200" cy="105" r="15" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    
    <!-- Label -->
    <text x="200" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7c2d12" font-weight="bold">PRO-HUMANIS</text>
    
    <!-- Key ideas -->
    <text x="50" y="230" font-family="Georgia, serif" font-size="14" fill="#9a3412">✓ Nilai pada keterbatasan</text>
    <text x="50" y="255" font-family="Georgia, serif" font-size="14" fill="#9a3412">✓ Pertahankan kemanusiaan</text>
    <text x="50" y="280" font-family="Georgia, serif" font-size="14" fill="#9a3412">✓ Makna dari mortalitas</text>
    <text x="50" y="305" font-family="Georgia, serif" font-size="14" fill="#9a3412">✓ Etika sebelum teknologi</text>
    <text x="50" y="330" font-family="Georgia, serif" font-size="14" fill="#9a3412">✓ Kematian = bagian hidup</text>
    
    <!-- Bottom label -->
    <text x="200" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7c2d12" font-style="italic">"Tetap menjadi manusia"</text>
  </g>
  
  <!-- Center arrow indicators -->
  <path d="M385 180 L405 180 L405 175" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M415 180 L395 180 L395 175" fill="none" stroke="#94a3b8" stroke-width="2"/>
</svg>
