<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ff6b35" font-family="Inter, sans-serif" font-size="24" font-weight="700" filter="url(#glow)">Guru Tanpa Daging</text>
  <text x="400" y="75" text-anchor="middle" fill="#e8e8e8" font-family="Inter, sans-serif" font-size="14">Evolution of Teaching: From Survival to AI</text>
  
  <!-- Timeline -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="#4a5568" stroke-width="3"/>
  
  <!-- Era 1: Survival -->
  <circle cx="150" cy="300" r="8" fill="#ff6b35"/>
  <rect x="100" y="120" width="100" height="60" rx="8" fill="#2d3748" stroke="#ff6b35" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" fill="#ff6b35" font-family="Inter" font-size="11" font-weight="600">EVOLUSI 1</text>
  <text x="150" y="162" text-anchor="middle" fill="#e8e8e8" font-family="Inter" font-size="9">Survival Learning</text>
  
  <rect x="100" y="330" width="100" height="80" rx="8" fill="#1a202c"/>
  <text x="150" y="355" text-anchor="middle" fill="#a0aec0" font-family="Inter" font-size="9">Oral tradition</text>
  <text x="150" y="370" text-anchor="middle" fill="#a0aec0" font-size="9">No curriculum</text>
  <text x="150" y="385" text-anchor="middle" fill="#a0aec0" font-size="9">Learning = Living</text>
  
  <!-- Era 2: Writing -->
  <circle cx="300" cy="300" r="8" fill="#ed8936"/>
  <rect x="250" y="120" width="100" height="60" rx="8" fill="#2d3748" stroke="#ed8936" stroke-width="2"/>
  <text x="300" y="145" text-anchor="middle" fill="#ed8936" font-family="Inter" font-size="11" font-weight="600">EVOLUSI 2</text>
  <text x="300" y="162" text-anchor="middle" fill="#e8e8e8" font-size="9">Writing Systems</text>
  
  <rect x="250" y="330" width="100" height="80" rx="8" fill="#1a202c"/>
  <text x="300" y="355" text-anchor="middle" fill="#a0aec0" font-family="Inter" font-size="9">Knowledge stored</text>
  <text x="300" y="370" text-anchor="middle" fill="#a0aec0" font-size="9">External memory</text>
  <text x="300" y="385" text-anchor="middle" fill="#a0aec0" font-size="9">Birth of schools</text>
  
  <!-- Era 3: Mass Schooling -->
  <circle cx="450" cy="300" r="8" fill="#dd6b20"/>
  <rect x="400" y="120" width="100" height="60" rx="8" fill="#2d3748" stroke="#dd6b20" stroke-width="2"/>
  <text x="450" y="145" text-anchor="middle" fill="#dd6b20" font-family="Inter" font-size="11" font-weight="600">EVOLUSI 3</text>
  <text x="450" y="162" text-anchor="middle" fill="#e8e8e8" font-size="9">Mass Schooling</text>
  
  <rect x="400" y="330" width="100" height="80" rx="8" fill="#1a202c"/>
  <text x="450" y="355" text-anchor="middle" fill="#a0aec0" font-family="Inter" font-size="9">Industrial model</text>
  <text x="450" y="370" text-anchor="middle" fill="#a0aec0" font-size="9">Standardized</text>
  <text x="450" y="385" text-anchor="middle" fill="#a0aec0" font-size="9">Bell schedules</text>
  
  <!-- Era 4: AI -->
  <circle cx="600" cy="300" r="12" fill="#ff6b35" filter="url(#glow)"/>
  <rect x="550" y="100" width="100" height="80" rx="8" fill="#2d3748" stroke="#ff6b35" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" fill="#ff6b35" font-family="Inter" font-size="11" font-weight="600">EVOLUSI 4</text>
  <text x="600" y="142" text-anchor="middle" fill="#ff6b35" font-family="Inter" font-size="10">AI Tutoring</text>
  <text x="600" y="158" text-anchor="middle" fill="#e8e8e8" font-size="9">24/7 Available</text>
  
  <rect x="550" y="330" width="100" height="80" rx="8" fill="#1a202c" stroke="#ff6b35" stroke-width="1"/>
  <text x="600" y="355" text-anchor="middle" fill="#ff6b35" font-family="Inter" font-size="9">Personalized</text>
  <text x="600" y="370" text-anchor="middle" fill="#ff6b35" font-size="9">Adaptive pace</text>
  <text x="600" y="385" text-anchor="middle" fill="#ff6b35" font-size="9"> Democratized</text>
  
  <!-- Key insight box -->
  <rect x="250" y="460" width="300" height="100" rx="12" fill="#2d3748" stroke="#ff6b35" stroke-width="2"/>
  <text x="400" y="490" text-anchor="middle" fill="#ff6b35" font-family="Inter" font-size="12" font-weight="700">PARADOKS PERHATIAN</text>
  <text x="400" y="510" text-anchor="middle" fill="#e8e8e8" font-family="Inter" font-size="10">AI teaches facts →但不能 teach meaning</text>
  <text x="400" y="530" text-anchor="middle" fill="#e8e8e8" font-family="Inter" font-size="10">Students report loneliness with AI tutors</text>
  <text x="400" y="550" text-anchor="middle" fill="#ff6b35" font-family="Inter" font-size="10">The human witness remains irreplaceable</text>
</svg>