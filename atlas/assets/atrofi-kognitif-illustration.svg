<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Atrofi Kognitif: Penurunan Kecerdasan Global</title>
  <desc id="svg-desc">Ilustrasi perbandingan antara otak manusia yang aktif dan sehat (kiri) dengan otak yang mengalami atrofi karena terlalu bergantung pada teknologi (kanan).</desc>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- LEFT SIDE: Healthy Brain (Warm Colors) -->
  <g transform="translate(0, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    
    <!-- Brain outline -->
    <path d="M205 80 C160 80 130 110 130 150 C130 180 145 200 160 215 L160 240 L250 240 L250 215 C265 200 280 180 280 150 C280 110 250 80 205 80 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    
    <!-- Neural connections (active) -->
    <circle cx="180" cy="130" r="8" fill="#22c55e"/>
    <circle cx="230" cy="130" r="8" fill="#22c55e"/>
    <circle cx="205" cy="170" r="8" fill="#22c55e"/>
    <circle cx="170" cy="200" r="6" fill="#22c55e"/>
    <circle cx="240" cy="200" r="6" fill="#22c55e"/>
    
    <!-- Neural pathways -->
    <path d="M180 130 L230 130" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M180 130 L205 170" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M230 130 L205 170" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M205 170 L170 200" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M205 170 L240 200" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
    
    <!-- Light rays (activation) -->
    <line x1="205" y1="60" x2="205" y2="40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="175" y1="65" x2="160" y2="50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="235" y1="65" x2="250" y2="50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Labels -->
    <text x="205" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#166534" font-weight="bold">Otak Aktif</text>
    <text x="205" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#15803d">Neural Connections Kuat</text>
    <text x="205" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#16a34a">IQ: 100+ (Normal)</text>
  </g>
  
  <!-- RIGHT SIDE: Atrophied Brain (Cool/Dull Colors) -->
  <g transform="translate(410, 0)">
    <!-- Card background -->
    <rect x="20" y="20" width="370" height="360" rx="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    
    <!-- Brain outline (shrinking) -->
    <path d="M205 90 C170 90 145 115 145 150 C145 175 155 190 165 200 L165 230 L245 230 L245 200 C255 190 265 175 265 150 C265 115 240 90 205 90 Z" fill="#fee2e2" stroke="#f87171" stroke-width="2" stroke-dasharray="5,3"/>
    
    <!-- Fewer neural connections (weakened) -->
    <circle cx="195" cy="140" r="6" fill="#f87171" opacity="0.6"/>
    <circle cx="215" cy="140" r="6" fill="#f87171" opacity="0.6"/>
    <circle cx="205" cy="175" r="5" fill="#f87171" opacity="0.5"/>
    
    <!-- Broken pathways -->
    <path d="M195 140 L215 140" stroke="#f87171" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.5"/>
    <path d="M195 140 L205 175" stroke="#f87171" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.5"/>
    
    <!-- Screen/phone icon (dependency) -->
    <rect x="175" y="210" width="60" height="40" rx="5" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <rect x="180" y="215" width="50" height="25" rx="2" fill="#fee2e2"/>
    <circle cx="205" cy="245" r="3" fill="#ef4444"/>
    
    <!-- Warning symbol -->
    <path d="M205 195 L200 205 L210 205 Z" fill="#ef4444" opacity="0.8"/>
    <text x="205" y="202" text-anchor="middle" font-size="8" fill="white" font-weight="bold">!</text>
    
    <!-- Labels -->
    <text x="205" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#991b1b" font-weight="bold">Otak Atrofi</text>
    <text x="205" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#b91c1c">Neural Connections Lemah</text>
    <text x="205" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#dc2626">IQ: 90-95 (Menurun)</text>
  </g>
  
  <!-- Center Divider -->
  <line x1="395" y1="20" x2="395" y2="380" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Arrow showing decline -->
  <path d="M395 100 L395 140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">Penurunan</text>
  
  <!-- Trend line -->
  <path d="M50 280 Q200 270 400 290 T750 280" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
