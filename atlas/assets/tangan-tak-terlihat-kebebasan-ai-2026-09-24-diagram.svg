<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" filter="url(#glow)">
    Kebebasan vs Determinisme Digital
  </text>
  
  <!-- Human side - branches of choice -->
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="40" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">MANUSIA</text>
    
    <!-- Branches -->
    <line x1="0" y1="-40" x2="0" y2="-120" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-40" x2="-60" y2="-100" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-40" x2="60" y2="-100" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-40" x2="-40" y2="-140" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-40" x2="40" y2="-140" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    
    <!-- Choice nodes -->
    <circle cx="0" cy="-120" r="8" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="-60" cy="-100" r="8" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="60" cy="-100" r="8" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="-40" cy="-140" r="8" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="40" cy="-140" r="8" fill="#ff6b6b" opacity="0.7"/>
    
    <text x="0" y="-150" text-anchor="middle" fill="#ff6b6b" font-family="Arial" font-size="10">Pilihan A</text>
    <text x="-80" y="-110" text-anchor="middle" fill="#ff6b6b" font-family="Arial" font-size="10">Pilihan B</text>
    <text x="80" y="-110" text-anchor="middle" fill="#ff6b6b" font-family="Arial" font-size="10">Pilihan C</text>
  </g>
  
  <!-- Center - Algorithm -->
  <g transform="translate(400, 300)">
    <rect x="-60" y="-60" width="120" height="120" rx="10" fill="#4ecdc4" opacity="0.2" stroke="#4ecdc4" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="-20" text-anchor="middle" fill="#4ecdc4" font-family="Arial" font-size="14" font-weight="bold">ALGORITMA</text>
    <text x="0" y="0" text-anchor="middle" fill="#4ecdc4" font-family="Arial" font-size="10">P(A)=0.73</text>
    <text x="0" y="20" text-anchor="middle" fill="#4ecdc4" font-family="Arial" font-size="10">P(B)=0.15</text>
    <text x="0" y="40" text-anchor="middle" fill="#4ecdc4" font-family="Arial" font-size="10">P(C)=0.12</text>
  </g>
  
  <!-- Machine side - single path -->
  <g transform="translate(650, 300)">
    <circle cx="0" cy="0" r="40" fill="#4ecdc4" opacity="0.9" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">MESIN</text>
    
    <!-- Single path -->
    <line x1="0" y1="-40" x2="0" y2="-120" stroke="#4ecdc4" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="-120" x2="0" y2="-200" stroke="#4ecdc4" stroke-width="3" opacity="0.8"/>
    
    <!-- Prediction nodes -->
    <circle cx="0" cy="-120" r="10" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="0" cy="-200" r="10" fill="#4ecdc4" opacity="0.9"/>
    
    <text x="0" y="-135" text-anchor="middle" fill="#4ecdc4" font-family="Arial" font-size="10">Prediksi</text>
    <text x="0" y="-220" text-anchor="middle" fill="#4ecdc4" font-family="Arial" font-size="10">Keputusan</text>
  </g>
  
  <!-- Connection lines -->
  <line x1="190" y1="300" x2="340" y2="300" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="460" y1="300" x2="610" y2="300" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Arrow from human to algorithm -->
  <path d="M 200 280 L 340 280" stroke="#ff6b6b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="270" y="270" text-anchor="middle" fill="#ff6b6b" font-family="Arial" font-size="10">Data</text>
  
  <!-- Arrow from algorithm to machine -->
  <path d="M 460 280 L 600 280" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <text x="530" y="270" text-anchor="middle" fill="#4ecdc4" font-family="Arial" font-size="10">Output</text>
  
  <!-- Bottom text -->
  <text x="400" y="550" text-anchor="middle" fill="#888888" font-family="Arial" font-size="12" font-style="italic">
    "Kebebasan adalah ilusi yang diperlukan. Tapi siapa yang memilih ilusi itu?"
  </text>
  
  <!-- Legend -->
  <g transform="translate(50, 520)">
    <circle cx="0" cy="0" r="6" fill="#ff6b6b"/>
    <text x="15" y="4" fill="#ff6b6b" font-family="Arial" font-size="10">Kemungkinan</text>
    <circle cx="100" cy="0" r="6" fill="#4ecdc4"/>
    <text x="115" y="4" fill="#4ecdc4" font-family="Arial" font-size="10">Probabilitas</text>
  </g>
</svg>
