<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img">
  <title>Satu produk, dua cerita: wajah pemasaran versus catatan risiko yang tidak dituturkan</title>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="620" rx="16" fill="#0b1220"/>

  <!-- main title -->
  <text x="450" y="44" text-anchor="middle" font-size="21" font-weight="bold" fill="#f1f5f9" letter-spacing="2">SATU PRODUK, DUA CERITA</text>

  <!-- divider -->
  <line x1="450" y1="70" x2="450" y2="520" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- ================= LEFT PANEL ================= -->
  <rect x="125" y="72" width="230" height="34" rx="17" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="240" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#ccfbf1" letter-spacing="1.5">YANG DIKAMPANYEKAN</text>

  <!-- aura arcs -->
  <path d="M 196 215 A 44 44 0 0 1 284 215" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.30"/>
  <path d="M 180 215 A 60 60 0 0 1 300 215" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.20"/>
  <path d="M 164 215 A 76 76 0 0 1 316 215" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.12"/>

  <!-- standing figure, arms raised -->
  <circle cx="240" cy="190" r="13" fill="#e2e8f0"/>
  <rect x="222" y="206" width="36" height="52" rx="10" fill="#e2e8f0"/>
  <line x1="226" y1="214" x2="198" y2="184" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="254" y1="214" x2="282" y2="184" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="232" y1="258" x2="228" y2="300" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="248" y1="258" x2="252" y2="300" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

  <!-- up arrow -->
  <line x1="150" y1="300" x2="150" y2="175" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  <polygon points="150,162 142,178 158,178" fill="#2dd4bf"/>

  <!-- promise chips -->
  <rect x="135" y="330" width="210" height="30" rx="15" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="240" y="350" text-anchor="middle" font-size="14" fill="#99f6e4">&#171;Kopilot&#187; untuk segalanya</text>

  <rect x="106" y="372" width="268" height="30" rx="15" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="240" y="392" text-anchor="middle" font-size="14" fill="#99f6e4">Manusia &#171;tetap memegang kemudi&#187;</text>

  <rect x="115" y="414" width="250" height="30" rx="15" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="240" y="434" text-anchor="middle" font-size="14" fill="#99f6e4">Produktivitas naik, biaya turun</text>

  <!-- ================= RIGHT PANEL ================= -->
  <rect x="535" y="72" width="250" height="34" rx="17" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="660" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fee2e2" letter-spacing="1.5">YANG TIDAK DITUTURKAN</text>

  <!-- server rack -->
  <rect x="700" y="140" width="64" height="110" rx="6" fill="#111827" stroke="#475569" stroke-width="2"/>
  <rect x="706" y="150" width="52" height="26" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="706" y="186" width="52" height="26" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="706" y="222" width="52" height="26" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="750" cy="163" r="2.5" fill="#4ade80"/>
  <circle cx="714" cy="199" r="2.5" fill="#4ade80"/>
  <circle cx="750" cy="235" r="2.5" fill="#f87171"/>

  <!-- smoke + label -->
  <circle cx="716" cy="128" r="7" fill="#64748b" opacity="0.55"/>
  <circle cx="734" cy="118" r="9" fill="#64748b" opacity="0.55"/>
  <circle cx="752" cy="126" r="6.5" fill="#64748b" opacity="0.55"/>
  <text x="772" y="126" text-anchor="start" font-size="11" fill="#94a3b8">CO&#8322;</text>

  <!-- water drop + label -->
  <path d="M 686 114 C 692 124 694 130 686 137 C 678 130 680 124 686 114 Z" fill="#38bdf8" opacity="0.85"/>
  <text x="672" y="132" text-anchor="end" font-size="11" fill="#7dd3fc">air</text>

  <!-- cord laptop-server -->
  <path d="M 640 250 C 668 250 678 214 700 210" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="700" cy="210" r="3" fill="#f87171"/>

  <!-- desk -->
  <line x1="545" y1="262" x2="705" y2="262" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="560" y1="262" x2="560" y2="308" stroke="#334155" stroke-width="5"/>
  <line x1="695" y1="262" x2="695" y2="308" stroke="#334155" stroke-width="5"/>

  <!-- laptop -->
  <rect x="600" y="232" width="40" height="26" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- slumped seated figure -->
  <circle cx="576" cy="218" r="12" fill="#94a3b8"/>
  <path d="M 566 232 Q 563 258 570 280 L 592 280 Q 588 256 588 234 Z" fill="#94a3b8" opacity="0.9"/>
  <line x1="584" y1="242" x2="612" y2="256" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="612" cy="256" r="3" fill="#94a3b8"/>
  <line x1="574" y1="280" x2="606" y2="278" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="606" y1="278" x2="604" y2="306" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="560" y1="282" x2="596" y2="282" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <line x1="578" y1="282" x2="578" y2="308" stroke="#475569" stroke-width="5"/>

  <!-- hidden-cost chips -->
  <rect x="529" y="330" width="262" height="30" rx="15" fill="#0f172a" stroke="#f87171" stroke-width="1.5"/>
  <text x="660" y="350" text-anchor="middle" font-size="14" fill="#fecaca">Latihan yang tidak pernah terjadi</text>

  <rect x="542" y="372" width="236" height="30" rx="15" fill="#0f172a" stroke="#f87171" stroke-width="1.5"/>
  <text x="660" y="392" text-anchor="middle" font-size="14" fill="#fecaca">Listrik, emisi, dan air tawar</text>

  <rect x="541" y="414" width="238" height="30" rx="15" fill="#0f172a" stroke="#f87171" stroke-width="1.5"/>
  <text x="660" y="434" text-anchor="middle" font-size="14" fill="#fecaca">Untung sendiri, risiko dibagi</text>

  <!-- bottom banner -->
  <rect x="40" y="545" width="820" height="54" rx="14" fill="#111827" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="450" y="578" text-anchor="middle" font-size="17" font-style="italic" fill="#fcd34d">&#171;Augmentasi&#187; adalah kata jualannya &#8212; &#171;substitusi&#187; adalah cara pakainya.</text>
</svg>
