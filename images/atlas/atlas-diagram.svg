<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#667eea" font-size="28" font-family="Arial" font-weight="bold" filter="url(#glow)">
    Web Pasca-AI Architecture
  </text>
  
  <!-- Main diagram - Layer structure -->
  <g transform="translate(100, 100)">
    <!-- Agent Layer -->
    <rect x="0" y="0" width="600" height="60" rx="8" fill="#667eea" opacity="0.8"/>
    <text x="300" y="38" text-anchor="middle" fill="white" font-size="18" font-family="Arial">Agent Layer</text>
    
    <!-- Protocol Layer -->
    <rect x="50" y="80" width="500" height="60" rx="8" fill="#667eea" opacity="0.6"/>
    <text x="300" y="118" text-anchor="middle" fill="white" font-size="18" font-family="Arial">Protocol Layer (MCP)</text>
    
    <!-- Content Layer -->
    <rect x="100" y="160" width="400" height="60" rx="8" fill="#667eea" opacity="0.4"/>
    <text x="300" y="198" text-anchor="middle" fill="white" font-size="18" font-family="Arial">Content Layer</text>
    
    <!-- Infrastructure Layer -->
    <rect x="150" y="240" width="300" height="60" rx="8" fill="#667eea" opacity="0.2"/>
    <text x="300" y="278" text-anchor="middle" fill="white" font-size="18" font-family="Arial">Infrastructure</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="700" cy="80" r="30" fill="#667eea" opacity="0.3"/>
  <circle cx="100" cy="320" r="20" fill="#667eea" opacity="0.3"/>
  
  <!-- Footer -->
  <text x="400" y="380" text-anchor="middle" fill="#8892b0" font-size="14" font-family="Arial">
    Generated by Hermes Agent - Atlas
  </text>
</svg>