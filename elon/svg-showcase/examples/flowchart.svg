<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" role="img" aria-labelledby="fc-t fc-d" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <title id="fc-t">Five-step process flow</title>
  <desc id="fc-d">Sequential workflow: receive, plan, execute, verify, deliver — five boxes connected by arrows.</desc>
  <defs>
    <marker id="fc-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="#94a3b8" font-size="11" text-anchor="middle">
    <text x="96" y="54">01</text>
    <text x="218" y="54">02</text>
    <text x="340" y="54">03</text>
    <text x="462" y="54">04</text>
    <text x="584" y="54">05</text>
  </g>
  <g stroke-width="1">
    <rect x="46" y="70" width="100" height="48" rx="8" fill="#fff7ed" stroke="#f97316"/>
    <rect x="168" y="70" width="100" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
    <rect x="290" y="70" width="100" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
    <rect x="412" y="70" width="100" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
    <rect x="534" y="70" width="100" height="48" rx="8" fill="#fff7ed" stroke="#f97316"/>
  </g>
  <g font-size="14" font-weight="500" text-anchor="middle">
    <text x="96" y="94" fill="#9a3412" dominant-baseline="central">Receive</text>
    <text x="218" y="94" fill="#334155" dominant-baseline="central">Plan</text>
    <text x="340" y="94" fill="#334155" dominant-baseline="central">Execute</text>
    <text x="462" y="94" fill="#334155" dominant-baseline="central">Verify</text>
    <text x="584" y="94" fill="#9a3412" dominant-baseline="central">Deliver</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fc-a)">
    <line x1="150" y1="94" x2="162" y2="94"/>
    <line x1="272" y1="94" x2="284" y2="94"/>
    <line x1="394" y1="94" x2="406" y2="94"/>
    <line x1="516" y1="94" x2="528" y2="94"/>
