<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Architecture — SVG Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --paper:#ffffff; --accent:#f97316; --bg:#f8fafc;
  --text-secondary:#475569; --muted:#94a3b8;
  --border:rgba(15,23,42,.12); --line:#94a3b8;
  --radius-md:8px; --radius-lg:12px;
  --bg-accent:#fff7ed;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
.back{font-size:12px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:16px}
.back:hover{color:var(--accent)}
h1{font-size:18px;font-weight:500;margin:0 0 4px}
.lede{margin:0 0 20px;color:var(--text-secondary)}
svg{width:100%;height:auto;display:block}
.box{fill:var(--paper);stroke:rgba(15,23,42,.24);stroke-width:0.5}
.box-hot{fill:var(--bg-accent);stroke:var(--accent);stroke-width:1}
.t{fill:var(--ink);font-size:14px;font-weight:500}
.ts{fill:var(--text-secondary);font-size:12px}
.num{fill:var(--muted);font-size:11px}
.arr{fill:none;stroke:var(--line);stroke-width:1.5}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">&larr; Showcase</a>
  <h1>System architecture</h1>
  <p class="lede">Structural diagram of a Hermes-style agent runtime.</p>

  <svg viewBox="0 0 680 390" role="img" aria-labelledby="ar-t ar-d" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
    <title id="ar-t">Agent runtime architecture</title>
    <desc id="ar-d">Client and gateway feed an orchestrator, which fans out to tool runner, memory and sandbox services, all persisting to a state store.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <g class="arr" marker-end="url(#arrow)">
      <line x1="140" y1="72" x2="164" y2="72"/>
      <line x1="270" y1="72" x2="304" y2="72"/>
      <path d="M360 96 V135 H155 V184"/>
      <path d="M410 96 V184"/>
      <path d="M460 96 V135 H525 V184"/>
      <path d="M155 242 V270 H397 V294"/>
      <path d="M340 242 V270 H415 V294"/>
      <path d="M525 242 V270 H433 V294"/>
    </g>

    <rect class="box" x="40" y="48" width="100" height="48" rx="4"/>
    <text class="t" x="90" y="66" text-anchor="middle" dominant-baseline="central">Client</text>
    <text class="ts" x="90" y="84" text-anchor="middle" dominant-baseline="central">chat ui</text>

    <rect class="box" x="170" y="48" width="100" height="48" rx="4"/>
    <text class="t" x="220" y="66" text-anchor="middle" dominant-baseline="central">Gateway</text>
    <text class="ts" x="220" y="84" text-anchor="middle" dominant-baseline="central">auth · route</text>

    <rect class="box-hot" x="310" y="48" width="200" height="48" rx="8"/>
    <text class="t" x="410" y="66" text-anchor="middle" dominant-baseline="central">Orchestrator</text>
    <text class="ts" x="410" y="84" text-anchor="middle" dominant-baseline="central">planning loop</text>

    <rect class="box" x="80" y="190" width="150" height="52" rx="4"/>
    <text class="t" x="155" y="210" text-anchor="middle" dominant-baseline="central">Tool runner</text>
    <text class="ts" x="155" y="228" text-anchor="middle" dominant-baseline="central">shell · api · files</text>

    <rect class="box" x="265" y="190" width="150" height="52" rx="4"/>
    <text class="t" x="340" y="210" text-anchor="middle" dominant-baseline="central">Memory</text>
    <text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">sessions · recall</text>

    <rect class="box" x="450" y="190" width="150" height="52" rx="4"/>
    <text class="t" x="525" y="210" text-anchor="middle" dominant-baseline="central">Sandbox</text>
    <text class="ts" x="525" y="228" text-anchor="middle" dominant-baseline="central">isolated exec</text>

    <rect class="box" x="265" y="300" width="300" height="48" rx="4"/>
    <text class="t" x="415" y="318" text-anchor="middle" dominant-baseline="central">State store</text>
    <text class="ts" x="415" y="336" text-anchor="middle" dominant-baseline="central">sqlite · sessions · logs</text>
  </svg>
</div>
</body>
</html>
