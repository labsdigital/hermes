<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Explainer — SVG Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --paper:#ffffff; --accent:#f97316; --bg:#f8fafc;
  --text-secondary:#475569; --muted:#94a3b8;
  --border:rgba(15,23,42,.12);
  --radius-md:8px; --radius-lg:12px;
  --bg-accent:#fff7ed;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
.back{font-size:12px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:16px}
.back:hover{color:var(--accent)}
h1{font-size:18px;font-weight:500;margin:0 0 4px}
.lede{margin:0 0 24px;color:var(--text-secondary)}
.slider-row{display:flex;align-items:center;gap:12px;margin:0 0 1.5rem}
.slider-row label{font-size:14px;color:var(--text-secondary);white-space:nowrap}
input[type=range]{flex:1;accent-color:var(--accent)}
.out{font-size:14px;font-weight:500;min-width:32px;text-align:right}
.result{display:flex;align-items:baseline;gap:8px}
.big{font-size:24px;font-weight:500}
.meter{height:8px;background:rgba(15,23,42,.08);border-radius:999px;margin:20px 0 8px;overflow:hidden}
.meter-fill{height:100%;background:var(--accent);border-radius:999px;width:33%;transition:width .15s ease}
.note{font-size:12px;color:var(--muted);margin:0}
.stats{display:flex;gap:24px;margin-top:20px;padding-top:16px;border-top:0.5px solid var(--border)}
.stat p{margin:0}
.stat .k{font-size:13px;color:var(--text-secondary)}
.stat .v{font-size:16px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">&larr; Showcase</a>
  <h1>Interactive explainer — parallel agents</h1>
  <p class="lede">A 240-call job split across N subagents. Each extra agent adds 6% coordination overhead.</p>

  <div class="slider-row">
    <label for="agents">Subagents</label>
    <input type="range" id="agents" min="1" max="12" step="1" value="4" oninput="update(this.value)">
    <span class="out" id="n-out">4</span>
  </div>

  <div class="result">
    <span style="color:var(--text-secondary)">Wall-clock estimate &rarr;</span>
    <span class="big" id="time">3.5 min</span>
  </div>

  <div class="meter" role="img" aria-label="Time relative to single-agent baseline"><div class="meter-fill" id="fill"></div></div>
  <p class="note">Bar shows time used relative to the 1-agent baseline (12 min).</p>

  <div class="stats">
    <div class="stat"><p class="k">Speed-up</p><p class="v" id="speed">3.4&times;</p></div>
    <div class="stat"><p class="k">Calls per agent</p><p class="v" id="calls">71</p></div>
    <div class="stat"><p class="k">Overhead calls</p><p class="v" id="overhead">11</p></div>
  </div>
</div>

<script>
var BASE_CALLS = 240;
function model(n) {
  var total = BASE_CALLS * (1 + 0.06 * (n - 1));
  return { minutes: total / n / 20, callsPer: Math.round(total / n), overhead: Math.round(total - BASE_CALLS) };
}
function update(n) {
  n = Number(n);
  var m = model(n);
  document.getElementById('n-out').textContent = n;
  document.getElementById('time').textContent = m.minutes.toFixed(1) + ' min';
  document.getElementById('fill').style.width = Math.min(100, Math.round((m.minutes / 12) * 100)) + '%';
  document.getElementById('speed').textContent = (12 / m.minutes).toFixed(1) + '\u00d7';
  document.getElementById('calls').textContent = m.callsPer;
  document.getElementById('overhead').textContent = m.overhead;
}
update(4);
</script>
</body>
</html>
