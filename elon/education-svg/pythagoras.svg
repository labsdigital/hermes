<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="py-title py-desc" font-family="Arial, 'Helvetica Neue', sans-serif">
  <title id="py-title">Teorema Pythagoras</title>
  <desc id="py-desc">Segitiga siku-siku dengan sisi a sama dengan 3, b sama dengan 4, dan c sama dengan 5. Kuadrat luas sisi a ditambah kuadrat luas sisi b sama dengan kuadrat luas sisi c: 9 plus 16 sama dengan 25.</desc>

  <!-- Persegi pada sisi a (bawah) -->
  <rect x="150" y="150" width="120" height="120" fill="#3B82F6" stroke="#1F2937" stroke-width="2"/>

  <!-- Persegi pada sisi b (kiri) -->
  <rect x="60" y="60" width="90" height="90" fill="#10B981" stroke="#1F2937" stroke-width="2"/>

  <!-- Persegi pada sisi miring c -->
  <polygon points="150,60 270,150 360,270 240,180" fill="#F97316" stroke="#1F2937" stroke-width="2"/>

  <!-- Segitiga siku-siku -->
  <polygon points="150,150 270,150 150,60" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
  <path d="M162,150 L162,138 L150,138" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- Label sisi -->
  <text x="212" y="144" text-anchor="middle" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#1F2937">a</text>
  <text x="160" y="112" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#1F2937">b</text>
  <text x="222" y="121" font-size="14" font-style="italic" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#FFFFFF">c</text>

  <!-- Label luas persegi -->
  <text x="210" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">a² = 9</text>
  <text x="105" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">b² = 16</text>
  <text x="255" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" transform="rotate(36.87 255 170)">c² = 25</text>

  <!-- Rumus -->
  <text x="200" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">a² + b² = c²   →   9 + 16 = 25</text>
</svg>
