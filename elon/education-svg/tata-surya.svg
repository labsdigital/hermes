<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="ts-title ts-desc" font-family="Arial, 'Helvetica Neue', sans-serif">
  <title id="ts-title">Tata Surya</title>
  <desc id="ts-desc">Diagram tata surya dengan Matahari di kiri dan delapan planet pada orbitnya: Merkurius, Venus, Bumi, Mars, Jupiter, Saturnus, Uranus, dan Neptunus.</desc>

  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">Tata Surya</text>

  <!-- Orbit -->
  <g fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.45">
    <circle cx="70" cy="200" r="90"/>
    <circle cx="70" cy="200" r="140"/>
    <circle cx="70" cy="200" r="190"/>
    <circle cx="70" cy="200" r="240"/>
    <circle cx="70" cy="200" r="300"/>
    <circle cx="70" cy="200" r="365"/>
    <circle cx="70" cy="200" r="430"/>
    <circle cx="70" cy="200" r="500"/>
  </g>

  <!-- Matahari -->
  <circle cx="70" cy="200" r="42" fill="#F59E0B"/>
  <text x="70" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Matahari</text>

  <!-- Planet -->
  <circle cx="154.6" cy="169.2" r="7" fill="#6B7280"/>
  <text x="154" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Merkurius</text>

  <circle cx="205.3" cy="236.2" r="10" fill="#F59E0B"/>
  <text x="205" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Venus</text>

  <circle cx="255.8" cy="160.5" r="11" fill="#3B82F6"/>
  <text x="256" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Bumi</text>

  <circle cx="306.4" cy="241.7" r="8" fill="#EF4444"/>
  <text x="306" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Mars</text>

  <circle cx="367.2" cy="158.3" r="18" fill="#F59E0B"/>
  <text x="367" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Jupiter</text>

  <circle cx="432.4" cy="244.5" r="15" fill="#F59E0B"/>
  <ellipse cx="432.4" cy="244.5" rx="27" ry="8" fill="none" stroke="#6B7280" stroke-width="3" transform="rotate(-18 432.4 244.5)"/>
  <text x="432" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Saturnus</text>

  <circle cx="498.2" cy="162.5" r="12" fill="#3B82F6"/>
  <text x="498" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Uranus</text>

  <circle cx="569.4" cy="226.2" r="12" fill="#3B82F6"/>
  <text x="566" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Neptunus</text>
</svg>
