<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="ph-title ph-desc" font-family="Arial, 'Helvetica Neue', sans-serif">
  <title id="ph-title">Perbandingan Pecahan</title>
  <desc id="ph-desc">Diagram lingkaran yang membandingkan pecahan satu per dua, satu per empat, dan tiga per empat. Terlihat bahwa tiga per empat lebih besar dari satu per dua, dan satu per dua lebih besar dari satu per empat.</desc>

  <text x="200" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Perbandingan Pecahan</text>

  <!-- 1/2 -->
  <path d="M85,52 A48,48 0 0 1 85,148 Z" fill="#3B82F6"/>
  <circle cx="85" cy="100" r="48" fill="none" stroke="#6B7280" stroke-width="2"/>
  <line x1="85" y1="52" x2="85" y2="148" stroke="#6B7280" stroke-width="2"/>
  <text x="85" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">1/2</text>
  <text x="85" y="192" text-anchor="middle" font-size="11" fill="#6B7280">setengah</text>

  <!-- 1/4 -->
  <path d="M205,52 A48,48 0 0 1 253,100 Z" fill="#F97316"/>
  <circle cx="205" cy="100" r="48" fill="none" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="2">
    <line x1="205" y1="52" x2="205" y2="148"/>
    <line x1="157" y1="100" x2="253" y2="100"/>
  </g>
  <text x="205" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">1/4</text>
  <text x="205" y="192" text-anchor="middle" font-size="11" fill="#6B7280">seperempat</text>

  <!-- 3/4 -->
  <path d="M325,52 A48,48 0 0 1 373,100 A48,48 0 0 1 325,148 A48,48 0 0 1 277,100 Z" fill="#10B981"/>
  <circle cx="325" cy="100" r="48" fill="none" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#6B7280" stroke-width="2">
    <line x1="325" y1="52" x2="325" y2="148"/>
    <line x1="277" y1="100" x2="373" y2="100"/>
  </g>
  <text x="325" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">3/4</text>
  <text x="325" y="192" text-anchor="middle" font-size="11" fill="#6B7280">tiga perempat</text>
</svg>
