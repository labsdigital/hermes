<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Delapan fase bulan dalam satu siklus: bulan baru, sabit muda, kuartal pertama, cembung muda, purnama, cembung tua, kuartal terakhir, dan sabit tua.">
<title>Fase Bulan — Ilustrasi Edukatif SVG Inline</title>
<style>
  :root{
    --kuning:#F59E0B; --biru-gelap:#1E3A8A;
    --bg:#F8FAFC; --kartu:#FFFFFF; --teks:#1F2937; --abu:#6B7280; --garis:#E2E8F0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--teks);line-height:1.6}
  .wadah{max-width:1120px;margin:0 auto;padding:26px 16px 52px}
  header.atas{margin-bottom:20px}
  .kembali{display:inline-flex;align-items:center;gap:6px;color:var(--abu);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:10px;transition:color .2s}
  .kembali:hover{color:var(--kuning)}
  h1{font-size:clamp(1.5rem,3.5vw,2rem);letter-spacing:-.02em}
  .sub{color:var(--abu);font-size:1rem;margin-top:4px}
  figure.papan{background:var(--kartu);border:1px solid var(--garis);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
  figure svg{display:block;width:100%;height:auto;border-radius:10px}
  figcaption{margin-top:12px;font-size:.9rem;color:var(--abu);text-align:center}

  /* Animasi fase melayang */
  .fase{cursor:pointer;transition:transform .25s ease;transform-box:fill-box;transform-origin:center;animation:melayang 4.2s ease-in-out infinite alternate}
  .fase:hover{transform:scale(1.09);animation-play-state:paused}
  .fase:nth-of-type(1){animation-delay:-.0s}.fase:nth-of-type(2){animation-delay:-.5s}
  .fase:nth-of-type(3){animation-delay:-1s}.fase:nth-of-type(4){animation-delay:-1.5s}
  .fase:nth-of-type(5){animation-delay:-2s}.fase:nth-of-type(6){animation-delay:-2.5s}
  .fase:nth-of-type(7){animation-delay:-3s}.fase:nth-of-type(8){animation-delay:-3.5s}
  @keyframes melayang{from{transform:translateY(0)}to{transform:translateY(-5px)}}

  .kelip{animation:kelip 2.6s ease-in-out infinite}
  @keyframes kelip{50%{opacity:.25}}

  .fakta{margin-top:18px;background:var(--kartu);border-left:4px solid var(--kuning);border-radius:10px;padding:14px 18px;font-size:.92rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .fakta strong{color:var(--kuning)}

  @media print{
    body{background:#fff}
    .kembali,.fakta{display:none}
    figure.papan{box-shadow:none;border:none;padding:0}
    .fase,.kelip{animation:none!important}
  }
</style>
</head>
<body>
<div class="wadah">
  <header class="atas">
    <a class="kembali" href="index.html">&#8592; Kembali ke Galeri</a>
    <h1>Fase-Fase Bulan</h1>
    <p class="sub">IPA / Astronomi &#8226; Delapan fase bulan dalam satu siklus revolusi (&#177;29,5 hari).</p>
  </header>

  <main>
    <figure class="papan">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="fb-judul fb-desc" font-family="'Segoe UI', system-ui, sans-serif">
        <title id="fb-judul">Fase-Fase Bulan</title>
        <desc id="fb-desc">Delapan lingkaran menunjukkan fase bulan berurutan dari bulan baru, sabit muda, kuartal pertama, cembung muda, purnama, lalu kembali mengecil melalui cembung tua, kuartal terakhir, dan sabit tua.</desc>

        <!-- Panel langit malam -->
        <rect x="10" y="10" width="800" height="330" rx="20" fill="#1E3A8A"/>

        <!-- Bintang -->
        <g fill="#FFFFFF" opacity=".85">
          <circle cx="45" cy="42" r="1.7"/><circle cx="98" cy="66" r="1.4"/><circle cx="150" cy="38" r="1.8"/>
          <circle cx="205" cy="58" r="1.3"/><circle cx="262" cy="40" r="1.7"/><circle cx="320" cy="64" r="1.4"/>
          <circle cx="378" cy="32" r="1.8"/><circle cx="432" cy="60" r="1.4"/><circle cx="488" cy="44" r="1.7"/>
          <circle cx="545" cy="68" r="1.3"/><circle cx="600" cy="36" r="1.7"/><circle cx="652" cy="62" r="1.4"/>
          <circle cx="708" cy="40" r="1.8"/><circle cx="762" cy="64" r="1.4"/>
          <circle class="kelip" cx="70" cy="300" r="1.8"/><circle class="kelip" cx="180" cy="314" r="1.5" style="animation-delay:-.8s"/>
          <circle class="kelip" cx="300" cy="302" r="1.8" style="animation-delay:-1.4s"/><circle class="kelip" cx="430" cy="318" r="1.5" style="animation-delay:-2s"/>
          <circle class="kelip" cx="560" cy="304" r="1.8" style="animation-delay:-.4s"/><circle class="kelip" cx="700" cy="316" r="1.5" style="animation-delay:-1.1s"/>
        </g>

        <text x="410" y="52" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">Fase-Fase Bulan</text>
        <text x="410" y="74" text-anchor="middle" font-size="12.5" fill="#FFFFFF" opacity=".7">Satu siklus &#177; 29,5 hari</text>

        <text x="213" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F59E0B" opacity=".9">terang bertambah &#8594;</text>
        <text x="607" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F59E0B" opacity=".9">&#8592; terang berkurang</text>

        <defs>
          <marker id="panah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B" opacity=".75"/>
          </marker>
        </defs>

        <!-- FASE 1: Bulan Baru -->
        <g class="fase">
          <circle cx="65" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <text x="65" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Bulan Baru</text>
          <text x="65" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">0% terlihat</text>
        </g>

        <!-- FASE 2: Sabit Muda -->
        <g class="fase">
          <circle cx="163" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <path d="M163,136 A34,34 0 0 1 163,204 A15,34 0 0 0 163,136 Z" fill="#F59E0B"/>
          <text x="163" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Sabit Muda</text>
          <text x="163" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">&#177;25%</text>
        </g>

        <!-- FASE 3: Kuartal Pertama -->
        <g class="fase">
          <circle cx="261" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <path d="M261,136 A34,34 0 0 1 261,204 Z" fill="#F59E0B"/>
          <text x="261" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Kuartal Pertama</text>
          <text x="261" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">&#177;50%</text>
        </g>

        <!-- FASE 4: Cembung Muda -->
        <g class="fase">
          <circle cx="359" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <path d="M359,136 A34,34 0 0 1 359,204 A15,34 0 0 1 359,136 Z" fill="#F59E0B"/>
          <text x="359" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Cembung Muda</text>
          <text x="359" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">&#177;75%</text>
        </g>

        <!-- FASE 5: Purnama -->
        <g class="fase">
          <circle cx="457" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <circle cx="457" cy="170" r="34" fill="#F59E0B"/>
          <text x="457" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Purnama</text>
          <text x="457" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">100%</text>
        </g>

        <!-- FASE 6: Cembung Tua -->
        <g class="fase">
          <circle cx="555" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <path d="M555,136 A34,34 0 0 0 555,204 A15,34 0 0 0 555,136 Z" fill="#F59E0B"/>
          <text x="555" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Cembung Tua</text>
          <text x="555" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">&#177;75%</text>
        </g>

        <!-- FASE 7: Kuartal Terakhir -->
        <g class="fase">
          <circle cx="653" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <path d="M653,136 A34,34 0 0 0 653,204 Z" fill="#F59E0B"/>
          <text x="653" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Kuartal Terakhir</text>
          <text x="653" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">&#177;50%</text>
        </g>

        <!-- FASE 8: Sabit Tua -->
        <g class="fase">
          <circle cx="751" cy="170" r="34" fill="#000000" fill-opacity=".28" stroke="#F59E0B" stroke-opacity=".35"/>
          <path d="M751,136 A34,34 0 0 0 751,204 A15,34 0 0 1 751,136 Z" fill="#F59E0B"/>
          <text x="751" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Sabit Tua</text>
          <text x="751" y="247" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity=".65">&#177;25%</text>
        </g>

        <!-- Panah siklus berulang -->
        <path d="M751,262 C700,306 130,306 74,264" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6" opacity=".7" marker-end="url(#panah)"/>
        <text x="410" y="330" text-anchor="middle" font-size="11" font-weight="600" fill="#F59E0B" opacity=".85">siklus berulang setiap bulan</text>
      </svg>
      <figcaption>Bulan tidak bercahaya sendiri &#8212; fase-fase ini adalah pantulan cahaya matahari yang terlihat dari Bumi.</figcaption>
    </figure>

    <aside class="fakta">
      <strong>Tahukah kamu?</strong> Penanggalan Hijriah mengikuti fase bulan: awal bulan ditandai dengan munculnya sabit muda setelah matahari terbenam.
    </aside>
  </main>
</div>
</body>
</html>
