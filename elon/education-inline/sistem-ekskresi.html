<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Diagram sistem ekskresi manusia: ginjal, paru-paru, kulit, dan hati beserta zat sisa yang dikeluarkannya.">
<title>Sistem Ekskresi Manusia — Ilustrasi Edukatif SVG Inline</title>
<style>
  :root{
    --merah:#EF4444; --pink:#F472B6; --biru:#3B82F6;
    --bg:#F8FAFC; --kartu:#FFFFFF; --teks:#1F2937; --abu:#6B7280; --garis:#E2E8F0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--teks);line-height:1.6}
  .wadah{max-width:1040px;margin:0 auto;padding:26px 16px 52px}
  header.atas{margin-bottom:20px}
  .kembali{display:inline-flex;align-items:center;gap:6px;color:var(--abu);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:10px;transition:color .2s}
  .kembali:hover{color:var(--merah)}
  h1{font-size:clamp(1.5rem,3.5vw,2rem);letter-spacing:-.02em}
  .sub{color:var(--abu);font-size:1rem;margin-top:4px}
  figure.papan{background:var(--kartu);border:1px solid var(--garis);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
  figure svg{display:block;width:100%;height:auto;border-radius:10px}
  figcaption{margin-top:12px;font-size:.9rem;color:var(--abu);text-align:center}

  /* Interaktivitas */
  .organ{cursor:pointer;transition:transform .25s ease, filter .25s ease;transform-box:fill-box;transform-origin:center}
  .organ:hover{transform:scale(1.12);filter:brightness(1.12)}

  .fakta{margin-top:18px;background:var(--kartu);border-left:4px solid var(--merah);border-radius:10px;padding:14px 18px;font-size:.92rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .fakta strong{color:var(--merah)}

  @media print{
    body{background:#fff}
    .kembali,.fakta{display:none}
    figure.papan{box-shadow:none;border:none;padding:0}
  }
</style>
</head>
<body>
<div class="wadah">
  <header class="atas">
    <a class="kembali" href="index.html">&#8592; Kembali ke Galeri</a>
    <h1>Sistem Ekskresi Manusia</h1>
    <p class="sub">Biologi &#8226; Empat alat ekskresi utama dan zat sisa yang mereka keluarkan.</p>
  </header>

  <main>
    <figure class="papan">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="se-judul se-desc" font-family="'Segoe UI', system-ui, sans-serif">
        <title id="se-judul">Sistem Ekskresi Manusia</title>
        <desc id="se-desc">Siluet tubuh manusia dengan empat alat ekskresi bernomor: paru-paru membuang karbon dioksida dan uap air, hati menghasilkan empedu, ginjal menyaring darah menjadi urine, dan kulit mengeluarkan keringat.</desc>

        <rect x="0" y="0" width="560" height="480" rx="16" fill="#FFFFFF"/>

        <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Alat Ekskresi Manusia</text>

        <!-- Siluet tubuh -->
        <g fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5">
          <circle cx="235" cy="76" r="34"/>
          <rect x="222" y="106" width="26" height="16"/>
          <path d="M180,124 Q180,114 190,113 L280,113 Q290,114 290,124 L298,290 L172,290 L180,124 Z"/>
          <rect x="148" y="128" width="26" height="122" rx="13" transform="rotate(10 161 189)"/>
          <rect x="296" y="128" width="26" height="122" rx="13" transform="rotate(-10 309 189)"/>
          <rect x="194" y="288" width="32" height="128" rx="15"/>
          <rect x="244" y="288" width="32" height="128" rx="15"/>
        </g>

        <!-- Kulit (penanda garis luar) -->
        <g class="organ">
          <ellipse cx="161" cy="152" rx="17" ry="17" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-dasharray="5 4"/>
          <line x1="176" y1="140" x2="392" y2="112" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="4 4"/>
          <title>Kulit: mengeluarkan keringat lewat kelenjar keringat</title>
        </g>

        <!-- Paru-paru -->
        <g class="organ">
          <line x1="233" y1="118" x2="233" y2="142" stroke="#F472B6" stroke-width="5" stroke-linecap="round"/>
          <line x1="233" y1="138" x2="222" y2="150" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>
          <line x1="233" y1="138" x2="246" y2="150" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="220" cy="168" rx="14" ry="25" fill="#F472B6" transform="rotate(9 220 168)"/>
          <ellipse cx="248" cy="168" rx="14" ry="25" fill="#F472B6" transform="rotate(-9 248 168)"/>
          <title>Paru-paru: membuang CO&#8322; dan uap air saat bernapas</title>
        </g>

        <!-- Hati -->
        <g class="organ">
          <path d="M196,208 L240,206 C245,214 240,225 227,228 L200,224 C194,220 192,212 196,208 Z" fill="#3B82F6"/>
          <title>Hati: menghasilkan empedu yang membawa zat sisa</title>
        </g>

        <!-- Ginjal + ureter + kandung kemih -->
        <g class="organ">
          <path d="M206,232 C195,232 191,245 195,258 C198,268 212,268 215,258 C217,250 214,232 206,232 Z" fill="#EF4444"/>
          <path d="M268,232 C279,232 283,245 279,258 C276,268 262,268 259,258 C257,250 260,232 268,232 Z" fill="#EF4444"/>
          <path d="M210,262 C216,278 226,286 233,294" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M264,262 C258,278 248,286 241,294" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse cx="237" cy="300" rx="12" ry="10" fill="#EF4444"/>
          <title>Ginjal: menyaring darah dan menghasilkan urine</title>
        </g>

        <!-- Lencana nomor -->
        <g font-size="11.5" font-weight="700" text-anchor="middle">
          <circle cx="262" cy="134" r="10.5" fill="#F472B6"/><text x="262" y="138" fill="#FFFFFF">1</text>
          <circle cx="186" cy="216" r="10.5" fill="#3B82F6"/><text x="186" y="220" fill="#FFFFFF">2</text>
          <circle cx="284" cy="226" r="10.5" fill="#EF4444"/><text x="284" y="230" fill="#FFFFFF">3</text>
          <circle cx="146" cy="126" r="10.5" fill="#6B7280"/><text x="146" y="130" fill="#FFFFFF">4</text>
        </g>

        <!-- Legenda -->
        <g class="legenda" font-size="12.5" fill="#1F2937">
          <g>
            <rect x="376" y="96" width="170" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="394" cy="115" r="9" fill="#F472B6"/><text x="394" y="119" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1</text>
            <text x="410" y="114" font-weight="700">Paru-paru</text>
            <text x="410" y="132" font-size="10.5" fill="#6B7280">CO&#8322; &amp; uap air</text>
          </g>
          <g>
            <rect x="376" y="154" width="170" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="394" cy="173" r="9" fill="#3B82F6"/><text x="394" y="177" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">2</text>
            <text x="410" y="172" font-weight="700">Hati</text>
            <text x="410" y="190" font-size="10.5" fill="#6B7280">Empedu (zat sisa)</text>
          </g>
          <g>
            <rect x="376" y="212" width="170" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="394" cy="231" r="9" fill="#EF4444"/><text x="394" y="235" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">3</text>
            <text x="410" y="230" font-weight="700">Ginjal</text>
            <text x="410" y="248" font-size="10.5" fill="#6B7280">Urine (saringan darah)</text>
          </g>
          <g>
            <rect x="376" y="270" width="170" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="394" cy="289" r="9" fill="#6B7280"/><text x="394" y="293" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">4</text>
            <text x="410" y="288" font-weight="700">Kulit</text>
            <text x="410" y="306" font-size="10.5" fill="#6B7280">Keringat</text>
          </g>
        </g>

        <text x="280" y="452" text-anchor="middle" font-size="11.5" fill="#6B7280">Ekskresi = proses pembuangan zat sisa hasil metabolisme dari dalam tubuh.</text>
      </svg>
      <figcaption>Ginjal bekerja seperti penyaring air ultra-halus: setiap hari ia menyaring sekitar 180 liter cairan darahmu!</figcaption>
    </figure>

    <aside class="fakta">
      <strong>Tahukah kamu?</strong> Urine yang jernih menandakan tubuhmu cukup terhidrasi &#8212; warna kuning pekat adalah tanda kamu perlu minum lebih banyak air.
    </aside>
  </main>
</div>
</body>
</html>
