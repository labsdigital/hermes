<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Diagram interaktif bagian-bagian sel tumbuhan: dinding sel, membran sel, inti sel, vakuola, kloroplas, dan mitokondria.">
<title>Sel Tumbuhan — Ilustrasi Edukatif SVG Inline</title>
<style>
  :root{
    --hijau:#10B981; --coklat:#8B4513; --ungu:#8B5CF6;
    --bg:#F8FAFC; --kartu:#FFFFFF; --teks:#1F2937; --abu:#6B7280; --garis:#E2E8F0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--teks);line-height:1.6}
  .wadah{max-width:1040px;margin:0 auto;padding:26px 16px 52px}
  header.atas{margin-bottom:20px}
  .kembali{display:inline-flex;align-items:center;gap:6px;color:var(--abu);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:10px;transition:color .2s}
  .kembali:hover{color:var(--hijau)}
  h1{font-size:clamp(1.5rem,3.5vw,2rem);letter-spacing:-.02em}
  .sub{color:var(--abu);font-size:1rem;margin-top:4px}
  figure.papan{background:var(--kartu);border:1px solid var(--garis);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
  figure svg{display:block;width:100%;height:auto;border-radius:10px}
  figcaption{margin-top:12px;font-size:.9rem;color:var(--abu);text-align:center}

  /* Interaktivitas SVG */
  .organel{cursor:pointer;transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
  .organel:hover{transform:scale(1.14)}

  .fakta{margin-top:18px;background:var(--kartu);border-left:4px solid var(--hijau);border-radius:10px;padding:14px 18px;font-size:.92rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .fakta strong{color:var(--hijau)}

  @media print{
    body{background:#fff}
    .kembali,.fakta{display:none}
    figure.papan{box-shadow:none;border:none;padding:0}
  }
</style>
</head>
<body>
<div class="wadah">
  <header class="atas">
    <a class="kembali" href="index.html">&#8592; Kembali ke Galeri</a>
    <h1>Sel Tumbuhan</h1>
    <p class="sub">Biologi &#8226; Struktur sel eukariotik tumbuhan &#8212; arahkan kursor ke organel untuk melihat namanya.</p>
  </header>

  <main>
    <figure class="papan">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="st-judul st-desc" font-family="'Segoe UI', system-ui, sans-serif">
        <title id="st-judul">Diagram Bagian-Bagian Sel Tumbuhan</title>
        <desc id="st-desc">Ilustrasi sel tumbuhan persegi panjang membulat dengan enam bagian bernomor: dinding sel, membran sel, inti sel, vakuola, kloroplas, dan mitokondria, beserta legenda fungsinya.</desc>

        <rect x="0" y="0" width="560" height="440" rx="16" fill="#FFFFFF"/>

        <defs>
          <g id="st-kloroplas">
            <ellipse rx="24" ry="14" fill="#10B981"/>
            <line x1="-11" y1="-4" x2="11" y2="-4" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
            <line x1="-13" y1="3" x2="13" y2="3" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
            <circle r="2.4" cx="16" cy="0" fill="#FFFFFF" fill-opacity=".7"/>
          </g>
          <g id="st-mitokondria">
            <ellipse rx="21" ry="12" fill="#8B4513"/>
            <path d="M -12,0 Q -6,-7 0,0 Q 6,7 12,0" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </defs>

        <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Bagian-Bagian Sel Tumbuhan</text>

        <!-- Dinding sel -->
        <g class="organel">
          <rect x="55" y="55" width="270" height="330" rx="38" fill="none" stroke="#10B981" stroke-width="12"/>
          <title>Dinding sel: pelindung &amp; pemberi bentuk sel</title>
        </g>

        <!-- Sitoplasma -->
        <rect x="72" y="72" width="236" height="296" rx="30" fill="#10B981" fill-opacity=".06"/>

        <!-- Membran sel -->
        <g class="organel">
          <rect x="74" y="74" width="232" height="292" rx="28" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/>
          <title>Membran sel: mengatur keluar-masuk zat</title>
        </g>

        <!-- Vakuola besar -->
        <g class="organel">
          <rect x="160" y="140" width="138" height="210" rx="46" fill="#10B981" fill-opacity=".16" stroke="#10B981" stroke-width="2.5"/>
          <text x="229" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#065F45">Vakuola</text>
          <title>Vakuola: menyimpan air dan zat makanan</title>
        </g>

        <!-- Inti sel -->
        <g class="organel">
          <circle cx="122" cy="122" r="33" fill="#8B5CF6"/>
          <circle cx="113" cy="113" r="11" fill="#FFFFFF" fill-opacity=".35"/>
          <title>Inti sel: pusat kendali kegiatan sel</title>
        </g>

        <!-- Kloroplas -->
        <g class="organel"><use href="#st-kloroplas" transform="translate(228,102) rotate(-18)"/><title>Kloroplas: tempat fotosintesis</title></g>
        <g class="organel"><use href="#st-kloroplas" transform="translate(103,242) rotate(24)"/><title>Kloroplas: tempat fotosintesis</title></g>
        <g class="organel"><use href="#st-kloroplas" transform="translate(98,318) rotate(-12)"/><title>Kloroplas: tempat fotosintesis</title></g>

        <!-- Mitokondria -->
        <g class="organel"><use href="#st-mitokondria" transform="translate(107,172) rotate(-75)"/><title>Mitokondria: menghasilkan energi</title></g>
        <g class="organel"><use href="#st-mitokondria" transform="translate(272,118) rotate(18)"/><title>Mitokondria: menghasilkan energi</title></g>

        <!-- Lencana nomor -->
        <g font-size="11.5" font-weight="700" text-anchor="middle">
          <circle cx="325" cy="70" r="10.5" fill="#10B981"/><text x="325" y="74" fill="#FFFFFF">1</text>
          <circle cx="322" cy="98" r="10.5" fill="#6B7280"/><text x="322" y="102" fill="#FFFFFF">2</text>
          <circle cx="158" cy="96" r="10.5" fill="#8B5CF6"/><text x="158" y="100" fill="#FFFFFF">3</text>
          <circle cx="292" cy="238" r="10.5" fill="#10B981"/><text x="292" y="242" fill="#FFFFFF">4</text>
          <circle cx="76" cy="266" r="10.5" fill="#10B981"/><text x="76" y="270" fill="#FFFFFF">5</text>
          <circle cx="79" cy="150" r="10.5" fill="#8B4513"/><text x="79" y="154" fill="#FFFFFF">6</text>
        </g>

        <!-- Legenda -->
        <g class="legenda" font-size="12.5" fill="#1F2937">
          <g>
            <rect x="368" y="88" width="178" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="386" cy="105" r="9" fill="#10B981"/><text x="386" y="109" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1</text>
            <text x="402" y="104" font-weight="700">Dinding Sel</text>
            <text x="402" y="121" font-size="10.5" fill="#6B7280">Pelindung sel</text>
          </g>
          <g>
            <rect x="368" y="140" width="178" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="386" cy="157" r="9" fill="#6B7280"/><text x="386" y="161" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">2</text>
            <text x="402" y="156" font-weight="700">Membran Sel</text>
            <text x="402" y="173" font-size="10.5" fill="#6B7280">Pengatur lalu lintas zat</text>
          </g>
          <g>
            <rect x="368" y="192" width="178" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="386" cy="209" r="9" fill="#8B5CF6"/><text x="386" y="213" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">3</text>
            <text x="402" y="208" font-weight="700">Inti Sel</text>
            <text x="402" y="225" font-size="10.5" fill="#6B7280">Pusat kendali sel</text>
          </g>
          <g>
            <rect x="368" y="244" width="178" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="386" cy="261" r="9" fill="#10B981"/><text x="386" y="265" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">4</text>
            <text x="402" y="260" font-weight="700">Vakuola</text>
            <text x="402" y="277" font-size="10.5" fill="#6B7280">Menyimpan air &amp; zat</text>
          </g>
          <g>
            <rect x="368" y="296" width="178" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="386" cy="313" r="9" fill="#10B981"/><text x="386" y="317" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">5</text>
            <text x="402" y="312" font-weight="700">Kloroplas</text>
            <text x="402" y="329" font-size="10.5" fill="#6B7280">Tempat fotosintesis</text>
          </g>
          <g>
            <rect x="368" y="348" width="178" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="386" cy="365" r="9" fill="#8B4513"/><text x="386" y="369" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">6</text>
            <text x="402" y="364" font-weight="700">Mitokondria</text>
            <text x="402" y="381" font-size="10.5" fill="#6B7280">Menghasilkan energi</text>
          </g>
        </g>

        <text x="280" y="424" text-anchor="middle" font-size="11.5" fill="#6B7280">Hanya sel tumbuhan yang memiliki dinding sel, kloroplas, dan vakuola besar.</text>
      </svg>
      <figcaption>Vakuola pada sel tumbuhan sangat besar karena berfungsi menyimpan air agar tumbuhan tetap segar (turgid).</figcaption>
    </figure>

    <aside class="fakta">
      <strong>Tahukah kamu?</strong> Warna hijau daun berasal dari klorofil di dalam kloroplas &#8212; &#8220;dapur&#8221; tempat tumbuhan memasak makanannya dengan bantuan cahaya matahari.
    </aside>
  </main>
</div>
</body>
</html>
