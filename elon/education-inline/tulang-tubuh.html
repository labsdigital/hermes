<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Diagram rangka (tulang) tubuh manusia: tengkorak, tulang belakang, tulang rusuk, tulang tangan, panggul, dan tulang kaki.">
<title>Tulang Tubuh Manusia — Ilustrasi Edukatif SVG Inline</title>
<style>
  :root{
    --putih:#FFFFFF; --abu:#9CA3AF; --biru:#3B82F6;
    --bg:#F8FAFC; --kartu:#FFFFFF; --teks:#1F2937; --garis:#E2E8F0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--teks);line-height:1.6}
  .wadah{max-width:900px;margin:0 auto;padding:26px 16px 52px}
  header.atas{margin-bottom:20px}
  .kembali{display:inline-flex;align-items:center;gap:6px;color:var(--abu);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:10px;transition:color .2s}
  .kembali:hover{color:var(--biru)}
  h1{font-size:clamp(1.5rem,3.5vw,2rem);letter-spacing:-.02em}
  .sub{color:var(--abu);font-size:1rem;margin-top:4px}
  figure.papan{background:var(--kartu);border:1px solid var(--garis);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
  figure svg{display:block;width:100%;height:auto;border-radius:10px}
  figcaption{margin-top:12px;font-size:.9rem;color:var(--abu);text-align:center}

  /* Interaktivitas */
  .bone{cursor:pointer;transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
  .bone:hover{transform:scale(1.05)}

  .fakta{margin-top:18px;background:var(--kartu);border-left:4px solid var(--biru);border-radius:10px;padding:14px 18px;font-size:.92rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .fakta strong{color:var(--biru)}

  @media print{
    body{background:#fff}
    .kembali,.fakta{display:none}
    figure.papan{box-shadow:none;border:none;padding:0}
  }
</style>
</head>
<body>
<div class="wadah">
  <header class="atas">
    <a class="kembali" href="index.html">&#8592; Kembali ke Galeri</a>
    <h1>Tulang Tubuh Manusia</h1>
    <p class="sub">Biologi / IPA &#8226; Bagian-bagian utama rangka tubuh manusia.</p>
  </header>

  <main>
    <figure class="papan">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 585" role="img" aria-labelledby="tt-judul tt-desc" font-family="'Segoe UI', system-ui, sans-serif">
        <title id="tt-judul">Rangka Tubuh Manusia</title>
        <desc id="tt-desc">Ilustrasi rangka manusia dari depan dengan label tengkorak, tulang belakang, tulang rusuk, tulang tangan, tulang panggul, dan tulang kaki.</desc>

        <!-- Panel biru -->
        <rect x="10" y="10" width="440" height="565" rx="20" fill="#3B82F6"/>
        <text x="230" y="44" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">Rangka Tubuh Manusia</text>

        <g transform="translate(0,18)">
          <!-- Tengkorak -->
          <g class="bone" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5">
            <path d="M230,52 C258,52 272,74 270,96 C269,106 262,112 254,114 L254,124 C254,130 248,134 242,134 L218,134 C212,134 206,130 206,124 L206,114 C198,112 191,106 190,96 C188,74 202,52 230,52 Z"/>
            <circle cx="217" cy="94" r="7.5" fill="#3B82F6" stroke="none"/>
            <circle cx="243" cy="94" r="7.5" fill="#3B82F6" stroke="none"/>
            <polygon points="230,102 226,112 234,112" fill="#3B82F6" stroke="none"/>
            <title>Tengkorak: melindungi otak</title>
          </g>

          <!-- Selangkung bahu -->
          <g class="bone">
            <rect x="176" y="147" width="48" height="9" rx="4.5" fill="#FFFFFF" stroke="#9CA3AF"/>
            <rect x="236" y="147" width="48" height="9" rx="4.5" fill="#FFFFFF" stroke="#9CA3AF"/>
            <circle cx="174" cy="158" r="8" fill="#9CA3AF"/>
            <circle cx="286" cy="158" r="8" fill="#9CA3AF"/>
          </g>

          <!-- Tulang belakang -->
          <g class="bone" fill="#FFFFFF" stroke="#9CA3AF">
            <rect x="222" y="140" width="18" height="10" rx="4"/>
            <rect x="219" y="153" width="18" height="10" rx="4"/>
            <rect x="222" y="166" width="18" height="10" rx="4"/>
            <rect x="219" y="179" width="18" height="10" rx="4"/>
            <rect x="222" y="192" width="18" height="10" rx="4"/>
            <rect x="219" y="205" width="18" height="10" rx="4"/>
            <rect x="222" y="218" width="18" height="10" rx="4"/>
            <rect x="219" y="231" width="18" height="10" rx="4"/>
            <rect x="222" y="244" width="18" height="10" rx="4"/>
            <rect x="219" y="257" width="18" height="10" rx="4"/>
            <title>Tulang belakang: penopang tubuh &amp; pelindung saraf</title>
          </g>

          <!-- Tulang rusuk + tulang dada -->
          <g class="bone">
            <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
              <path d="M218,158 C190,160 172,172 174,190"/>
              <path d="M242,158 C270,160 288,172 286,190"/>
              <path d="M218,172 C186,176 168,192 172,212"/>
              <path d="M242,172 C274,176 292,192 288,212"/>
              <path d="M218,186 C184,192 166,210 172,232"/>
              <path d="M242,186 C276,192 294,210 288,232"/>
              <path d="M218,200 C186,208 172,226 178,246"/>
              <path d="M242,200 C274,208 288,226 282,246"/>
            </g>
            <rect x="223" y="146" width="14" height="56" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/>
            <title>Tulang rusuk: melindungi jantung dan paru-paru</title>
          </g>

          <!-- Tulang tangan -->
          <g class="bone">
            <line x1="172" y1="164" x2="160" y2="240" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
            <line x1="288" y1="164" x2="300" y2="240" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
            <circle cx="160" cy="245" r="5.5" fill="#9CA3AF"/>
            <circle cx="300" cy="245" r="5.5" fill="#9CA3AF"/>
            <line x1="156" y1="250" x2="148" y2="310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
            <line x1="165" y1="250" x2="159" y2="310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
            <line x1="304" y1="250" x2="312" y2="310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
            <line x1="295" y1="250" x2="301" y2="310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
            <circle cx="150" cy="320" r="7" fill="#FFFFFF"/>
            <circle cx="310" cy="320" r="7" fill="#FFFFFF"/>
            <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
              <line x1="145" y1="326" x2="139" y2="346"/><line x1="151" y1="327" x2="149" y2="349"/>
              <line x1="157" y1="326" x2="159" y2="347"/><line x1="161" y1="323" x2="167" y2="340"/>
              <line x1="157" y1="315" x2="167" y2="327" stroke-width="4"/>
              <line x1="315" y1="326" x2="321" y2="346"/><line x1="309" y1="327" x2="311" y2="349"/>
              <line x1="303" y1="326" x2="301" y2="347"/><line x1="299" y1="323" x2="293" y2="340"/>
              <line x1="303" y1="315" x2="293" y2="327" stroke-width="4"/>
            </g>
            <title>Tulang tangan: lengan atas, lengan bawah, dan jari</title>
          </g>

          <!-- Tulang panggul -->
          <g class="bone">
            <polygon points="230,264 214,284 230,300 246,284" fill="#FFFFFF" stroke="#9CA3AF"/>
            <ellipse cx="201" cy="280" rx="20" ry="15" fill="#FFFFFF" stroke="#9CA3AF" transform="rotate(-20 201 280)"/>
            <ellipse cx="259" cy="280" rx="20" ry="15" fill="#FFFFFF" stroke="#9CA3AF" transform="rotate(20 259 280)"/>
            <circle cx="204" cy="296" r="7" fill="#9CA3AF"/>
            <circle cx="256" cy="296" r="7" fill="#9CA3AF"/>
            <title>Panggul: menyangga organ tubuh bagian bawah</title>
          </g>

          <!-- Tulang kaki -->
          <g class="bone">
            <line x1="204" y1="300" x2="198" y2="392" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
            <line x1="256" y1="300" x2="262" y2="392" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
            <circle cx="197" cy="398" r="6.5" fill="#9CA3AF"/>
            <circle cx="263" cy="398" r="6.5" fill="#9CA3AF"/>
            <line x1="196" y1="406" x2="191" y2="494" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
            <line x1="205" y1="406" x2="202" y2="494" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
            <line x1="264" y1="406" x2="269" y2="494" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
            <line x1="255" y1="406" x2="258" y2="494" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
            <circle cx="192" cy="498" r="5" fill="#9CA3AF"/>
            <circle cx="268" cy="498" r="5" fill="#9CA3AF"/>
            <rect x="162" y="504" width="46" height="13" rx="6.5" fill="#FFFFFF" stroke="#9CA3AF"/>
            <rect x="252" y="504" width="46" height="13" rx="6.5" fill="#FFFFFF" stroke="#9CA3AF"/>
            <title>Tulang kaki: paha, betis, dan kaki untuk berdiri &amp; berjalan</title>
          </g>

          <!-- Label kiri -->
          <g font-size="12.5" font-weight="700" fill="#FFFFFF">
            <text x="20" y="86">Tengkorak</text>
            <text x="20" y="206">Tulang Rusuk</text>
            <text x="20" y="292">Tulang Panggul</text>
            <text x="20" y="430">Tulang Kaki</text>
          </g>
          <g stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.5">
            <line x1="93" y1="82" x2="190" y2="92"/>
            <line x1="110" y1="202" x2="166" y2="210"/>
            <line x1="125" y1="288" x2="180" y2="286"/>
            <line x1="100" y1="426" x2="192" y2="428"/>
          </g>

          <!-- Label kanan -->
          <g font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="end">
            <text x="440" y="215">Tulang Belakang</text>
            <text x="440" y="312">Tulang Tangan</text>
            <text x="440" y="372">Tulang Paha</text>
          </g>
          <g stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.5">
            <line x1="330" y1="211" x2="242" y2="213"/>
            <line x1="346" y1="308" x2="316" y2="316"/>
            <line x1="360" y1="368" x2="262" y2="370"/>
          </g>
        </g>

        <text x="230" y="562" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF" opacity=".85">Dewasa: 206 tulang &#8226; Bayi: &#177;300 tulang</text>
      </svg>
      <figcaption>Rangka memberi bentuk tubuh, melindungi organ vital, dan &#8212; bersama otot &#8212; memungkinkan kita bergerak.</figcaption>
    </figure>

    <aside class="fakta">
      <strong>Tahukah kamu?</strong> Tulang terpanjang di tubuhmu adalah tulang paha (femur), sedangkan yang terkecil adalah tulang sangkur di telinga dalam, seukuran biji beras.
    </aside>
  </main>
</div>
</body>
</html>
