<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Diagram interaktif bagian-bagian sel hewan: membran sel, inti sel, mitokondria, ribosom, dan retikulum endoplasma.">
<title>Sel Hewan — Ilustrasi Edukatif SVG Inline</title>
<style>
  :root{
    --pink:#F472B6; --ungu:#8B5CF6; --biru:#3B82F6;
    --bg:#F8FAFC; --kartu:#FFFFFF; --teks:#1F2937; --abu:#6B7280; --garis:#E2E8F0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--teks);line-height:1.6}
  .wadah{max-width:1040px;margin:0 auto;padding:26px 16px 52px}
  header.atas{margin-bottom:20px}
  .kembali{display:inline-flex;align-items:center;gap:6px;color:var(--abu);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:10px;transition:color .2s}
  .kembali:hover{color:var(--pink)}
  h1{font-size:clamp(1.5rem,3.5vw,2rem);letter-spacing:-.02em}
  .sub{color:var(--abu);font-size:1rem;margin-top:4px}
  figure.papan{background:var(--kartu);border:1px solid var(--garis);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
  figure svg{display:block;width:100%;height:auto;border-radius:10px}
  figcaption{margin-top:12px;font-size:.9rem;color:var(--abu);text-align:center}

  /* Interaktivitas SVG */
  .organel{cursor:pointer;transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
  .organel:hover{transform:scale(1.14)}

  .fakta{margin-top:18px;background:var(--kartu);border-left:4px solid var(--pink);border-radius:10px;padding:14px 18px;font-size:.92rem;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .fakta strong{color:var(--pink)}

  @media print{
    body{background:#fff}
    .kembali,.fakta{display:none}
    figure.papan{box-shadow:none;border:none;padding:0}
  }
</style>
</head>
<body>
<div class="wadah">
  <header class="atas">
    <a class="kembali" href="index.html">&#8592; Kembali ke Galeri</a>
    <h1>Sel Hewan</h1>
    <p class="sub">Biologi &#8226; Struktur sel eukariotik hewan &#8212; arahkan kursor ke organel untuk melihat namanya.</p>
  </header>

  <main>
    <figure class="papan">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="sh-judul sh-desc" font-family="'Segoe UI', system-ui, sans-serif">
        <title id="sh-judul">Diagram Bagian-Bagian Sel Hewan</title>
        <desc id="sh-desc">Ilustrasi sel hewan berbentuk tidak beraturan dengan lima bagian bernomor: membran sel, inti sel, mitokondria, ribosom, dan retikulum endoplasma, beserta legenda fungsinya.</desc>

        <rect x="0" y="0" width="560" height="440" rx="16" fill="#FFFFFF"/>

        <defs>
          <g id="sh-mitokondria">
            <ellipse rx="21" ry="12" fill="#3B82F6" fill-opacity=".3" stroke="#3B82F6" stroke-width="2"/>
            <path d="M -12,0 Q -6,-7 0,0 Q 6,7 12,0" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </defs>

        <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Bagian-Bagian Sel Hewan</text>

        <!-- Membran sel (sel hewan tidak berkuning dinding sel) -->
        <g class="organel">
          <path d="M205,58 C298,54 352,126 344,214 C337,300 276,356 194,352 C112,348 62,288 68,204 C74,124 122,62 205,58 Z"
                fill="#F472B6" fill-opacity=".08" stroke="#F472B6" stroke-width="4.5"/>
          <title>Membran sel: pembatas sel &amp; pengatur keluar-masuk zat</title>
        </g>

        <!-- Inti sel -->
        <g class="organel">
          <circle cx="178" cy="176" r="35" fill="#8B5CF6"/>
          <circle cx="169" cy="167" r="11.5" fill="#FFFFFF" fill-opacity=".35"/>
          <title>Inti sel: pusat kendali aktivitas sel</title>
        </g>

        <!-- Retikulum endoplasma -->
        <g class="organel" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" opacity=".85">
          <path d="M216,142 Q254,160 246,198 Q240,230 212,240"/>
          <path d="M228,128 Q274,154 264,202 Q258,242 226,252"/>
          <path d="M142,148 Q116,170 124,204 Q130,228 156,240"/>
          <title>Retikulum endoplasma: jalur transportasi materi dalam sel</title>
        </g>
        <!-- Ribosom menempel pada RE -->
        <g fill="#3B82F6">
          <circle cx="243" cy="163" r="3"/>
          <circle cx="251" cy="189" r="3"/>
          <circle cx="238" cy="226" r="3"/>
          <circle cx="131" cy="180" r="3"/>
          <circle cx="139" cy="222" r="3"/>
        </g>

        <!-- Mitokondria -->
        <g class="organel">
          <use href="#sh-mitokondria" transform="translate(288,158) rotate(24)"/>
          <title>Mitokondria: pembangkit energi sel</title>
        </g>
        <g class="organel">
          <use href="#sh-mitokondria" transform="translate(150,298) rotate(-32)"/>
          <title>Mitokondria: pembangkit energi sel</title>
        </g>

        <!-- Ribosom bebas -->
        <g class="organel" fill="#3B82F6">
          <circle cx="247" cy="95" r="3.4"/>
          <circle cx="312" cy="232" r="3.4"/>
          <circle cx="232" cy="318" r="3.4"/>
          <circle cx="118" cy="124" r="3.4"/>
          <circle cx="298" cy="296" r="3.4"/>
          <circle cx="92" cy="232" r="3.4"/>
          <circle cx="256" cy="268" r="3.4"/>
          <circle cx="134" cy="244" r="3.4"/>
          <title>Ribosom: tempat sintesis protein</title>
        </g>

        <!-- Lencana nomor -->
        <g font-size="11.5" font-weight="700" text-anchor="middle">
          <circle cx="338" cy="86" r="10.5" fill="#F472B6"/><text x="338" y="90" fill="#FFFFFF">1</text>
          <circle cx="144" cy="142" r="10.5" fill="#8B5CF6"/><text x="144" y="146" fill="#FFFFFF">2</text>
          <circle cx="308" cy="132" r="10.5" fill="#3B82F6"/><text x="308" y="136" fill="#FFFFFF">3</text>
          <circle cx="318" cy="262" r="10.5" fill="#3B82F6"/><text x="318" y="266" fill="#FFFFFF">4</text>
          <circle cx="266" cy="118" r="10.5" fill="#3B82F6"/><text x="266" y="122" fill="#FFFFFF">5</text>
        </g>

        <!-- Legenda -->
        <g class="legenda" font-size="12.5" fill="#1F2937">
          <g>
            <rect x="372" y="88" width="172" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="390" cy="105" r="9" fill="#F472B6"/><text x="390" y="109" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1</text>
            <text x="406" y="104" font-weight="700">Membran Sel</text>
            <text x="406" y="121" font-size="10.5" fill="#6B7280">Pembatas &amp; pengatur zat</text>
          </g>
          <g>
            <rect x="372" y="140" width="172" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="390" cy="157" r="9" fill="#8B5CF6"/><text x="390" y="161" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">2</text>
            <text x="406" y="156" font-weight="700">Inti Sel</text>
            <text x="406" y="173" font-size="10.5" fill="#6B7280">Pusat kendali aktivitas</text>
          </g>
          <g>
            <rect x="372" y="192" width="172" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="390" cy="209" r="9" fill="#3B82F6"/><text x="390" y="213" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">3</text>
            <text x="406" y="208" font-weight="700">Mitokondria</text>
            <text x="406" y="225" font-size="10.5" fill="#6B7280">Pembangkit energi</text>
          </g>
          <g>
            <rect x="372" y="244" width="172" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="390" cy="261" r="9" fill="#3B82F6"/><text x="390" y="265" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">4</text>
            <text x="406" y="260" font-weight="700">Ribosom</text>
            <text x="406" y="277" font-size="10.5" fill="#6B7280">Sintesis protein</text>
          </g>
          <g>
            <rect x="372" y="296" width="172" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="390" cy="316" r="9" fill="#3B82F6"/><text x="390" y="320" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">5</text>
            <text x="406" y="312" font-weight="700">Retikulum Endoplasma</text>
            <text x="406" y="332" font-size="10.5" fill="#6B7280">Transportasi material</text>
          </g>
        </g>

        <text x="280" y="424" text-anchor="middle" font-size="11.5" fill="#6B7280">Sel hewan tidak memiliki dinding sel dan vakuola besar seperti pada sel tumbuhan.</text>
      </svg>
      <figcaption>Bentuk sel hewan tidak beraturan karena hanya dibatasi membran sel yang lentur.</figcaption>
    </figure>

    <aside class="fakta">
      <strong>Tahukah kamu?</strong> Tubuhmu tersusun dari sekitar 30 triliun sel hewan &#8212; mulai dari sel saraf sepanjang 1 meter hingga sel darah mungil berdiameter 7 mikrometer.
    </aside>
  </main>
</div>
</body>
</html>
