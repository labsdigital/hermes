<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Agent Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 30px;
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .subtitle { color: #888; font-size: 1rem; }
    .refresh-btn {
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: transform 0.2s;
    }
    .refresh-btn:hover { transform: scale(1.05); }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .stat-value { font-size: 2rem; font-weight: bold; color: #00d9ff; }
    .stat-label { color: #888; font-size: 0.9rem; margin-top: 5px; }
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    .agent-card {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 25px;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .agent-card:hover {
      transform: translateY(-5px);
      border-color: var(--agent-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .agent-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .agent-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: var(--agent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-right: 15px;
    }
    .agent-name { font-size: 1.3rem; font-weight: bold; }
    .agent-type { font-size: 0.8rem; color: #888; }
    .agent-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .agent-stat {
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 10px;
    }
    .agent-stat-value { font-size: 1.2rem; font-weight: bold; }
    .agent-stat-label { font-size: 0.75rem; color: #888; }
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      margin-top: 10px;
    }
    .status-synced { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
    .status-empty { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
    .activity-section {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 25px;
    }
    .activity-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .activity-list { max-height: 300px; overflow-y: auto; }
    .activity-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .activity-hash {
      font-family: monospace;
      color: #00d9ff;
      margin-right: 15px;
      font-size: 0.85rem;
    }
    .activity-message { flex: 1; font-size: 0.9rem; }
    .footer {
      text-align: center;
      padding: 30px;
      color: #666;
      font-size: 0.85rem;
    }
    .last-update { color: #00d9ff; }
    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
      .agents-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 HERMES AGENT DASHBOARD</h1>
      <p class="subtitle">Static Monitoring Report</p>
      <p style="color: #666; margin-top: 10px;">Last generated: <span id="gen-time">-</span></p>
      <button class="refresh-btn" onclick="location.reload()">🔄 Refresh</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="total-agents">4</div>
        <div class="stat-label">Total Agents</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-articles">0</div>
        <div class="stat-label">Total Articles</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-proposals">0</div>
        <div class="stat-label">Proposals</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-commits">0</div>
        <div class="stat-label">Commits</div>
      </div>
    </div>

    <div class="agents-grid" id="agents-grid"></div>

    <div class="activity-section">
      <h3 class="activity-title">📊 Recent Activity</h3>
      <div class="activity-list" id="activity-list"></div>
    </div>

    <div class="footer">
      <p>Powered by Hermes Agent • Generated: <span class="last-update" id="footer-time">-</span></p>
      <p>Source: https://github.com/labsdigital/hermes</p>
    </div>
  </div>

    const activityData = [

    function renderAgents() {
      const grid = document.getElementById('agents-grid');
      const config = [
        { name: 'Max', type: 'AI Researcher', icon: '👨‍💼', color: '#3498db' },
        { name: 'Elon', type: 'Web Developer', icon: '🚀', color: '#e74c3c' },
        { name: 'Chalbi', type: 'Rumi Scholar', icon: '🕌', color: '#9b59b6' },
        { name: 'Taraka', type: 'Foundation Manager', icon: '🏛️', color: '#2ecc71' }
      ];

      grid.innerHTML = agentsData.map((agent, i) => {
        const c = config[i] || { type: 'Agent', icon: '🤖', color: '#95a5a6' };
        return `
          <div class="agent-card" style="--agent-color: ${c.color}">
            <div class="agent-header">
              <div class="agent-icon">${c.icon}</div>
              <div>
                <div class="agent-name">@${agent.name}</div>
                <div class="agent-type">${c.type}</div>
              </div>
            </div>
            <div class="agent-stats">
              <div class="agent-stat">
                <div class="agent-stat-value">${agent.articles}</div>
                <div class="agent-stat-label">Articles</div>
              </div>
              <div class="agent-stat">
                <div class="agent-stat-value">${agent.proposals || 0}</div>
                <div class="agent-stat-label">Proposals</div>
              </div>
            </div>
            <div class="status-badge ${agent.syncStatus === 'synced' ? 'status-synced' : 'status-empty'}">
              ${agent.syncStatus === 'synced' ? '✅ Synced' : '🔄 Empty'}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderActivity() {
      const list = document.getElementById('activity-list');
      list.innerHTML = activityData.slice(0, 10).map(item => `
        <div class="activity-item">
          <span class="activity-hash">${item.hash || '#'}</span>
          <span class="activity-message">${item.message}</span>
        </div>
      `).join('');
    }

    function updateStats() {
      const totalArticles = agentsData.reduce((sum, a) => sum + a.articles, 0);
      document.getElementById('total-articles').textContent = totalArticles;
      document.getElementById('total-proposals').textContent = agentsData.reduce((sum, a) => sum + (a.proposals || 0), 0);
      document.getElementById('total-commits').textContent = activityData.length;
      
      const now = new Date().toLocaleString('id-ID');
      document.getElementById('gen-time').textContent = now;
      document.getElementById('footer-time').textContent = now;
    }

    renderAgents();
    renderActivity();
    updateStats();
  </script>
</body>
</html>
