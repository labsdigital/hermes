<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Evolusi Alat Manusia</text>
  <text x="400" y="65" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="14">2 Juta Tahun → Sekarang</text>
  
  <line x1="80" y1="300" x2="720" y2="300" stroke="#e94560" stroke-width="3"/>
  
  <g transform="translate(100, 150)">
    <rect width="140" height="100" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="12" font-weight="bold">ERA OTOT</text>
    <text x="70" y="50" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="10">2.6 juta - 3500 SM</text>
    <text x="70" y="70" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Batu Tajam</text>
    <text x="70" y="85" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Roda, Api</text>
  </g>
  
  <g transform="translate(280, 150)">
    <rect width="140" height="100" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="12" font-weight="bold">ERA UAP</text>
    <text x="70" y="50" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="10">1760 - 1900</text>
    <text x="70" y="70" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Mesin Uap</text>
    <text x="70" y="85" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Revolusi Industri</text>
  </g>
  
  <g transform="translate(460, 150)">
    <rect width="140" height="100" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="12" font-weight="bold">ERA LISTRIK</text>
    <text x="70" y="50" text-anchor="middle" fill="#8892b0" font-family="Inter, sans-serif" font-size="10">1880 - 1940</text>
    <text x="70" y="70" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Produksi Massal</text>
    <text x="70" y="85" text-anchor="middle" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Komunikasi</text>
  </g>
  
  <g transform="translate(640, 150)">
    <rect width="140" height="100" rx="8" fill="#e94560" stroke="#fff" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">ERA DIGITAL</text>
    <text x="70" y="50" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">1947 - Sekarang</text>
    <text x="70" y="70" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">Transistor → AI</text>
    <text x="70" y="85" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="10">Kecerdasan Buatan</text>
  </g>
  
  <g transform="translate(500, 380)">
    <rect width="250" height="160" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
    <text x="125" y="30" text-anchor="middle" fill="#e94560" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Paradoks Ketergantungan</text>
    <text x="20" y="60" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">Semakin canggih alat,</text>
    <text x="20" y="75" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">semakin manusia</text>
    <text x="20" y="90" fill="#8892b0" font-family="Inter, sans-serif" font-size="11">bergantung padanya.</text>
    <line x1="20" y1="100" x2="230" y2="100" stroke="#e94560" stroke-width="1"/>
    <text x="20" y="120" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Api → Pencernaan berubah</text>
    <text x="20" y="135" fill="#ccd6f6" font-family="Inter, sans-serif" font-size="10">Roda → Infrastruktur wajib</text>
    <text x="20" y="150" fill="#e94560" font-family="Inter, sans-serif" font-size="10">AI → Cognitive dependency?</text>
  </g>
</svg>
